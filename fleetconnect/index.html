<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleetConnect</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="theme.css">
</head>
<body>
    <script src="supabase-client.js"></script>
    <script>
        // Redirect to role-appropriate dashboard (or login if not authenticated)
        const user = getCurrentUser();
        if (user) {
            window.location.replace(getDashboardUrl(user.role));
        } else {
            window.location.replace('login.html');
        }
    </script>

    <div style="position:fixed;top:16px;right:16px;z-index:9999;"></div>
    
    <script src="theme-toggle.js"></script>
</body>
</html>
