<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleetConnect | Fleet Management Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --bg-card: #12121a;
            --bg-input: #1a1a24;
            --border: #2a2a3a;
            --text-primary: #ffffff;
            --text-secondary: #8a8a9a;
            --text-muted: #5a5a6a;
            --accent: #00d4aa;
            --accent-glow: rgba(0, 212, 170, 0.3);
            --accent-blue: #00a8ff;
            --warning: #ffaa00;
            --admin: #a855f7;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'DM Sans', sans-serif; 
            background: var(--bg-dark); 
            color: var(--text-primary); 
            min-height: 100vh;
            line-height: 1.6;
        }
        body::before { 
            content: ''; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background-image: 
                linear-gradient(rgba(0, 212, 170, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 170, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 60px;
        }
        .logo {
            font-family: 'Space Mono', monospace;
            font-size: 1.5rem;
            color: var(--accent);
            letter-spacing: -1px;
            text-decoration: none;
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .user-name {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .role-badge {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .role-badge.admin { background: var(--admin); color: white; }
        .role-badge.rental { background: var(--accent-blue); color: white; }
        .role-badge.vendor { background: var(--accent); color: var(--bg-dark); }
        .role-badge.fieldworker { background: var(--warning); color: var(--bg-dark); }
        .logout-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 6px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }
        .logout-btn:hover {
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }

        .hero {
            text-align: center;
            margin-bottom: 60px;
        }
        .hero h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .hero h1 span {
            color: var(--accent);
        }
        .hero p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .actions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 48px;
        }

        .action-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.2s;
            display: block;
        }
        .action-card:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 212, 170, 0.1);
        }
        .action-card.disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .action-icon {
            font-size: 2rem;
            margin-bottom: 16px;
        }
        .action-card h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .action-card p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }
        .action-card .arrow {
            display: inline-block;
            margin-top: 16px;
            color: var(--accent);
            font-size: 0.85rem;
            font-weight: 500;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 48px;
        }
        @media (max-width: 800px) {
            .stats-row { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 500px) {
            .stats-row { grid-template-columns: 1fr; }
            .hero h1 { font-size: 1.75rem; }
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            font-family: 'Space Mono', monospace;
            color: var(--accent);
        }
        .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .login-prompt {
            text-align: center;
            padding: 80px 20px;
        }
        .login-prompt h2 {
            font-size: 1.5rem;
            margin-bottom: 12px;
        }
        .login-prompt p {
            color: var(--text-secondary);
            margin-bottom: 32px;
        }
        .login-btn {
            display: inline-block;
            padding: 16px 40px;
            background: var(--accent);
            color: var(--bg-dark);
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--accent-glow);
        }

        .loading-spinner {
            text-align: center;
            padding: 60px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="nav">
            <a href="index.html" class="logo">FLEETCONNECT</a>
            <div class="nav-right" id="navRight">
                <div class="loading-spinner">Loading...</div>
            </div>
        </nav>

        <div id="mainContent">
            <div class="loading-spinner">Loading...</div>
        </div>
    </div>

    <script src="supabase-client.js"></script>
    <script>
        const currentUser = getCurrentUser();

        async function loadDashboard() {
            if (currentUser) {
                // Logged in - show nav
                document.getElementById('navRight').innerHTML = `
                    <div class="user-info">
                        <span class="role-badge ${currentUser.role}">${currentUser.role}</span>
                        <span class="user-name">${currentUser.name}</span>
                    </div>
                    <button class="logout-btn" onclick="logout()">Logout</button>
                `;

                // Load stats from database
                const jobs = await getAllJobs();
                const users = await getAllUsers();
                const deliveries = await getAllDeliveries();

                const stats = {
                    total: jobs.length,
                    active: jobs.filter(j => ['assigned', 'accepted', 'in-progress'].includes(j.status)).length,
                    completed: jobs.filter(j => j.status === 'completed').length,
                    users: users.length
                };

                let actionsHtml = '';
                let welcomeText = '';

                if (currentUser.role === 'admin') {
                    welcomeText = 'Admin Control Center';
                    actionsHtml = `
                        <a href="admin-dashboard.html" class="action-card">
                            <div class="action-icon">👥</div>
                            <h3>Manage Users</h3>
                            <p>Create and manage accounts for rental companies, vendors, and field workers.</p>
                            <span class="arrow">Open Dashboard →</span>
                        </a>
                        <a href="job-history.html" class="action-card">
                            <div class="action-icon">📋</div>
                            <h3>All Jobs</h3>
                            <p>View and search all work orders across the platform.</p>
                            <span class="arrow">View Jobs →</span>
                        </a>
                        <a href="create-job.html" class="action-card">
                            <div class="action-icon">➕</div>
                            <h3>Create Work Order</h3>
                            <p>Manually create a work order on behalf of a rental company.</p>
                            <span class="arrow">Create Order →</span>
                        </a>
                    `;
                } else if (currentUser.role === 'rental') {
                    welcomeText = 'Rental Company Portal';
                    actionsHtml = `
                        <a href="rental-dashboard.html" class="action-card">
                            <div class="action-icon">📊</div>
                            <h3>My Orders</h3>
                            <p>Track your active work orders, view delivery history, and close completed jobs.</p>
                            <span class="arrow">View Orders →</span>
                        </a>
                        <a href="create-job.html" class="action-card">
                            <div class="action-icon">➕</div>
                            <h3>Create Work Order</h3>
                            <p>Submit a new fuel delivery, equipment tow, or service request.</p>
                            <span class="arrow">Create Order →</span>
                        </a>
                        <a href="job-history.html" class="action-card">
                            <div class="action-icon">📋</div>
                            <h3>Full History</h3>
                            <p>Search all past work orders for audits and records.</p>
                            <span class="arrow">View History →</span>
                        </a>
                    `;
                } else if (currentUser.role === 'vendor') {
                    welcomeText = 'Vendor Dashboard';
                    actionsHtml = `
                        <a href="vendor-dashboard.html" class="action-card">
                            <div class="action-icon">🚚</div>
                            <h3>My Jobs</h3>
                            <p>View assigned jobs, accept or decline, and manage your work queue.</p>
                            <span class="arrow">Open Dashboard →</span>
                        </a>
                        <a href="job-history.html" class="action-card">
                            <div class="action-icon">📋</div>
                            <h3>Job History</h3>
                            <p>Search completed jobs and review past work orders.</p>
                            <span class="arrow">View History →</span>
                        </a>
                    `;
                } else if (currentUser.role === 'fieldworker') {
                    welcomeText = 'Field Worker Portal';
                    actionsHtml = `
                        <a href="field-worker.html" class="action-card">
                            <div class="action-icon">📱</div>
                            <h3>My Assignments</h3>
                            <p>View your assigned jobs, get directions, and log fuel deliveries.</p>
                            <span class="arrow">View Jobs →</span>
                        </a>
                    `;
                }

                document.getElementById('mainContent').innerHTML = `
                    <div class="hero">
                        <h1>Welcome back, <span>${currentUser.name.split(' ')[0]}</span></h1>
                        <p>${welcomeText}</p>
                    </div>

                    <div class="section-title">Quick Actions</div>
                    <div class="actions-grid">
                        ${actionsHtml}
                    </div>

                    <div class="section-title">Overview</div>
                    <div class="stats-row">
                        <div class="stat-card">
                            <div class="stat-value">${stats.total}</div>
                            <div class="stat-label">Total Jobs</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${stats.active}</div>
                            <div class="stat-label">Active</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${stats.completed}</div>
                            <div class="stat-label">Completed</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${stats.users}</div>
                            <div class="stat-label">Users</div>
                        </div>
                    </div>
                `;
            } else {
                // Not logged in
                document.getElementById('navRight').innerHTML = `
                    <a href="login.html" class="logout-btn">Sign In</a>
                `;

                document.getElementById('mainContent').innerHTML = `
                    <div class="hero">
                        <h1>Fleet Management <span>Simplified</span></h1>
                        <p>Connect rental companies with vendors and field workers. Streamline fuel delivery, equipment towing, and service requests.</p>
                    </div>

                    <div class="actions-grid">
                        <div class="action-card disabled">
                            <div class="action-icon">🏢</div>
                            <h3>Rental Companies</h3>
                            <p>Create work orders, assign vendors, and track job progress in real-time.</p>
                        </div>
                        <div class="action-card disabled">
                            <div class="action-icon">🚚</div>
                            <h3>Vendors</h3>
                            <p>Receive job assignments, manage field workers, and complete service requests.</p>
                        </div>
                        <div class="action-card disabled">
                            <div class="action-icon">👷</div>
                            <h3>Field Workers</h3>
                            <p>Mobile-friendly job list with navigation, contact info, and delivery logging.</p>
                        </div>
                    </div>

                    <div class="login-prompt">
                        <h2>Ready to get started?</h2>
                        <p>Sign in to access your dashboard</p>
                        <a href="login.html" class="login-btn">Sign In</a>
                    </div>
                `;
            }
        }

        loadDashboard();
    </script>
</body>
</html>
