<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Work Order | FleetConnect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-dark: #0a0a0f; --bg-card: #12121a; --bg-input: #1a1a24; --border: #2a2a3a; --text-primary: #ffffff; --text-secondary: #8a8a9a; --text-muted: #5a5a6a; --accent: #00d4aa; --accent-glow: rgba(0, 212, 170, 0.3); --error: #ff6b6b; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; line-height: 1.6; }
        body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(0, 212, 170, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 170, 0.03) 1px, transparent 1px); background-size: 50px 50px; pointer-events: none; z-index: 0; }
        .container { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        .logo { font-family: 'Space Mono', monospace; font-size: 1.5rem; color: var(--accent); letter-spacing: -1px; text-decoration: none; }
        .nav-right { display: flex; align-items: center; gap: 24px; }
        .nav-links { display: flex; gap: 24px; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent); }
        .logout-btn { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-family: 'DM Sans', sans-serif; }
        .header { margin-bottom: 32px; }
        .header h1 { font-size: 2rem; font-weight: 700; margin-bottom: 8px; }
        .header p { color: var(--text-secondary); }
        .form-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 32px; }
        .form-section { margin-bottom: 32px; padding-bottom: 32px; border-bottom: 1px solid var(--border); }
        .form-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .section-label { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); margin-bottom: 20px; }
        .form-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 20px; }
        .form-row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
        @media (max-width: 600px) { .form-row, .form-row-3 { grid-template-columns: 1fr; } }
        .form-group { margin-bottom: 0; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 8px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 14px; font-family: 'DM Sans', sans-serif; font-size: 0.95rem; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); }
        .form-group textarea { min-height: 100px; resize: vertical; }
        .mono { font-family: 'Space Mono', monospace; }
        .required { color: var(--error); margin-left: 2px; }
        .submit-btn { width: 100%; padding: 16px; font-family: 'DM Sans', sans-serif; font-size: 1rem; font-weight: 600; background: var(--accent); color: var(--bg-dark); border: none; border-radius: 10px; cursor: pointer; margin-top: 24px; }
        .submit-btn:hover { box-shadow: 0 8px 24px var(--accent-glow); }
        .submit-btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .success-message { display: none; text-align: center; padding: 60px 20px; }
        .success-message.show { display: block; }
        .success-icon { font-size: 4rem; margin-bottom: 24px; }
        .success-message h2 { font-size: 1.75rem; margin-bottom: 12px; }
        .success-message p { color: var(--text-secondary); margin-bottom: 32px; }
        .btn-outline { padding: 12px 24px; background: transparent; color: var(--accent); border: 1px solid var(--accent); border-radius: 8px; text-decoration: none; display: inline-block; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <nav class="nav">
            <a href="index.html" class="logo">FLEETCONNECT</a>
            <div class="nav-right">
                <div class="nav-links">
                    <a href="index.html">Home</a>
                    <a href="create-job.html" class="active">New Order</a>
                    <a href="job-history.html">History</a>
                </div>
                <span id="userName" style="color: var(--text-secondary); font-size: 0.9rem;"></span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </nav>
        <header class="header">
            <h1>Create Work Order</h1>
            <p>Submit a new service request</p>
        </header>
        <div class="form-card" id="formCard">
            <form id="workOrderForm">
                <div class="form-section">
                    <div class="section-label">Order Information</div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Contract #<span class="required">*</span></label>
                            <input type="text" id="contractNumber" class="mono" required>
                        </div>
                        <div class="form-group">
                            <label>P.O. #<span class="required">*</span></label>
                            <input type="text" id="poNumber" class="mono" required>
                        </div>
                    </div>
                </div>
                <div class="form-section">
                    <div class="section-label">Job Site</div>
                    <div class="form-group" style="margin-bottom: 20px;">
                        <label>Job Site Name<span class="required">*</span></label>
                        <input type="text" id="jobSiteName" required>
                    </div>
                    <div class="form-group" style="margin-bottom: 20px;">
                        <label>Street Address</label>
                        <input type="text" id="addressStreet">
                    </div>
                    <div class="form-row-3">
                        <div class="form-group"><label>City</label><input type="text" id="addressCity"></div>
                        <div class="form-group"><label>State</label><input type="text" id="addressState" maxlength="2"></div>
                        <div class="form-group"><label>ZIP</label><input type="text" id="addressZip"></div>
                    </div>
                </div>
                <div class="form-section">
                    <div class="section-label">Contact</div>
                    <div class="form-row">
                        <div class="form-group"><label>Contact Name</label><input type="text" id="contactName"></div>
                        <div class="form-group"><label>Contact Phone</label><input type="tel" id="contactPhone"></div>
                    </div>
                </div>
                <div class="form-section">
                    <div class="section-label">Service Details</div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Job Type<span class="required">*</span></label>
                            <select id="jobType" required>
                                <option value="fuel-delivery">Fuel Delivery</option>
                                <option value="equipment-tow">Equipment Tow</option>
                                <option value="emergency-fuel">Emergency Fuel</option>
                                <option value="pickup">Pickup</option>
                                <option value="delivery">Delivery</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Priority</label>
                            <select id="priority">
                                <option value="normal">Normal</option>
                                <option value="urgent">Urgent</option>
                                <option value="emergency">Emergency</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Date Needed</label><input type="date" id="dateOut"></div>
                        <div class="form-group"><label>Time</label><input type="time" id="timeOut"></div>
                    </div>
                    <div class="form-group">
                        <label>Special Instructions</label>
                        <textarea id="instructions" placeholder="Gate codes, directions..."></textarea>
                    </div>
                </div>
                <button type="submit" class="submit-btn" id="submitBtn">Create Work Order</button>
            </form>
        </div>
        <div class="success-message" id="successMessage">
            <div class="success-icon">✓</div>
            <h2>Work Order Created!</h2>
            <p>Your order has been submitted.</p>
            <a href="index.html" class="btn-outline">Back to Dashboard</a>
        </div>
    </div>
    <script src="supabase-client.js"></script>
    <script>
        const currentUser = checkAuth();
        if (currentUser) document.getElementById('userName').textContent = currentUser.name;
        document.getElementById('dateOut').value = new Date().toISOString().split('T')[0];
        document.getElementById('workOrderForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Creating...';
            const jobData = {
                contractNumber: document.getElementById('contractNumber').value,
                poNumber: document.getElementById('poNumber').value,
                jobSiteName: document.getElementById('jobSiteName').value,
                address: {
                    street: document.getElementById('addressStreet').value,
                    city: document.getElementById('addressCity').value,
                    state: document.getElementById('addressState').value,
                    zip: document.getElementById('addressZip').value
                },
                contactName: document.getElementById('contactName').value,
                contactPhone: document.getElementById('contactPhone').value,
                jobType: document.getElementById('jobType').value,
                priority: document.getElementById('priority').value,
                dateOut: document.getElementById('dateOut').value,
                timeOut: document.getElementById('timeOut').value,
                instructions: document.getElementById('instructions').value,
                status: 'pending',
                createdBy: currentUser?.id
            };
            const result = await createJob(jobData, []);
            if (result.success) {
                document.getElementById('formCard').style.display = 'none';
                document.getElementById('successMessage').classList.add('show');
            } else {
                alert('Error: ' + result.error);
                btn.disabled = false;
                btn.textContent = 'Create Work Order';
            }
        });
    </script>
</body>
</html>
