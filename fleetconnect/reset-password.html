<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script>
      // Theme init - prevent flash of wrong theme
      (function(){
        var t = localStorage.getItem('fleetconnect-theme');
        if(t === 'light') document.documentElement.classList.add('light-mode');
      })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FleetConnect — Reset your password">
    <meta property="og:title" content="FleetConnect — Reset Password">
    <meta property="og:description" content="Securely reset your FleetConnect account password.">
    <title>Reset Password | FleetConnect</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2300d4aa'/><text x='16' y='22' font-size='18' font-weight='bold' fill='%230a0a0f' text-anchor='middle' font-family='sans-serif'>F</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #06060b;
            --bg-dark: #0a0a12;
            --bg-card: #0f0f1a;
            --bg-card-hover: #141422;
            --bg-input: #111119;
            --border: #1e1e30;
            --border-focus: #00d4aa;
            --text-primary: #f0f0f5;
            --text-secondary: #7a7a92;
            --text-muted: #4a4a5e;
            --accent: #00d4aa;
            --accent-dim: #00a886;
            --accent-glow: rgba(0, 212, 170, 0.15);
            --accent-glow-strong: rgba(0, 212, 170, 0.35);
            --error: #ff5c5c;
            --error-bg: rgba(255, 92, 92, 0.08);
            --error-border: rgba(255, 92, 92, 0.25);
            --success: #00d4aa;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --shadow-card: 0 4px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px var(--border);
            --shadow-glow: 0 0 40px rgba(0, 212, 170, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', -apple-system, sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        /* Background effects */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 20% 80%, rgba(0, 212, 170, 0.07), transparent),
                radial-gradient(ellipse 60% 50% at 80% 20%, rgba(0, 100, 180, 0.04), transparent);
            pointer-events: none;
            z-index: -2;
        }

        /* Main container */
        .reset-container {
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 1;
        }

        /* Card */
        .reset-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 48px 40px;
            box-shadow: var(--shadow-card);
            animation: fadeUp 0.5s ease-out;
        }

        /* Header */
        .reset-header {
            margin-bottom: 32px;
            text-align: center;
        }

        .reset-header .logo-mark {
            width: 48px;
            height: 48px;
            background: var(--accent);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 24px;
            color: var(--bg-deep);
            box-shadow: 0 0 25px rgba(0, 212, 170, 0.25);
            margin: 0 auto 20px;
        }

        .reset-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }

        .reset-header p {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* Message states */
        .message {
            display: none;
            padding: 14px 16px;
            border-radius: var(--radius-sm);
            font-size: 13.5px;
            margin-bottom: 24px;
            align-items: center;
            gap: 12px;
            animation: slideDown 0.3s ease-out;
        }

        .message.show {
            display: flex;
        }

        .message.error {
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error);
        }

        .message.success {
            background: rgba(0, 212, 170, 0.08);
            border: 1px solid rgba(0, 212, 170, 0.25);
            color: var(--success);
        }

        .message.info {
            background: rgba(58, 134, 255, 0.08);
            border: 1px solid rgba(58, 134, 255, 0.25);
            color: #3a86ff;
        }

        .message svg {
            flex-shrink: 0;
            width: 18px;
            height: 18px;
        }

        /* Invalid token state */
        .invalid-token {
            text-align: center;
            padding: 32px 0;
        }

        .invalid-token svg {
            width: 64px;
            height: 64px;
            color: var(--error);
            margin-bottom: 16px;
        }

        .invalid-token p {
            font-size: 15px;
            color: var(--text-secondary);
            margin-bottom: 24px;
            line-height: 1.6;
        }

        /* Form */
        .reset-form {
            display: none;
        }

        .reset-form.show {
            display: block;
            animation: fadeUp 0.4s ease-out;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            transition: all 0.25s ease;
            outline: none;
        }

        .input-wrapper input::placeholder {
            color: var(--text-muted);
        }

        .input-wrapper input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow), var(--shadow-glow);
            background: var(--bg-card);
        }

        .input-wrapper input.error {
            border-color: var(--error);
            box-shadow: 0 0 0 3px var(--error-bg);
        }

        /* Password strength indicator */
        .strength-meter {
            margin-top: 8px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
            height: 6px;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            background: #666;
            transition: width 0.2s, background 0.2s;
        }

        .strength-bar.weak { background: #ff5c5c; width: 33%; }
        .strength-bar.medium { background: #fbbf24; width: 66%; }
        .strength-bar.strong { background: #22c55e; width: 100%; }

        .strength-text {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            text-transform: capitalize;
        }

        .strength-text.weak { color: #ff5c5c; }
        .strength-text.medium { color: #fbbf24; }
        .strength-text.strong { color: #22c55e; }

        .input-error {
            font-size: 13px;
            color: var(--error);
            margin-top: 6px;
            display: none;
        }

        .input-error.show {
            display: block;
        }

        /* Password toggle */
        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .password-toggle:hover {
            color: var(--text-secondary);
        }

        .password-toggle svg {
            width: 18px;
            height: 18px;
        }

        .input-wrapper input[type="password"] {
            padding-right: 46px;
        }

        /* Submit button */
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: var(--accent);
            color: var(--bg-deep);
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
            margin-top: 8px;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .submit-btn:hover:not(:disabled) {
            box-shadow: 0 0 30px rgba(0, 212, 170, 0.3), 0 4px 20px rgba(0, 212, 170, 0.15);
            transform: translateY(-1px);
        }

        .submit-btn:hover:not(:disabled)::before {
            opacity: 1;
        }

        .submit-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Loading spinner */
        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(6, 6, 11, 0.2);
            border-top-color: var(--bg-deep);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        .submit-btn.loading .spinner { display: block; }
        .submit-btn.loading .btn-text { display: none; }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Success state */
        .success-state {
            display: none;
            text-align: center;
        }

        .success-state.show {
            display: block;
            animation: fadeUp 0.5s ease-out;
        }

        .success-state svg {
            width: 80px;
            height: 80px;
            color: var(--success);
            margin-bottom: 20px;
        }

        .success-state h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .success-state p {
            font-size: 15px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .success-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 13px 20px;
            background: rgba(0, 212, 170, 0.1);
            border: 1px solid rgba(0, 212, 170, 0.25);
            border-radius: var(--radius-sm);
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .success-link:hover {
            background: rgba(0, 212, 170, 0.2);
            transform: translateY(-1px);
        }

        /* Animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .reset-card {
                padding: 32px 24px;
            }

            .reset-header h1 {
                font-size: 24px;
            }

            .reset-header p {
                font-size: 14px;
            }
        }
    
        /* Light Mode */
        .light-mode { --bg-dark: #f5f5f5; --bg-card: #ffffff; --bg-input: #e8e8e8; --bg-hover: #e8e8e8; --border: #d0d0d0; --text-primary: #1a1a1a; --text-secondary: #555555; --text-muted: #888888; }
        /* Sidebar styles removed — reset-password page has no sidebar */
        .light-mode .nav-section-title, .light-mode .admin-nav-section { color: #888888 !important; }
        .light-mode .user-menu { background: #e8e8e8 !important; }
        .light-mode .user-name { color: #1a1a1a !important; }
        .light-mode .header { background: #ffffff !important; border-color: #d0d0d0 !important; }
        .light-mode .header h1 { color: #1a1a1a !important; }
        .light-mode .header-subtitle { color: #555555 !important; }
        .light-mode .main, .light-mode .content, .light-mode .admin-main { background: #f5f5f5 !important; }
        .light-mode .card, .light-mode .stat-card, .light-mode .metric-card, .light-mode .admin-card { background: #ffffff !important; border-color: #d0d0d0 !important; }
        .light-mode .card-title, .light-mode .stat-label { color: #1a1a1a !important; }
        .light-mode .card-subtitle { color: #555555 !important; }
        .light-mode input, .light-mode textarea, .light-mode select { background: #e8e8e8 !important; border-color: #d0d0d0 !important; color: #1a1a1a !important; }
        .light-mode input::placeholder, .light-mode textarea::placeholder { color: #888888 !important; }
        .light-mode .form-label, .light-mode label { color: #1a1a1a !important; }
        .light-mode .badge { background: #dbeafe !important; color: #2563eb !important; }
        .light-mode .btn-secondary { background: #e8e8e8 !important; color: #1a1a1a !important; border-color: #d0d0d0 !important; }
        .light-mode .btn-secondary:hover { background: #d0d0d0 !important; }
        /* Sidebar footer styles removed — reset-password page has no sidebar */
        .light-mode .logout-btn:hover { background: #e8e8e8 !important; }
        .light-mode table th { background: #e8e8e8 !important; color: #1a1a1a !important; border-color: #d0d0d0 !important; }
        .light-mode table td { border-color: #d0d0d0 !important; color: #1a1a1a !important; }
        .light-mode table tr:hover { background: #e8e8e8 !important; }
        .light-mode .modal-overlay { background: rgba(0,0,0,0.3) !important; }
        .light-mode .modal, .light-mode .modal-content { background: #ffffff !important; border-color: #d0d0d0 !important; color: #1a1a1a !important; }
        .light-mode.light-mode .search-box, .light-mode .search-input { background: #e8e8e8 !important; border-color: #d0d0d0 !important; color: #1a1a1a !important; }
        .light-mode .tab, .light-mode .tab-btn { color: #555555 !important; }
        .light-mode .tab.active, .light-mode .tab-btn.active { color: #3b82f6 !important; border-color: #3b82f6 !important; }
        .light-mode .dropdown, .light-mode .dropdown-menu { background: #ffffff !important; border-color: #d0d0d0 !important; }
        .light-mode .dropdown-item:hover { background: #e8e8e8 !important; }
        .light-mode .toggle-switch { background: #d0d0d0 !important; }
        .light-mode .toggle-switch.active { background: #2563eb !important; }
        .light-mode .tooltip { background: #1a1a1a !important; color: #ffffff !important; }
        .light-mode .progress-bar { background: #e8e8e8 !important; }
        .light-mode .empty-state { color: #555555 !important; }
        .light-mode .filter-bar, .light-mode .toolbar { background: #ffffff !important; border-color: #d0d0d0 !important; }
        .light-mode .chip { background: #e8e8e8 !important; color: #1a1a1a !important; }
        .light-mode pre, .light-mode code { background: #e8e8e8 !important; color: #1a1a1a !important; }
        .light-mode .status-badge { border-color: #d0d0d0 !important; }
        .light-mode ::selection { background: #3b82f6; color: #ffffff; }
        .light-mode ::-webkit-scrollbar-track { background: #f5f5f5; }
        .light-mode ::-webkit-scrollbar-thumb { background: #d0d0d0; }
        .light-mode ::-webkit-scrollbar-thumb:hover { background: #bbbbbb; }

</style>
</head>
<body>

    <div class="reset-container">
        <div class="reset-card">
            <!-- Header -->
            <div class="reset-header">
                <div class="logo-mark">F</div>
                <h1>Reset Password</h1>
                <p id="headerSubtitle">Enter your new password to regain access to your account</p>
            </div>

            <!-- Messages -->
            <div class="message error" id="errorMessage">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
                </svg>
                <span id="errorText"></span>
            </div>

            <!-- Invalid token state -->
            <div class="invalid-token" id="invalidTokenState">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 9v2m0 4v2m-6-4a9 9 0 1118 0 9 9 0 01-18 0z"/>
                </svg>
                <p>Invalid or expired reset link</p>
                <a href="login.html" class="success-link">Back to Login</a>
            </div>

            <!-- Reset form -->
            <form class="reset-form" id="resetForm" novalidate>
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <div class="input-wrapper">
                        <input
                            type="password"
                            id="newPassword"
                            name="newPassword"
                            placeholder="Enter new password (min 8 characters)"
                            minlength="8"
                            required
                        >
                        <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">
                            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                    <div class="strength-meter">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                    <div class="strength-text" id="strengthText"></div>
                    <div class="input-error" id="newPasswordError"></div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrapper">
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Re-enter your password"
                            minlength="8"
                            required
                        >
                    </div>
                    <div class="input-error" id="confirmPasswordError"></div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="spinner"></span>
                    <span class="btn-text">Reset Password</span>
                </button>

                <a href="login.html" style="display: block; text-align: center; margin-top: 16px; color: var(--text-secondary); text-decoration: none; font-size: 14px;">Back to Login</a>
            </form>

            <!-- Success state -->
            <div class="success-state" id="successState">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                <h2>Password Reset</h2>
                <p>Your password has been successfully reset. You can now sign in with your new password.</p>
                <a href="login.html" class="success-link">Go to Login</a>
            </div>
        </div>
    </div>

    <script>
        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        const resetForm = document.getElementById('resetForm');
        const invalidTokenState = document.getElementById('invalidTokenState');
        const successState = document.getElementById('successState');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const submitBtn = document.getElementById('submitBtn');
        const newPasswordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const toggleBtn = document.getElementById('togglePassword');
        const eyeIcon = document.getElementById('eyeIcon');

        let passwordVisible = false;

        // Check token validity
        if (!token) {
            invalidTokenState.style.display = 'block';
            resetForm.classList.remove('show');
        } else {
            resetForm.classList.add('show');
        }

        // Password strength calculation
        function calculatePasswordStrength(password) {
            let strength = 0;
            if (password.length >= 8) strength++;
            if (password.length >= 12) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;

            if (strength <= 1) return 'weak';
            if (strength <= 3) return 'medium';
            return 'strong';
        }

        // Password input listener
        newPasswordInput.addEventListener('input', (e) => {
            const password = e.target.value;
            const strength = calculatePasswordStrength(password);
            const bar = document.getElementById('strengthBar');
            const text = document.getElementById('strengthText');

            bar.className = 'strength-bar ' + strength;
            text.className = 'strength-text ' + strength;
            if (password) {
                text.textContent = strength.charAt(0).toUpperCase() + strength.slice(1) + ' password';
            } else {
                text.textContent = '';
            }

            errorMessage.classList.remove('show');
            var _newP = document.getElementById('newPasswordError'); if(_newP) _newP.classList.remove('show');
        });

        // Confirm password listener
        confirmPasswordInput.addEventListener('input', () => {
            errorMessage.classList.remove('show');
            var _conf = document.getElementById('confirmPasswordError'); if(_conf) _conf.classList.remove('show');
        });

        // Password toggle
        toggleBtn.addEventListener('click', (e) => {
            e.preventDefault();
            passwordVisible = !passwordVisible;
            newPasswordInput.type = passwordVisible ? 'text' : 'password';
            toggleBtn.setAttribute('aria-label', passwordVisible ? 'Hide password' : 'Show password');
            eyeIcon.innerHTML = passwordVisible
                ? '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
                : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
        });

        // Form submission
        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            const errors = {};

            // Validation
            if (!newPassword || newPassword.length < 8) {
                errors.newPassword = 'Password must be at least 8 characters';
            }

            if (newPassword !== confirmPassword) {
                errors.confirmPassword = 'Passwords do not match';
            }

            // Show errors
            if (Object.keys(errors).length > 0) {
                if (errors.newPassword) {
                    var _newP = document.getElementById('newPasswordError'); if(_newP) _newP.textContent = errors.newPassword;
                    var _newP = document.getElementById('newPasswordError'); if(_newP) _newP.classList.add('show');
                }
                if (errors.confirmPassword) {
                    var _conf = document.getElementById('confirmPasswordError'); if(_conf) _conf.textContent = errors.confirmPassword;
                    var _conf = document.getElementById('confirmPasswordError'); if(_conf) _conf.classList.add('show');
                }
                return;
            }

            // Submit
            submitBtn.disabled = true;
            submitBtn.classList.add('loading');
            errorMessage.classList.remove('show');

            try {
                const response = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: token,
                        newPassword: newPassword
                    })
                });

                const data = await response.json();

                if (data.success) {
                    resetForm.style.display = 'none';
                    successState.classList.add('show');
                } else {
                    errorText.textContent = data.error || 'Failed to reset password. Please try again.';
                    errorMessage.classList.add('show');
                }
            } catch (err) {
                console.error('Reset password error:', err);
                errorText.textContent = 'Connection error. Please try again.';
                errorMessage.classList.add('show');
            }

            submitBtn.disabled = false;
            submitBtn.classList.remove('loading');
        });
    </script>

    

    <div style="position:fixed;top:16px;right:16px;z-index:9999;"></div>
</body>
</html>
