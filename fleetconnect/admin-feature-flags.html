<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feature Flags | FleetConnect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        
        
        
        .container { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 24px 32px; }

        .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        .logo { font-family: 'Inter', sans-serif; font-size: 1.1rem; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; text-decoration: none; }
        .nav-right { display: flex; align-items: center; gap: 24px; }
        .nav-links { display: flex; gap: 24px; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: color 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: var(--admin); }
        .admin-badge { background: var(--admin); color: white; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .user-name { font-size: 0.9rem; color: var(--text-secondary); }
        .logout-btn { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); padding: 8px 16px; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
        .logout-btn:hover { border-color: var(--error); color: var(--error); }

        .header { margin-bottom: 32px; }
        .header h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; }
        .header p { color: var(--text-secondary); }

        /* Role Tabs */
        .role-tabs { display: flex; gap: 8px; margin-bottom: 24px; }
        .role-tab { padding: 10px 24px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-secondary); transition: all 0.2s; }
        .role-tab:hover { border-color: var(--text-secondary); color: var(--text-primary); }
        .role-tab.active { border-color: var(--admin); color: var(--admin); background: rgba(96, 165, 250, 0.1); }
        .role-tab .count { font-size: 0.75rem; margin-left: 6px; opacity: 0.7; }

        /* Stats */
        .stats-row { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
        .mini-stat { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
        .mini-stat .stat-icon { font-size: 1.2rem; }
        .mini-stat .stat-info { }
        .mini-stat .stat-num { font-size: 1.1rem; font-weight: 700; }
        .mini-stat .stat-label { font-size: 0.7rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
        .mini-stat .stat-num.green { color: var(--success); }
        .mini-stat .stat-num.yellow { color: var(--warning); }
        .mini-stat .stat-num.blue { color: var(--accent-blue); }

        /* Category Section */
        .category-section { margin-bottom: 28px; }
        .category-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .category-title { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-secondary); }
        .category-badge { font-size: 0.7rem; padding: 3px 10px; border-radius: 4px; font-weight: 600; }
        .category-badge.pages { background: rgba(96, 165, 250, 0.15); color: var(--accent-blue); }
        .category-badge.analytics { background: rgba(168, 85, 247, 0.15); color: #a855f7; }
        .category-badge.features { background: rgba(34, 197, 94, 0.15); color: var(--success); }
        .bulk-btns { display: flex; gap: 8px; }
        .bulk-btn { font-size: 0.7rem; padding: 4px 10px; border-radius: 4px; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); font-family: 'Inter', sans-serif; transition: all 0.15s; }
        .bulk-btn:hover { border-color: var(--text-secondary); color: var(--text-primary); }

        /* Flag Card */
        .flags-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 12px; }
        @media (max-width: 600px) { .flags-grid { grid-template-columns: 1fr; } }
        .flag-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; gap: 16px; transition: border-color 0.2s; }
        .flag-card:hover { border-color: var(--gray-400); }
        .flag-card.disabled { opacity: 0.6; }
        .flag-info { flex: 1; min-width: 0; }
        .flag-label { font-size: 0.9rem; font-weight: 600; margin-bottom: 2px; }
        .flag-desc { font-size: 0.78rem; color: var(--text-secondary); line-height: 1.4; }
        .flag-key { font-size: 0.65rem; color: var(--text-muted); font-family: monospace; margin-top: 4px; }

        /* Toggle Switch */
        .toggle { position: relative; width: 48px; height: 26px; flex-shrink: 0; }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .toggle-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--gray-400); border-radius: 26px; transition: 0.25s; }
        .toggle-slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: 0.25s; }
        .toggle input:checked + .toggle-slider { background-color: var(--success); }
        .toggle input:checked + .toggle-slider:before { transform: translateX(22px); }
        .toggle-slider:hover { background-color: var(--gray-500); }
        .toggle input:checked + .toggle-slider:hover { background-color: #1fa855; }

        /* Toast */
        .toast { position: fixed; bottom: 24px; right: 24px; padding: 14px 24px; border-radius: 10px; font-size: 0.85rem; font-weight: 500; z-index: 1000; transform: translateY(100px); opacity: 0; transition: all 0.3s; font-family: 'Inter', sans-serif; }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: var(--success); color: white; }
        .toast.error { background: var(--error); color: white; }

        

        /* Changelog Section */
        .changelog-section { margin-top: 48px; padding-top: 32px; border-top: 1px solid var(--border); }
        .changelog-header { margin-bottom: 20px; }
        .changelog-header h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
        .changelog-header p { font-size: 0.85rem; color: var(--text-secondary); }
        .changelog-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
        .changelog-empty { padding: 24px; text-align: center; color: var(--text-secondary); font-size: 0.9rem; }
        .changelog-list { max-height: 600px; overflow-y: auto; }
        .changelog-entry { padding: 14px 20px; border-bottom: 1px solid var(--gray-300); display: flex; justify-content: space-between; align-items: start; gap: 16px; transition: background-color 0.2s; }
        .changelog-entry:hover { background-color: var(--bg-card); }
        .changelog-entry:last-child { border-bottom: none; }
        .changelog-entry-content { flex: 1; }
        .changelog-entry-flag { font-size: 0.85rem; font-weight: 600; color: var(--text-primary); }
        .changelog-entry-role { font-size: 0.75rem; color: var(--text-secondary); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
        .changelog-entry-change { font-size: 0.8rem; margin-top: 6px; padding: 4px 8px; border-radius: 4px; display: inline-block; font-weight: 600; }
        .changelog-entry-change.enabled { background: rgba(34, 197, 94, 0.15); color: var(--success); }
        .changelog-entry-change.disabled { background: rgba(239, 68, 68, 0.15); color: var(--error); }
        .changelog-entry-time { font-size: 0.75rem; color: var(--text-secondary); white-space: nowrap; }

<body>
    <aside class="admin-sidebar" id="adminSidebar">
        <div class="admin-sidebar-logo">FLEETCONNECT</div>
<nav id="sidebarNav"></nav>
        <div class="admin-sidebar-footer">
            <div style="padding: 12px; background: var(--bg-hover, var(--gray-300)); border-radius: 8px;">
                <div style="font-size: 0.8rem; font-weight: 600; color: var(--text-primary, var(--text-primary)); margin-bottom: 4px;" id="adminUserName">System Admin</div>
                <div style="font-size: 0.75rem; color: var(--text-secondary, var(--text-muted));">Administrator</div>
                <button onclick="logout()" style="margin-top: 8px; width: 100%; padding: 6px; background: transparent; border: 1px solid var(--gray-300); color: var(--text-muted); border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 0.75rem; cursor: pointer; transition: all 0.2s;">Logout</button>
            </div>
        </div>
    </aside>

    <div class="main-content">
    <div class="container">
<header class="header">
            <div>
                <h1>Feature Flags</h1>
                <p>Control which features are visible to each role. Toggle features on or off instantly.</p>
            </div>
            <button onclick="refreshFlags()" style="padding:10px 20px;background:#60a5fa;color:#fff;border:none;border-radius:8px;font-size:0.85rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;">🔄 Refresh Flags</button>
        </header>

        <!-- Role Tabs -->
        <div class="role-tabs" id="roleTabs">
            <button class="role-tab active" data-role="vendor" onclick="switchRole('vendor', this)">
                Vendor <span class="count" id="countVendor"></span>
            </button>
            <button class="role-tab" data-role="rental" onclick="switchRole('rental', this)">
                Rental <span class="count" id="countRental"></span>
            </button>
            <button class="role-tab" data-role="fieldworker" onclick="switchRole('fieldworker', this)">
                Field Worker <span class="count" id="countFieldworker"></span>
            </button>
        </div>

        <!-- Stats Row -->
        <div class="stats-row" id="statsRow">
            <div class="mini-stat">
                <div class="stat-icon">🟢</div>
                <div class="stat-info">
                    <div class="stat-num green" id="statEnabled">-</div>
                    <div class="stat-label">Enabled</div>
                </div>
            </div>
            <div class="mini-stat">
                <div class="stat-icon">⭕</div>
                <div class="stat-info">
                    <div class="stat-num yellow" id="statDisabled">-</div>
                    <div class="stat-label">Disabled</div>
                </div>
            </div>
            <div class="mini-stat">
                <div class="stat-icon">📦</div>
                <div class="stat-info">
                    <div class="stat-num blue" id="statTotal">-</div>
                    <div class="stat-label">Total</div>
                </div>
            </div>
        </div>

        <!-- Flags Container -->
        <div id="flagsContainer">
            <div class="loading">Loading feature flags...</div>
        </div>

        <!-- Changelog Section -->
        <div class="changelog-section">
            <div class="changelog-header">
                <h2>Recent Changes</h2>
                <p>Last 10 flag modifications</p>
            </div>
            <div class="changelog-panel" id="changelogPanel">
                <div class="changelog-empty">No changes yet</div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script src="supabase-client.js"></script>
    <script src="sidebar.js"></script>
    <script src="feature-flags.js"></script>
    <script>
        let allFlags = [];
        let currentRole = 'vendor';

        document.addEventListener('DOMContentLoaded', async () => {
            const user = checkAuth(['admin']);
            if (!user) return;

            var _un = document.getElementById('userName'); if(_un) _un.textContent = user.name || 'Admin';

            await loadFlags();
            renderChangelog();
        });

        async function loadFlags() {
            try {
                allFlags = await FC_FLAGS.getAllFlags();
                updateRoleCounts();
                renderFlags(currentRole);
            } catch (err) {
                console.error('Failed to load flags:', err);
                var _flag = document.getElementById('flagsContainer'); if(_flag) _flag.innerHTML = '<div class="loading">Failed to load feature flags. Please refresh.</div>';
            }
        }

        function switchRole(role, btn) {
            currentRole = role;
            document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            renderFlags(role);
        }

        function updateRoleCounts() {
            const roles = ['vendor', 'rental', 'fieldworker'];
            roles.forEach(role => {
                const count = allFlags.filter(f => f.role === role).length;
                const el = document.getElementById('count' + role.charAt(0).toUpperCase() + role.slice(1));
                if (el) el.textContent = '(' + count + ')';
            });
        }

        function renderFlags(role) {
            const roleFlags = allFlags.filter(f => f.role === role);
            const enabled = roleFlags.filter(f => f.enabled).length;
            const disabled = roleFlags.filter(f => !f.enabled).length;

            var _stat = document.getElementById('statEnabled'); if(_stat) _stat.textContent = enabled;
            var _stat = document.getElementById('statDisabled'); if(_stat) _stat.textContent = disabled;
            var _stat = document.getElementById('statTotal'); if(_stat) _stat.textContent = roleFlags.length;

            // Group by category
            const categories = {};
            roleFlags.forEach(f => {
                const cat = f.category || 'other';
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push(f);
            });

            // Category display order
            const catOrder = ['pages', 'analytics', 'features', 'other'];
            const catLabels = { pages: 'Pages', analytics: 'Analytics & Dashboards', features: 'Features', other: 'Other' };

            let html = '';
            catOrder.forEach(cat => {
                if (!categories[cat] || categories[cat].length === 0) return;

                const flags = categories[cat];
                const enabledCount = flags.filter(f => f.enabled).length;

                html += `
                <div class="category-section">
                    <div class="category-header">
                        <div style="display:flex;align-items:center;gap:10px;">
                            <span class="category-title">${safe(catLabels[cat] || cat)}</span>
                            <span class="category-badge ${cat}">${enabledCount}/${flags.length} on</span>
                        </div>
                        <div class="bulk-btns">
                            <button class="bulk-btn" onclick="bulkToggle('${role}', '${cat}', true)">Enable All</button>
                            <button class="bulk-btn" onclick="bulkToggle('${role}', '${cat}', false)">Disable All</button>
                        </div>
                    </div>
                    <div class="flags-grid">
                `;

                flags.forEach(f => {
                    html += `
                    <div class="flag-card ${f.enabled ? '' : 'disabled'}" id="card-${f.role}-${f.feature_key.replace(/\./g, '-')}">
                        <div class="flag-info">
                            <div class="flag-label">${safe(f.label)}</div>
                            <div class="flag-desc">${safe(f.description || '')}</div>
                            <div class="flag-key">${safe(f.role)}.${safe(f.feature_key)}</div>
                        </div>
                        <label class="toggle">
                            <input type="checkbox" ${f.enabled ? 'checked' : ''} onchange="toggleFlag('${f.role}', '${f.feature_key}', this.checked, this)">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    `;
                });

                html += '</div></div>';
            });

            var _flag = document.getElementById('flagsContainer'); if(_flag) _flag.innerHTML = html || '<div class="loading">No flags configured for this role.</div>';
        }

        // Changelog functions
        function getChangelog() {
            try {
                const data = sessionStorage.getItem('fc_flag_changelog');
                return data ? JSON.parse(data) : [];
            } catch (e) {
                return [];
            }
        }

        function saveChangelog(entries) {
            try {
                sessionStorage.setItem('fc_flag_changelog', JSON.stringify(entries));
            } catch (e) {
                console.error('Failed to save changelog:', e);
            }
        }

        function addChangelogEntry(featureKey, role, enabled) {
            const changelog = getChangelog();
            changelog.unshift({
                featureKey: featureKey,
                role: role,
                enabled: enabled,
                timestamp: Date.now()
            });
            // Keep only last 10 entries
            if (changelog.length > 10) changelog.pop();
            saveChangelog(changelog);
            renderChangelog();
        }

        function getRelativeTime(timestamp) {
            const now = Date.now();
            const diff = now - timestamp;
            const seconds = Math.floor(diff / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);

            if (seconds < 60) return 'just now';
            if (minutes < 60) return minutes + ' minute' + (minutes !== 1 ? 's' : '') + ' ago';
            if (hours < 24) return hours + ' hour' + (hours !== 1 ? 's' : '') + ' ago';
            if (days < 7) return days + ' day' + (days !== 1 ? 's' : '') + ' ago';

            const date = new Date(timestamp);
            return date.toLocaleDateString();
        }

        function renderChangelog() {
            const changelog = getChangelog();
            const panel = document.getElementById('changelogPanel');

            if (changelog.length === 0) {
                panel.innerHTML = '<div class="changelog-empty">No changes yet</div>';
                return;
            }

            let html = '<div class="changelog-list">';
            changelog.forEach((entry, idx) => {
                const changeType = entry.enabled ? 'Enabled' : 'Disabled';
                const changeClass = entry.enabled ? 'enabled' : 'disabled';
                const relTime = getRelativeTime(entry.timestamp);
                const revertEnabled = entry.enabled ? 'false' : 'true';

                html += `
                <div class="changelog-entry">
                    <div class="changelog-entry-content">
                        <div class="changelog-entry-flag">${safe(entry.featureKey)}</div>
                        <div class="changelog-entry-role">${safe(entry.role)}</div>
                        <div class="changelog-entry-change ${changeClass}">${changeType}</div>
                    </div>
                    <div style="display:flex;align-items:center;gap:12px;white-space:nowrap;">
                        <div class="changelog-entry-time">${relTime}</div>
                        <button onclick="revertFlagChange('${entry.role}', '${entry.featureKey}', ${revertEnabled})" style="padding:4px 10px;background:rgba(96,165,250,0.15);color:#60a5fa;border:1px solid rgba(96,165,250,0.3);border-radius:4px;font-size:0.75rem;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;">Revert</button>
                    </div>
                </div>
                `;
            });
            html += '</div>';
            panel.innerHTML = html;
        }

        async function toggleFlag(role, featureKey, enabled, checkbox) {
            const cardId = 'card-' + role + '-' + featureKey.replace(/\./g, '-');
            const card = document.getElementById(cardId);

            try {
                const success = await FC_FLAGS.updateFlag(role, featureKey, enabled);
                if (success) {
                    // Update local data
                    const flag = allFlags.find(f => f.role === role && f.feature_key === featureKey);
                    if (flag) flag.enabled = enabled;

                    // Update card appearance
                    if (card) card.classList.toggle('disabled', !enabled);

                    // Update stats
                    const roleFlags = allFlags.filter(f => f.role === role);
                    var _stat = document.getElementById('statEnabled'); if(_stat) _stat.textContent = roleFlags.filter(f => f.enabled).length;
                    var _stat = document.getElementById('statDisabled'); if(_stat) _stat.textContent = roleFlags.filter(f => !f.enabled).length;

                    // Log change to changelog
                    addChangelogEntry(featureKey, role, enabled);

                    // Update category badge
                    renderFlags(currentRole);

                    showToast(enabled ? 'Feature enabled' : 'Feature disabled', 'success');
                } else {
                    checkbox.checked = !enabled; // Revert
                    showToast('Failed to update flag', 'error');
                }
            } catch (err) {
                checkbox.checked = !enabled; // Revert
                showToast('Error: ' + err.message, 'error');
            }
        }

        async function bulkToggle(role, category, enabled) {
            const flags = allFlags.filter(f => f.role === role && f.category === category);
            let successCount = 0;

            for (const flag of flags) {
                if (flag.enabled === enabled) continue; // Skip already matching
                const ok = await FC_FLAGS.updateFlag(role, flag.feature_key, enabled);
                if (ok) {
                    flag.enabled = enabled;
                    // Log each change to changelog
                    addChangelogEntry(flag.feature_key, role, enabled);
                    successCount++;
                }
            }

            renderFlags(currentRole);
            showToast(successCount + ' flag(s) ' + (enabled ? 'enabled' : 'disabled'), 'success');
        }

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        async function refreshFlags() {
            showToast('Refreshing feature flags...', 'success');
            await FC_FLAGS.refresh();
            await loadFlags();
            showToast('Feature flags refreshed successfully', 'success');
        }

        async function revertFlagChange(role, featureKey, newEnabled) {
            try {
                const success = await FC_FLAGS.updateFlag(role, featureKey, JSON.parse(newEnabled));
                if (success) {
                    const flag = allFlags.find(f => f.role === role && f.feature_key === featureKey);
                    if (flag) flag.enabled = JSON.parse(newEnabled);
                    renderFlags(currentRole);
                    addChangelogEntry(featureKey, role, JSON.parse(newEnabled));
                    showToast('Flag reverted successfully', 'success');
                } else {
                    showToast('Failed to revert flag', 'error');
                }
            } catch (err) {
                console.error('Revert error:', err);
                showToast('Error reverting flag: ' + err.message, 'error');
            }
        }
    </script>
    </div>
    
<script src="realtime.js"></script>
