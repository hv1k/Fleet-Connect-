<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>User Management — FleetConnect</title>
    <link rel="stylesheet" href="theme.css">
</head>
<body>
<aside class="admin-sidebar" id="adminSidebar">
        <div class="admin-sidebar-logo">FLEETCONNECT</div>
        <nav id="sidebarNav"></nav>
        <div class="admin-sidebar-footer">
            <div class="user-card"><div class="user-avatar" id="adminUserAvatar">U</div><div><div class="user-info-name" id="adminUserName">User</div><div class="user-info-role" id="adminUserRole">—</div></div></div>
            <button class="sidebar-logout" onclick="logout()">Sign out</button>
        </div>
    </aside>
<div class="main-content"><div class="page">

<h1 class="page-title">User Management</h1>
<div class="card">
  <div class="card-title">Add User</div>
  <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;">
    <div class="form-group" style="flex:1;min-width:160px;margin-bottom:0"><label>Name</label><input id="uName" placeholder="Full name"></div>
    <div class="form-group" style="width:160px;margin-bottom:0"><label>Role</label><select id="uRole"><option value="admin">Admin</option><option value="rental">Rental</option><option value="vendor">Vendor</option><option value="fieldworker">Field Worker</option></select></div>
    <button class="btn btn-primary" onclick="addU()">Add User</button>
  </div>
</div>
<div class="card">
  <div class="card-title">All Users</div>
  <table><thead><tr><th>Name</th><th>Role</th><th>ID</th></tr></thead><tbody id="usersBody"></tbody></table>
</div>

</div>
</div>
<script src="store.js"></script>
<script src="sidebar.js"></script>
<script>
requireAuth(['admin']);
function render() {
  document.getElementById('usersBody').innerHTML = Store.getUsers().map(u=>
    '<tr><td>'+u.name+'</td><td><span class="badge badge-accepted">'+u.role+'</span></td><td style="opacity:0.5;font-size:12px">'+u.id+'</td></tr>'
  ).join('');
}
function addU() {
  const name = document.getElementById('uName').value.trim();
  if(!name) return alert('Enter a name');
  Store.addUser(name, document.getElementById('uRole').value);
  document.getElementById('uName').value = '';
  render();
}
render();
</script>
    <script src="theme-toggle.js"></script>
</body>
</html>
