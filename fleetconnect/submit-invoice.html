<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Submit Invoice — FleetConnect</title>
<link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="glassmorphism.css">
</head>
<body>
<div id="sidebar"></div>
<div class="main">

<h1 class="page-title">Submit Invoice</h1>
<div class="card" style="max-width:600px">
  <div class="form-group"><label>Job</label><select id="jobId"></select></div>
  <div class="form-group"><label>Hours Worked</label><input id="hours" type="number" step="0.5" placeholder="e.g. 8"></div>
  <div class="form-group"><label>Diesel Cost ($)</label><input id="diesel" type="number" step="0.01" placeholder="0.00"></div>
  <div class="form-group"><label>DEF Cost ($)</label><input id="def" type="number" step="0.01" placeholder="0.00"></div>
  <div class="form-group"><label>Notes</label><textarea id="notes" placeholder="Additional notes..."></textarea></div>
  <button class="btn btn-primary" onclick="submitInv()">Submit Invoice</button>
  <span id="msg" style="margin-left:12px;color:var(--success)"></span>
</div>

</div>
<script src="store.js"></script>
<script src="sidebar.js"></script>
<script>
requireAuth(['fieldworker']);
const user = Store.getUser();
const myJobs = Store.getJobsForWorker(user).filter(j=>j.status==='assigned');
document.getElementById('jobId').innerHTML = '<option value="">Select job...</option>' + myJobs.map(j=>'<option value="'+j.id+'">'+j.jobSite+' — '+j.customer+'</option>').join('');
function submitInv() {
  const jobId = document.getElementById('jobId').value;
  const hours = parseFloat(document.getElementById('hours').value)||0;
  const diesel = parseFloat(document.getElementById('diesel').value)||0;
  const def = parseFloat(document.getElementById('def').value)||0;
  const notes = document.getElementById('notes').value.trim();
  if(!jobId) return alert('Select a job');
  if(!hours) return alert('Enter hours worked');
  const rate = 45;
  const total = (hours * rate) + diesel + def;
  Store.addInvoice({jobId, worker:user, hours, diesel, def, notes, rate, total});
  ['hours','diesel','def','notes'].forEach(f=>document.getElementById(f).value='');
  document.getElementById('jobId').value='';
  document.getElementById('msg').textContent = '✓ Invoice submitted! Total: $'+total.toFixed(2);
  setTimeout(()=>document.getElementById('msg').textContent='', 4000);
}
</script>
</body>
</html>
