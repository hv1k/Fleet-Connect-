<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
      // Theme init - prevent flash of wrong theme
      (function(){
        var t = localStorage.getItem('fleetconnect-theme');
        if(t === 'light') document.documentElement.classList.add('light-mode');
      })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Performance Metrics | FleetConnect</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg-dark: #1a1a1a;
            --bg-card: #242424;
            --bg-hover: #333;
            --border: #333;
            --text-primary: #e8e0d8;
            --text-secondary: #b8b0a8;
            --text-muted: #888;
            --accent: #3b82f6;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
            --admin: #60a5fa;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #1a1a1a; color: #f5f0e8; min-height: 100vh; transition: background 0.3s, color 0.3s;  display: flex;}

        body.dark { background: #f5f0e8; color: #1a1a1a; }
        body.dark .sidebar { background: #ffffff; border-color: #e8e4dc; }
        body.dark .sidebar-logo { color: #3b82f6; }
        body.dark .nav-item { color: #5c5c5c; }
        body.dark .nav-item:hover { background: #f0ebe3; color: #1a1a1a; }
        body.dark .nav-item.active { background: #dbeafe; color: #2563eb; }
        body.dark .nav-section-title { color: #8c8c8c; }
        body.dark .header { background: #ffffff; border-color: #e8e4dc; }
        body.dark .header h1 { color: #1a1a1a; }
        body.dark .header-subtitle { color: #5c5c5c; }
        body.dark .stat-card { background: #ffffff; border-color: #e8e4dc; }
        body.dark .stat-header { color: #8c8c8c; }
        body.dark .stat-value { color: #1a1a1a; }
        body.dark .worker-card { background: #ffffff; border-color: #e8e4dc; }
        body.dark .worker-name { color: #1a1a1a; }
        body.dark .metric-label { color: #8c8c8c; }
        body.dark .metric-value { color: #1a1a1a; }
        body.dark .progress-bar { background: #e8e4dc; }
        body.dark .modal { background: #ffffff; }
        body.dark .modal-header { border-color: #e8e4dc; }
        body.dark .modal-header h3 { color: #1a1a1a; }
        body.dark .modal-close { background: #f0ebe3; color: #5c5c5c; }
        body.dark .btn-secondary { background: #ffffff; border-color: #e8e4dc; color: #5c5c5c; }
        body.dark .filter-bar { background: #ffffff; border-color: #e8e4dc; }
        body.dark .filter-bar input { background: #ffffff; border-color: #e8e4dc; color: #1a1a1a; }

        .layout { display: flex; min-height: 100vh; }

        .sidebar { width: 240px; background: #242424; border-right: 1px solid #333; padding: 24px 16px; position: fixed; left: 0; height: 100vh; z-index: 100; display: flex; flex-direction: column; }
        .sidebar-header { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; padding: 20px 20px 12px; }
        .sidebar-logo { font-size: 1.2rem; font-weight: 700; color: #60a5fa; }
        .nav-section { margin-bottom: 24px; }
        .nav-section-title { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; color: #666; padding: 0 12px; margin-bottom: 8px; letter-spacing: 0.5px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: #b8b0a8; text-decoration: none; font-size: 0.85rem; font-weight: 500; transition: all 0.2s; cursor: pointer; }
        .nav-item:hover { background: #333; color: #f5f0e8; }
        .nav-item.active { background: rgba(96, 165, 250, 0.15); color: #60a5fa; }
        .nav-item svg { width: 20px; height: 20px; }

        .sidebar-footer { margin-top: auto; padding-top: 16px; border-top: 1px solid #333; }
        .user-menu { display: flex; align-items: center; gap: 12px; padding: 12px; margin-top: 12px; border-radius: 10px; background: #333; }
        .user-avatar-lg { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #60a5fa, #3b82f6); display: flex; align-items: center; justify-content: center; color: #1a1a1a; font-weight: 600; font-size: 0.85rem; }
        .user-name { font-size: 0.85rem; font-weight: 600; color: #f5f0e8; }
        .user-role { font-size: 0.7rem; color: #888; }
        .logout-btn { color: #888; cursor: pointer; padding: 6px; border-radius: 6px; background: none; border: none; }
        .logout-btn:hover { background: #444; color: #f5f0e8; }

        .main { flex: 1; margin-left: 240px; min-height: 100vh; }
        .header { background: #242424; padding: 20px 32px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .header h1 { font-size: 1.4rem; font-weight: 700; color: #f5f0e8; }
        .header-subtitle { font-size: 0.85rem; color: #888; }
        .content { padding: 32px; }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 28px; }
        .admin-sidebar { width: 260px; background: var(--bg-card); border-right: 1px solid var(--border); padding: 24px 16px; position: fixed; left: 0; top: 0; height: 100vh; overflow-y: auto; z-index: 99; display: flex; flex-direction: column; }
        .admin-sidebar-logo { font-size: 1.1rem; font-weight: 700; color: var(--admin, #60a5fa); margin-bottom: 16px; }
        .admin-nav-section { margin-bottom: 24px; }
        .admin-nav-section-title { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted, #888); padding: 0 12px; margin-bottom: 8px; letter-spacing: 0.5px; }
        .admin-nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: #b8b0a8; text-decoration: none; font-size: 0.85rem; font-weight: 500; transition: all 0.2s; cursor: pointer; margin-bottom: 4px; }
        .admin-nav-item:hover { background: var(--bg-hover, #333); color: var(--text-primary, #e8e0d8); }
        .admin-nav-item.active { background: rgba(96, 165, 250, 0.15); color: var(--admin, #60a5fa); }
        .admin-nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
        .admin-sidebar-footer { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border, #333); }
        .main-content { flex: 1; margin-left: 260px; }

        @media (max-width: 1200px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .stats-grid { grid-template-columns: 1fr; } }

        .stat-card { background: #242424; border-radius: 16px; padding: 24px; border: 1px solid #333; }
        .stat-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; color: #888; font-size: 0.85rem; }
        .stat-header svg { width: 18px; height: 18px; }
        .stat-value { font-size: 1.8rem; font-weight: 700; color: #f5f0e8; }
        .stat-unit { font-size: 0.85rem; color: #888; }

        .filter-bar { display: flex; gap: 16px; margin-bottom: 28px; align-items: center; background: #242424; padding: 16px 20px; border-radius: 10px; border: 1px solid #333; }
        .filter-bar label { font-size: 0.85rem; font-weight: 500; color: #888; }
        .filter-bar input, .filter-bar select { padding: 8px 12px; border: 1px solid #444; border-radius: 8px; background: #2a2a2a; color: #f5f0e8; font-size: 0.85rem; }
        .filter-bar input::placeholder { color: #666; }
        .filter-bar input:focus, .filter-bar select:focus { outline: none; border-color: #60a5fa; }

        .workers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 28px; }

        .worker-card { background: #242424; border-radius: 12px; padding: 20px; border: 1px solid #333; cursor: pointer; transition: all 0.2s; }
        .worker-card:hover { border-color: #60a5fa; transform: translateY(-2px); }

        .worker-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .worker-avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #60a5fa, #3b82f6); display: flex; align-items: center; justify-content: center; color: #1a1a1a; font-weight: 600; font-size: 1rem; flex-shrink: 0; }
        .worker-info { flex: 1; min-width: 0; }
        .worker-name { font-size: 0.95rem; font-weight: 600; color: #f5f0e8; }
        .worker-id { font-size: 0.7rem; color: #888; }

        .metric-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #333; }
        .metric-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

        .metric-label { font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        .metric-value { font-size: 1rem; font-weight: 600; color: #f5f0e8; }

        .progress-container { display: flex; gap: 8px; align-items: center; }
        .progress-bar { width: 100%; height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
        .progress-fill.green { background: #10b981; }
        .progress-fill.yellow { background: #f59e0b; }
        .progress-fill.red { background: #ef4444; }
        .progress-text { font-size: 0.75rem; font-weight: 600; min-width: 35px; text-align: right; }

        .stars { display: flex; gap: 2px; font-size: 0.9rem; }
        .star { color: #fbbf24; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.show { display: flex; }
        .modal { background: #242424; border-radius: 16px; width: 100%; max-width: 800px; overflow: hidden; border: 1px solid #333; max-height: 90vh; overflow-y: auto; }
        .modal-header { padding: 20px 24px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { font-size: 1.2rem; font-weight: 600; color: #f5f0e8; }
        .modal-close { width: 28px; height: 28px; border-radius: 6px; border: none; background: #333; color: #888; cursor: pointer; }
        .modal-close:hover { background: #444; color: #f5f0e8; }
        .modal-body { padding: 24px; }
        .modal-footer { padding: 16px 24px; border-top: 1px solid #333; display: flex; justify-content: flex-end; gap: 12px; background: #2a2a2a; }

        .btn { padding: 10px 18px; border-radius: 8px; font-size: 0.85rem; font-weight: 500; cursor: pointer; border: none; }
        .btn-primary { background: #60a5fa; color: #1a1a1a; }
        .btn-primary:hover { background: #3b82f6; }
        .btn-secondary { background: #333; color: #b8b0a8; border: 1px solid #444; }
        .btn-secondary:hover { background: #444; }

        .detail-section { background: #2a2a2a; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
        .detail-section-title { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; color: #666; margin-bottom: 12px; letter-spacing: 0.5px; }

        .chart-container { position: relative; height: 250px; margin: 16px 0; }

        .incident-list { max-height: 200px; overflow-y: auto; }
        .incident-item { padding: 10px; background: #333; border-radius: 6px; margin-bottom: 8px; font-size: 0.85rem; color: #b8b0a8; }
        .incident-item:last-child { margin-bottom: 0; }

        .empty-state { text-align: center; padding: 40px; color: #888; }
        .loading { text-align: center; padding: 40px; color: #888; }
        .spinner { width: 36px; height: 36px; border: 3px solid #333; border-top-color: #60a5fa; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .mobile-toggle { display: none; width: 40px; height: 40px; border: 1px solid #444; border-radius: 8px; background: #2a2a2a; color: #f5f0e8; align-items: center; justify-content: center; cursor: pointer; }
        @media (max-width: 900px) {
            .sidebar { display: none; left: 0; }
            .sidebar.open { display: flex; position: fixed; z-index: 100; }
            .main { margin-left: 0; }
            .mobile-toggle { display: flex; }
            .workers-grid { grid-template-columns: 1fr; }
        }
    
        /* Light Mode */
        .light-mode { --bg-dark: #f5f5f5; --bg-card: #ffffff; --bg-input: #e8e8e8; --bg-hover: #e8e8e8; --border: #d0d0d0; --text-primary: #1a1a1a; --text-secondary: #555555; --text-muted: #888888; }
        .light-mode .sidebar, .light-mode .admin-sidebar { background: #ffffff !important; border-color: #d0d0d0 !important; }
        .light-mode .sidebar-logo, .light-mode .admin-sidebar-logo { color: #3b82f6 !important; }
        .light-mode .nav-item, .light-mode .admin-nav-item { color: #555555 !important; }
        .light-mode .nav-item:hover, .light-mode .admin-nav-item:hover { background: #e8e8e8 !important; color: #1a1a1a !important; }
        .light-mode .nav-item.active, .light-mode .admin-nav-item.active { background: #dbeafe !important; color: #2563eb !important; }
        .light-mode .nav-section-title, .light-mode .admin-nav-section { color: #888888 !important; }
        .light-mode .user-menu { background: #e8e8e8 !important; }
        .light-mode .user-name { color: #1a1a1a !important; }
        .light-mode .header { background: #ffffff !important; border-color: #d0d0d0 !important; }
        .light-mode .header h1 { color: #1a1a1a !important; }
        .light-mode .header-subtitle { color: #555555 !important; }
        .light-mode .main, .light-mode .content, .light-mode .admin-main { background: #f5f5f5 !important; }
        .light-mode .card, .light-mode .stat-card, .light-mode .metric-card, .light-mode .admin-card { background: #ffffff !important; border-color: #d0d0d0 !important; }
        .light-mode .card-title, .light-mode .stat-label { color: #1a1a1a !important; }
        .light-mode .card-subtitle { color: #555555 !important; }
        .light-mode input, .light-mode textarea, .light-mode select { background: #e8e8e8 !important; border-color: #d0d0d0 !important; color: #1a1a1a !important; }
        .light-mode input::placeholder, .light-mode textarea::placeholder { color: #888888 !important; }
        .light-mode .form-label, .light-mode label { color: #1a1a1a !important; }
        .light-mode .badge { background: #dbeafe !important; color: #2563eb !important; }
        .light-mode .btn-secondary { background: #e8e8e8 !important; color: #1a1a1a !important; border-color: #d0d0d0 !important; }
        .light-mode .btn-secondary:hover { background: #d0d0d0 !important; }
        .light-mode .sidebar-footer, .light-mode .admin-sidebar-footer { border-color: #d0d0d0 !important; }
        .light-mode .logout-btn:hover { background: #e8e8e8 !important; }
        .light-mode table th { background: #e8e8e8 !important; color: #1a1a1a !important; border-color: #d0d0d0 !important; }
        .light-mode table td { border-color: #d0d0d0 !important; color: #1a1a1a !important; }
        .light-mode table tr:hover { background: #e8e8e8 !important; }
        .light-mode .modal-overlay { background: rgba(0,0,0,0.3) !important; }
        .light-mode .modal, .light-mode .modal-content { background: #ffffff !important; border-color: #d0d0d0 !important; color: #1a1a1a !important; }
        .light-mode.light-mode .search-box, .light-mode .search-input { background: #e8e8e8 !important; border-color: #d0d0d0 !important; color: #1a1a1a !important; }
        .light-mode .tab, .light-mode .tab-btn { color: #555555 !important; }
        .light-mode .tab.active, .light-mode .tab-btn.active { color: #3b82f6 !important; border-color: #3b82f6 !important; }
        .light-mode .dropdown, .light-mode .dropdown-menu { background: #ffffff !important; border-color: #d0d0d0 !important; }
        .light-mode .dropdown-item:hover { background: #e8e8e8 !important; }
        .light-mode .toggle-switch { background: #d0d0d0 !important; }
        .light-mode .toggle-switch.active { background: #2563eb !important; }
        .light-mode .tooltip { background: #1a1a1a !important; color: #ffffff !important; }
        .light-mode .progress-bar { background: #e8e8e8 !important; }
        .light-mode .empty-state { color: #555555 !important; }
        .light-mode .filter-bar, .light-mode .toolbar { background: #ffffff !important; border-color: #d0d0d0 !important; }
        .light-mode .chip { background: #e8e8e8 !important; color: #1a1a1a !important; }
        .light-mode pre, .light-mode code { background: #e8e8e8 !important; color: #1a1a1a !important; }
        .light-mode .status-badge { border-color: #d0d0d0 !important; }
        .light-mode ::selection { background: #3b82f6; color: #ffffff; }
        .light-mode ::-webkit-scrollbar-track { background: #f5f5f5; }
        .light-mode ::-webkit-scrollbar-thumb { background: #d0d0d0; }
        .light-mode ::-webkit-scrollbar-thumb:hover { background: #bbbbbb; }

/* Light Mode */

        html.light-mode .admin-sidebar-footer { border-color: #d0d0d0; }

        html.light-mode .search-input, html.light-mode .filter-select { background: #ffffff; border-color: #d0d0d0; color: #1a1a1a; }
        html.light-mode th { background: #f0ebe3; color: #8c8c8c; border-color: #d0d0d0; }
        html.light-mode td { border-color: #d0d0d0; color: #5c5c5c; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .admin-sidebar { width: 100%; height: auto; position: relative; left: auto; top: auto; border-right: none; border-bottom: 1px solid var(--border, #333); padding: 12px; }
            .main-content { margin-left: 0; }

        /* Sidebar actions (bell + theme toggle) */
        /* Sidebar layout fix */
        .admin-sidebar { display: flex; flex-direction: column; }
        .admin-sidebar nav { flex: 1; overflow-y: auto; }
</style>

<body>
    <aside class="admin-sidebar" id="adminSidebar">
        <div class="admin-sidebar-logo">FLEETCONNECT</div>
<nav id="sidebarNav"></nav>
        <div class="admin-sidebar-footer">
            <div style="padding: 12px; background: var(--bg-hover, #333); border-radius: 8px;">
                <div style="font-size: 0.8rem; font-weight: 600; color: var(--text-primary, #f5f0e8); margin-bottom: 4px;" id="adminUserName">Vendor</div>
                <div class="admin-sidebar-role" style="font-size: 0.75rem; color: var(--text-secondary, #888);">Vendor Account</div>
                <button onclick="logout()" style="margin-top: 8px; width: 100%; padding: 6px; background: transparent; border: 1px solid #333; color: #888; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 0.75rem; cursor: pointer; transition: all 0.2s;">Logout</button>
            </div>
        </div>
    </aside>

        <div class="main-content">
            <header class="header">
                <div class="header-left">
                    <button class="mobile-toggle" onclick="toggleMobileSidebar()"><svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
                    <div>
                        <h1>Worker Performance Metrics</h1>
                        <p class="header-subtitle">Track field worker performance and productivity</p>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="exportMetrics()">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    Export Report
                </button>
            </header>

            <div class="content">
                <!-- Summary Stats -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-header"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.856-1.487M15 6a3 3 0 11-6 0 3 3 0 016 0zM16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>Total Workers</div>
                        <div class="stat-value" id="statTotalWorkers">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-header"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>Avg Completion</div>
                        <div class="stat-value" id="statAvgCompletion">0%</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-header"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>Top Performer</div>
                        <div class="stat-value" id="statTopPerformer">—</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-header"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>Incidents (Month)</div>
                        <div class="stat-value" id="statIncidents">0</div>
                    </div>
                </div>

                <!-- Filters -->
                <div class="filter-bar">
                    <label>Date Range:</label>
                    <input type="date" id="filterFrom" value="">
                    <input type="date" id="filterTo" value="">
                    <label style="margin-left: auto;">Sort by:</label>
                    <select id="sortBy" onchange="renderWorkers()">
                        <option value="completion">Completion Rate</option>
                        <option value="response">Response Time</option>
                        <option value="rating">Customer Rating</option>
                        <option value="incidents">Incidents</option>
                    </select>
                </div>

                <!-- Workers Grid -->
                <div class="workers-grid" id="workersContainer">
                    <div class="loading"><div class="spinner"></div>Loading workers...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal">
            <div class="modal-header"><h3 id="modalWorkerName">Worker Details</h3><button class="modal-close" onclick="closeDetailModal()" aria-label="Close">&times;</button></div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer"><button class="btn btn-secondary" onclick="closeDetailModal()">Close</button></div>
        </div>
    </div>

    <script src="supabase-client.js"></script>
    <script src="sidebar.js"></script>
    <script src="feature-flags.js"></script>
    <script src="notifications.js"></script>
    <script>
        let allWorkers = [];
        let allJobs = [];
        let allDeliveries = [];

        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof checkAuth === 'undefined') {
                document.querySelector('.content').innerHTML = '<div style="padding:40px;text-align:center;color:#dc2626;"><h2>Error: supabase-client.js not found</h2></div>';
                return;
            }

            const currentUser = checkAuth(['vendor']);
            if (currentUser) {
                document.getElementById('userName').textContent = currentUser.name;
                document.getElementById('userAvatar').textContent = currentUser.name.charAt(0).toUpperCase();
            }

            await FC_FLAGS.init('vendor');
            setDefaultDateRange();
            await loadData();
        });

        function setDefaultDateRange() {
            const today = new Date();
            const thirtyDaysAgo = new Date(today.getTime() - 30 * 24 * 60 * 60 * 1000);
            document.getElementById('filterFrom').value = thirtyDaysAgo.toISOString().split('T')[0];
            document.getElementById('filterTo').value = today.toISOString().split('T')[0];
        }

        async function loadData() {
            try {
                const user = getCurrentUser();
                if (!user || !user.vendor_id) {
                    document.getElementById('workersContainer').innerHTML = '<div class="empty-state">No vendor profile found</div>';
                    return;
                }

                const [jobRes, delRes] = await Promise.all([
                    db.from('jobs').select('*').eq('assigned_vendor', user.vendor_id).order('created_at', { ascending: false }),
                    db.from('deliveries').select('*').order('timestamp', { ascending: false })
                ]);

                allJobs = jobRes.data || [];
                allDeliveries = delRes.data || [];

                generateMockWorkers();
                updateStats();
                renderWorkers();
            } catch (err) {
                console.error('Error loading data:', err);
                document.getElementById('workersContainer').innerHTML = '<div class="empty-state">Error loading data</div>';
            }
        }

        function generateMockWorkers() {
            const names = ['John Smith', 'Sarah Johnson', 'Mike Davis', 'Emma Wilson', 'Robert Brown', 'Lisa Anderson'];
            const now = new Date();
            const thirtyDaysAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);

            allWorkers = names.map((name, idx) => {
                const completionRate = 85 + Math.random() * 15;
                const responseTime = 2 + Math.random() * 4;
                const totalDeliveries = 8 + Math.floor(Math.random() * 12);
                const fuelAccuracy = 95 + Math.random() * 5;
                const incidents = Math.floor(Math.random() * 3);
                const rating = 4 + Math.random();

                return {
                    id: 'worker-' + idx,
                    name: name,
                    initials: name.split(' ').map(n => n[0]).join(''),
                    completionRate: parseFloat(completionRate.toFixed(1)),
                    responseTime: parseFloat(responseTime.toFixed(1)),
                    totalDeliveries: totalDeliveries,
                    fuelAccuracy: parseFloat(fuelAccuracy.toFixed(1)),
                    incidents: incidents,
                    rating: parseFloat(rating.toFixed(1)),
                    recentJobs: Array(5).fill(0).map((_, i) => ({
                        id: 'job-' + idx + '-' + i,
                        name: 'Job Site ' + (i + 1),
                        status: ['completed', 'in-progress', 'completed', 'completed'][i % 4],
                        date: new Date(thirtyDaysAgo.getTime() + Math.random() * (now.getTime() - thirtyDaysAgo.getTime())).toLocaleDateString()
                    })),
                    monthlyTrend: [80, 82, 81, 85, 87, 89, 88, 90, 92, 91, 90, 92, 93, 94, 95].map(() => 80 + Math.random() * 20)
                };
            });
        }

        function updateStats() {
            const total = allWorkers.length;
            const avgCompletion = allWorkers.reduce((s, w) => s + w.completionRate, 0) / (total || 1);
            const topWorker = allWorkers.reduce((prev, current) => (prev.completionRate > current.completionRate) ? prev : current, allWorkers[0]);
            const totalIncidents = allWorkers.reduce((s, w) => s + w.incidents, 0);

            document.getElementById('statTotalWorkers').textContent = total;
            document.getElementById('statAvgCompletion').textContent = avgCompletion.toFixed(1) + '%';
            document.getElementById('statTopPerformer').textContent = topWorker?.name?.split(' ')[0] || '—';
            document.getElementById('statIncidents').textContent = totalIncidents;
        }

        function renderWorkers() {
            const sortBy = document.getElementById('sortBy').value;
            let sorted = [...allWorkers];

            if (sortBy === 'completion') {
                sorted.sort((a, b) => b.completionRate - a.completionRate);
            } else if (sortBy === 'response') {
                sorted.sort((a, b) => a.responseTime - b.responseTime);
            } else if (sortBy === 'rating') {
                sorted.sort((a, b) => b.rating - a.rating);
            } else if (sortBy === 'incidents') {
                sorted.sort((a, b) => a.incidents - b.incidents);
            }

            const container = document.getElementById('workersContainer');

            if (sorted.length === 0) {
                container.innerHTML = '<div class="empty-state">No workers found</div>';
                return;
            }

            container.innerHTML = sorted.map(worker => `
                <div class="worker-card" onclick="showDetailModal('${worker.id}')">
                    <div class="worker-header">
                        <div class="worker-avatar">${safe(worker.initials)}</div>
                        <div class="worker-info">
                            <div class="worker-name">${safe(worker.name)}</div>
                            <div class="worker-id">${worker.totalDeliveries} deliveries</div>
                        </div>
                    </div>

                    <div class="metric-row">
                        <div class="metric-label">Completion Rate</div>
                        <div style="flex: 1; margin: 0 12px;">
                            <div class="progress-container">
                                <div class="progress-bar">
                                    <div class="progress-fill ${worker.completionRate >= 90 ? 'green' : worker.completionRate >= 70 ? 'yellow' : 'red'}" style="width: ${worker.completionRate}%"></div>
                                </div>
                                <div class="progress-text">${worker.completionRate}%</div>
                            </div>
                        </div>
                    </div>

                    <div class="metric-row">
                        <div class="metric-label">Response Time</div>
                        <div class="metric-value">${worker.responseTime}h</div>
                    </div>

                    <div class="metric-row">
                        <div class="metric-label">Fuel Accuracy</div>
                        <div class="metric-value">${worker.fuelAccuracy}%</div>
                    </div>

                    <div class="metric-row">
                        <div class="metric-label">Incidents</div>
                        <div class="metric-value" style="color: ${worker.incidents > 0 ? '#ef4444' : '#10b981'};">${worker.incidents}</div>
                    </div>

                    <div class="metric-row">
                        <div class="metric-label">Rating</div>
                        <div class="stars">
                            ${Array(5).fill(0).map((_, i) => `<span class="star" style="color: ${i < Math.floor(worker.rating) ? '#fbbf24' : '#666'};">★</span>`).join('')}
                            <span style="margin-left: 4px; color: #888; font-size: 0.8rem;">${worker.rating.toFixed(1)}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function showDetailModal(workerId) {
            const worker = allWorkers.find(w => w.id === workerId);
            if (!worker) return;

            document.getElementById('modalWorkerName').textContent = worker.name;

            const trendData = worker.monthlyTrend;
            const maxTrend = Math.max(...trendData);
            const minTrend = Math.min(...trendData);

            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <div class="detail-section">
                    <div class="detail-section-title">Performance Summary</div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div>
                            <div style="font-size: 0.8rem; color: #888; margin-bottom: 4px;">Completion Rate</div>
                            <div style="font-size: 1.3rem; font-weight: 600; color: #f5f0e8;">${worker.completionRate}%</div>
                        </div>
                        <div>
                            <div style="font-size: 0.8rem; color: #888; margin-bottom: 4px;">Avg Response Time</div>
                            <div style="font-size: 1.3rem; font-weight: 600; color: #f5f0e8;">${worker.responseTime}h</div>
                        </div>
                        <div>
                            <div style="font-size: 0.8rem; color: #888; margin-bottom: 4px;">Total Deliveries</div>
                            <div style="font-size: 1.3rem; font-weight: 600; color: #60a5fa;">${worker.totalDeliveries}</div>
                        </div>
                        <div>
                            <div style="font-size: 0.8rem; color: #888; margin-bottom: 4px;">Customer Rating</div>
                            <div class="stars">
                                ${Array(5).fill(0).map((_, i) => `<span class="star" style="color: ${i < Math.floor(worker.rating) ? '#fbbf24' : '#666'};">★</span>`).join('')}
                                <span style="margin-left: 4px; color: #888; font-size: 0.8rem;">${worker.rating.toFixed(1)}</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="detail-section">
                    <div class="detail-section-title">Performance Trend (Last 15 Days)</div>
                    <div class="chart-container">
                        <svg viewBox="0 0 600 250" style="width: 100%; height: 100%;">
                            <!-- Grid lines -->
                            ${[0, 50, 100, 150, 200].map(y => `<line x1="40" y1="${y}" x2="580" y2="${y}" stroke="#333" stroke-width="1"/>`).join('')}
                            <!-- Axis -->
                            <line x1="40" y1="0" x2="40" y2="200" stroke="#666" stroke-width="2"/>
                            <line x1="40" y1="200" x2="580" y2="200" stroke="#666" stroke-width="2"/>
                            <!-- Chart line -->
                            <polyline points="${trendData.map((v, i) => `${40 + (i * 36)},${200 - ((v - minTrend) / (maxTrend - minTrend || 1) * 200)}`).join(' ')}" stroke="#60a5fa" stroke-width="2" fill="none"/>
                            <!-- Data points -->
                            ${trendData.map((v, i) => `<circle cx="${40 + (i * 36)}" cy="${200 - ((v - minTrend) / (maxTrend - minTrend || 1) * 200)}" r="3" fill="#60a5fa"/>`).join('')}
                        </svg>
                    </div>
                </div>

                <div class="detail-section">
                    <div class="detail-section-title">Recent Jobs</div>
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        ${worker.recentJobs.map(job => `
                            <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px; background: #1a1a1a; border-radius: 6px;">
                                <div>
                                    <div style="font-size: 0.9rem; color: #f5f0e8;">${safe(job.name)}</div>
                                    <div style="font-size: 0.75rem; color: #888;">${job.date}</div>
                                </div>
                                <span style="padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; background: ${job.status === 'completed' ? 'rgba(16, 185, 129, 0.15)' : 'rgba(96, 165, 250, 0.15)'}; color: ${job.status === 'completed' ? '#10b981' : '#60a5fa'};">${job.status}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="detail-section">
                    <div class="detail-section-title">Incidents</div>
                    ${worker.incidents > 0 ? `
                        <div class="incident-list">
                            ${Array(worker.incidents).fill(0).map((_, i) => `
                                <div class="incident-item">
                                    Incident #${i + 1} - ${['Spillage', 'Equipment damage', 'Safety concern'][i % 3]} on ${new Date(Date.now() - Math.random() * 30 * 24 * 60 * 60 * 1000).toLocaleDateString()}
                                </div>
                            `).join('')}
                        </div>
                    ` : `<div style="color: #888; text-align: center; padding: 16px;">No incidents reported</div>`}
                </div>
            `;

            document.getElementById('detailModal').classList.add('show');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.remove('show');
        }

        function exportMetrics() {
            const data = allWorkers.map(w => ({
                'Worker Name': w.name,
                'Completion Rate %': w.completionRate,
                'Response Time (Hours)': w.responseTime,
                'Total Deliveries': w.totalDeliveries,
                'Fuel Accuracy %': w.fuelAccuracy,
                'Incidents': w.incidents,
                'Customer Rating': w.rating.toFixed(1)
            }));

            const csv = [Object.keys(data[0]).join(','), ...data.map(row => Object.values(row).map(v => typeof v === 'string' && v.includes(',') ? `"${v}"` : v).join(','))].join('\n');

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'worker-metrics-' + new Date().toISOString().split('T')[0] + '.csv';
            a.click();
        }

        function toggleMobileSidebar() {
            document.querySelector('.sidebar').classList.toggle('open');
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeDetailModal();
        });
    </script>
    
<script src="hamburger-menu.js"></script>
<script src="global-search.js"></script>
<script src="notification-center.js"></script>
    <script src="realtime.js"></script>
</body>
</html>
