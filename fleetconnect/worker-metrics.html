        .layout { display: flex; min-height: 100vh; }

        .sidebar { width: 240px; background: var(--bg-card); border-right: 1px solid var(--gray-300); padding: 24px 16px; position: fixed; left: 0; height: 100vh; z-index: 100; display: flex; flex-direction: column; }
        .sidebar-header { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; padding: 20px 20px 12px; }
        .sidebar-logo { font-size: 1.2rem; font-weight: 700; color: #60a5fa; }
        .nav-section { margin-bottom: 24px; }
        .nav-section-title { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); padding: 0 12px; margin-bottom: 8px; letter-spacing: 0.5px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: var(--text-secondary); text-decoration: none; font-size: 0.85rem; font-weight: 500; transition: all 0.2s; cursor: pointer; }
        .nav-item:hover { background: var(--gray-300); color: var(--text-primary); }
        .nav-item.active { background: rgba(96, 165, 250, 0.15); color: #60a5fa; }
        .nav-item svg { width: 20px; height: 20px; }

        .sidebar-footer { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--gray-300); }
        .user-menu { display: flex; align-items: center; gap: 12px; padding: 12px; margin-top: 12px; border-radius: 10px; background: var(--gray-300); }
        
        .user-name { font-size: 0.85rem; font-weight: 600; color: var(--text-primary); }
        .user-role { font-size: 0.7rem; color: var(--text-muted); }
        .logout-btn { color: var(--text-muted); cursor: pointer; padding: 6px; border-radius: 6px; background: none; border: none; }
        .logout-btn:hover { background: var(--gray-400); color: var(--text-primary); }

        .main { flex: 1; margin-left: 240px; min-height: 100vh; }
        .header { background: var(--bg-card); padding: 20px 32px; border-bottom: 1px solid var(--gray-300); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .header h1 { font-size: 1.4rem; font-weight: 700; color: var(--text-primary); }
        .header-subtitle { font-size: 0.85rem; color: var(--text-muted); }
        .content { padding: 32px; }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 28px; }
        
        
        
        
        
        
        
        
        
        

        @media (max-width: 1200px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .stats-grid { grid-template-columns: 1fr; } }

        .stat-card { background: var(--bg-card); border-radius: 16px; padding: 24px; border: 1px solid var(--gray-300); }
        .stat-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; color: var(--text-muted); font-size: 0.85rem; }
        .stat-header svg { width: 18px; height: 18px; }
        .stat-value { font-size: 1.8rem; font-weight: 700; color: var(--text-primary); }
        .stat-unit { font-size: 0.85rem; color: var(--text-muted); }

        .filter-bar { display: flex; gap: 16px; margin-bottom: 28px; align-items: center; background: var(--bg-card); padding: 16px 20px; border-radius: 10px; border: 1px solid var(--gray-300); }
        .filter-bar label { font-size: 0.85rem; font-weight: 500; color: var(--text-muted); }
        .filter-bar input, .filter-bar select { padding: 8px 12px; border: 1px solid var(--gray-400); border-radius: 8px; background: var(--bg-input); color: var(--text-primary); font-size: 0.85rem; }
        .filter-bar input::placeholder { color: var(--text-muted); }
        .filter-bar input:focus, .filter-bar select:focus { outline: none; border-color: #60a5fa; }

        .workers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 28px; }

        .worker-card { background: var(--bg-card); border-radius: 12px; padding: 20px; border: 1px solid var(--gray-300); cursor: pointer; transition: all 0.2s; }
        .worker-card:hover { border-color: #60a5fa; transform: translateY(-2px); }

        .worker-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .worker-avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #60a5fa, #3b82f6); display: flex; align-items: center; justify-content: center; color: var(--bg-body); font-weight: 600; font-size: 1rem; flex-shrink: 0; }
        .worker-info { flex: 1; min-width: 0; }
        .worker-name { font-size: 0.95rem; font-weight: 600; color: var(--text-primary); }
        .worker-id { font-size: 0.7rem; color: var(--text-muted); }

        .metric-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--gray-300); }
        .metric-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

        .metric-label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .metric-value { font-size: 1rem; font-weight: 600; color: var(--text-primary); }

        .progress-container { display: flex; gap: 8px; align-items: center; }
        .progress-bar { width: 100%; height: 6px; background: var(--gray-300); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
        .progress-fill.green { background: #10b981; }
        .progress-fill.yellow { background: #f59e0b; }
        .progress-fill.red { background: #ef4444; }
        .progress-text { font-size: 0.75rem; font-weight: 600; min-width: 35px; text-align: right; }

        .stars { display: flex; gap: 2px; font-size: 0.9rem; }
        .star { color: #fbbf24; }

        
        
        
        
        
        
        
        
        

        
        
        
        
        

        .detail-section { background: var(--bg-input); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
        .detail-section-title { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; letter-spacing: 0.5px; }

        .chart-container { position: relative; height: 250px; margin: 16px 0; }

        .incident-list { max-height: 200px; overflow-y: auto; }
        .incident-item { padding: 10px; background: var(--gray-300); border-radius: 6px; margin-bottom: 8px; font-size: 0.85rem; color: var(--text-secondary); }

        .spinner { width: 36px; height: 36px; border: 3px solid var(--gray-300); border-top-color: #60a5fa; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .mobile-toggle { display: none; width: 40px; height: 40px; border: 1px solid var(--gray-400); border-radius: 8px; background: var(--bg-input); color: var(--text-primary); align-items: center; justify-content: center; cursor: pointer; }

        <div class="main-content">

    <script>
        let allWorkers = [];
        let allJobs = [];
        let allDeliveries = [];

        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof checkAuth === 'undefined') {
                document.querySelector('.content').innerHTML = '<div style="padding:40px;text-align:center;color:#dc2626;"><h2>Error: supabase-client.js not found</h2></div>';
                return;
            }

            const currentUser = checkAuth(['vendor']);
            if (currentUser) {
                var _user = document.getElementById('userName'); if(_user) _user.textContent = currentUser.name;
                var _user = document.getElementById('userAvatar'); if(_user) _user.textContent = currentUser.name.charAt(0).toUpperCase();
            }

            await FC_FLAGS.init('vendor');
            setDefaultDateRange();
            await loadData();
        });

        function setDefaultDateRange() {
            const today = new Date();
            const thirtyDaysAgo = new Date(today.getTime() - 30 * 24 * 60 * 60 * 1000);
            document.getElementById('filterFrom').value = thirtyDaysAgo.toISOString().split('T')[0];
            document.getElementById('filterTo').value = today.toISOString().split('T')[0];
        }

        async function loadData() {
            try {
                const user = getCurrentUser();
                if (!user || !user.vendor_id) {
                    var _work = document.getElementById('workersContainer'); if(_work) _work.innerHTML = '<div class="empty-state">No vendor profile found</div>';
                    return;
                }

                const [jobRes, delRes] = await Promise.all([
                    db.from('jobs').select('*').eq('assigned_vendor', user.vendor_id).order('created_at', { ascending: false }),
                    db.from('deliveries').select('*').order('timestamp', { ascending: false })
                ]);

                allJobs = jobRes.data || [];
                allDeliveries = delRes.data || [];

                generateMockWorkers();
                updateStats();
                renderWorkers();
            } catch (err) {
                console.error('Error loading data:', err);
                var _work = document.getElementById('workersContainer'); if(_work) _work.innerHTML = '<div class="empty-state">Error loading data</div>';
            }
        }

        function generateMockWorkers() {
            const names = ['John Smith', 'Sarah Johnson', 'Mike Davis', 'Emma Wilson', 'Robert Brown', 'Lisa Anderson'];
            const now = new Date();
            const thirtyDaysAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);

            allWorkers = names.map((name, idx) => {
                const completionRate = 85 + Math.random() * 15;
                const responseTime = 2 + Math.random() * 4;
                const totalDeliveries = 8 + Math.floor(Math.random() * 12);
                const fuelAccuracy = 95 + Math.random() * 5;
                const incidents = Math.floor(Math.random() * 3);
                const rating = 4 + Math.random();

                return {
                    id: 'worker-' + idx,
                    name: name,
                    initials: name.split(' ').map(n => n[0]).join(''),
                    completionRate: parseFloat(completionRate.toFixed(1)),
                    responseTime: parseFloat(responseTime.toFixed(1)),
                    totalDeliveries: totalDeliveries,
                    fuelAccuracy: parseFloat(fuelAccuracy.toFixed(1)),
                    incidents: incidents,
                    rating: parseFloat(rating.toFixed(1)),
                    recentJobs: Array(5).fill(0).map((_, i) => ({
                        id: 'job-' + idx + '-' + i,
                        name: 'Job Site ' + (i + 1),
                        status: ['completed', 'in-progress', 'completed', 'completed'][i % 4],
                        date: new Date(thirtyDaysAgo.getTime() + Math.random() * (now.getTime() - thirtyDaysAgo.getTime())).toLocaleDateString()
                    })),
                    monthlyTrend: [80, 82, 81, 85, 87, 89, 88, 90, 92, 91, 90, 92, 93, 94, 95].map(() => 80 + Math.random() * 20)
                };
            });
        }

        function updateStats() {
            const total = allWorkers.length;
            const avgCompletion = allWorkers.reduce((s, w) => s + w.completionRate, 0) / (total || 1);
            const topWorker = allWorkers.reduce((prev, current) => (prev.completionRate > current.completionRate) ? prev : current, allWorkers[0]);
            const totalIncidents = allWorkers.reduce((s, w) => s + w.incidents, 0);

            var _stat = document.getElementById('statTotalWorkers'); if(_stat) _stat.textContent = total;
            var _stat = document.getElementById('statAvgCompletion'); if(_stat) _stat.textContent = avgCompletion.toFixed(1) + '%';
            var _stat = document.getElementById('statTopPerformer'); if(_stat) _stat.textContent = topWorker?.name?.split(' ')[0] || '—';
            var _stat = document.getElementById('statIncidents'); if(_stat) _stat.textContent = totalIncidents;
        }

        function renderWorkers() {
            const sortBy = document.getElementById('sortBy').value;
            let sorted = [...allWorkers];

            if (sortBy === 'completion') {
                sorted.sort((a, b) => b.completionRate - a.completionRate);
            } else if (sortBy === 'response') {
                sorted.sort((a, b) => a.responseTime - b.responseTime);
            } else if (sortBy === 'rating') {
                sorted.sort((a, b) => b.rating - a.rating);
            } else if (sortBy === 'incidents') {
                sorted.sort((a, b) => a.incidents - b.incidents);
            }

            const container = document.getElementById('workersContainer');

            if (sorted.length === 0) {
                container.innerHTML = '<div class="empty-state">No workers found</div>';
                return;
            }

            container.innerHTML = sorted.map(worker => `
                <div class="worker-card" onclick="showDetailModal('${worker.id}')">
                    <div class="worker-header">
                        <div class="worker-avatar">${safe(worker.initials)}</div>
                        <div class="worker-info">
                            <div class="worker-name">${safe(worker.name)}</div>
                            <div class="worker-id">${worker.totalDeliveries} deliveries</div>
                        </div>
                    </div>

                    <div class="metric-row">
                        <div class="metric-label">Completion Rate</div>
                        <div style="flex: 1; margin: 0 12px;">
                            <div class="progress-container">
                                <div class="progress-bar">
                                    <div class="progress-fill ${worker.completionRate >= 90 ? 'green' : worker.completionRate >= 70 ? 'yellow' : 'red'}" style="width: ${worker.completionRate}%"></div>
                                </div>
                                <div class="progress-text">${worker.completionRate}%</div>
                            </div>
                        </div>
                    </div>

                    <div class="metric-row">
                        <div class="metric-label">Response Time</div>
                        <div class="metric-value">${worker.responseTime}h</div>
                    </div>

                    <div class="metric-row">
                        <div class="metric-label">Fuel Accuracy</div>
                        <div class="metric-value">${worker.fuelAccuracy}%</div>
                    </div>

                    <div class="metric-row">
                        <div class="metric-label">Incidents</div>
                        <div class="metric-value" style="color: ${worker.incidents > 0 ? '#ef4444' : '#10b981'};">${worker.incidents}</div>
                    </div>

                    <div class="metric-row">
                        <div class="metric-label">Rating</div>
                        <div class="stars">
                            ${Array(5).fill(0).map((_, i) => `<span class="star" style="color: ${i < Math.floor(worker.rating) ? '#fbbf24' : 'var(--text-muted)'};">★</span>`).join('')}
                            <span style="margin-left: 4px; color: var(--text-muted); font-size: 0.8rem;">${worker.rating.toFixed(1)}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function showDetailModal(workerId) {
            const worker = allWorkers.find(w => w.id === workerId);
            if (!worker) return;

            var _moda = document.getElementById('modalWorkerName'); if(_moda) _moda.textContent = worker.name;

            const trendData = worker.monthlyTrend;
            const maxTrend = Math.max(...trendData);
            const minTrend = Math.min(...trendData);

            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <div class="detail-section">
                    <div class="detail-section-title">Performance Summary</div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div>
                            <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px;">Completion Rate</div>
                            <div style="font-size: 1.3rem; font-weight: 600; color: var(--text-primary);">${worker.completionRate}%</div>
                        </div>
                        <div>
                            <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px;">Avg Response Time</div>
                            <div style="font-size: 1.3rem; font-weight: 600; color: var(--text-primary);">${worker.responseTime}h</div>
                        </div>
                        <div>
                            <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px;">Total Deliveries</div>
                            <div style="font-size: 1.3rem; font-weight: 600; color: #60a5fa;">${worker.totalDeliveries}</div>
                        </div>
                        <div>
                            <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px;">Customer Rating</div>
                            <div class="stars">
                                ${Array(5).fill(0).map((_, i) => `<span class="star" style="color: ${i < Math.floor(worker.rating) ? '#fbbf24' : 'var(--text-muted)'};">★</span>`).join('')}
                                <span style="margin-left: 4px; color: var(--text-muted); font-size: 0.8rem;">${worker.rating.toFixed(1)}</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="detail-section">
                    <div class="detail-section-title">Performance Trend (Last 15 Days)</div>
                    <div class="chart-container">
                        <svg viewBox="0 0 600 250" style="width: 100%; height: 100%;">
                            <!-- Grid lines -->
                            ${[0, 50, 100, 150, 200].map(y => `<line x1="40" y1="${y}" x2="580" y2="${y}" stroke="#333" stroke-width="1"/>`).join('')}
                            <!-- Axis -->
                            <line x1="40" y1="0" x2="40" y2="200" stroke="#666" stroke-width="2"/>
                            <line x1="40" y1="200" x2="580" y2="200" stroke="#666" stroke-width="2"/>
                            <!-- Chart line -->
                            <polyline points="${trendData.map((v, i) => `${40 + (i * 36)},${200 - ((v - minTrend) / (maxTrend - minTrend || 1) * 200)}`).join(' ')}" stroke="#60a5fa" stroke-width="2" fill="none"/>
                            <!-- Data points -->
                            ${trendData.map((v, i) => `<circle cx="${40 + (i * 36)}" cy="${200 - ((v - minTrend) / (maxTrend - minTrend || 1) * 200)}" r="3" fill="#60a5fa"/>`).join('')}
                        </svg>
                    </div>
                </div>

                <div class="detail-section">
                    <div class="detail-section-title">Recent Jobs</div>
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        ${worker.recentJobs.map(job => `
                            <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px; background: var(--bg-body); border-radius: 6px;">
                                <div>
                                    <div style="font-size: 0.9rem; color: var(--text-primary);">${safe(job.name)}</div>
                                    <div style="font-size: 0.75rem; color: var(--text-muted);">${job.date}</div>
                                </div>
                                <span style="padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; background: ${job.status === 'completed' ? 'rgba(16, 185, 129, 0.15)' : 'rgba(96, 165, 250, 0.15)'}; color: ${job.status === 'completed' ? '#10b981' : '#60a5fa'};">${job.status}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="detail-section">
                    <div class="detail-section-title">Incidents</div>
                    ${worker.incidents > 0 ? `
                        <div class="incident-list">
                            ${Array(worker.incidents).fill(0).map((_, i) => `
                                <div class="incident-item">
                                    Incident #${i + 1} - ${['Spillage', 'Equipment damage', 'Safety concern'][i % 3]} on ${new Date(Date.now() - Math.random() * 30 * 24 * 60 * 60 * 1000).toLocaleDateString()}
                                </div>
                            `).join('')}
                        </div>
                    ` : `<div style="color: var(--text-muted); text-align: center; padding: 16px;">No incidents reported</div>`}
                </div>
            `;

            var _deta = document.getElementById('detailModal'); if(_deta) _deta.classList.add('show');
        }

        function closeDetailModal() {
            var _deta = document.getElementById('detailModal'); if(_deta) _deta.classList.remove('show');
        }

        function exportMetrics() {
            const data = allWorkers.map(w => ({
                'Worker Name': w.name,
                'Completion Rate %': w.completionRate,
                'Response Time (Hours)': w.responseTime,
                'Total Deliveries': w.totalDeliveries,
                'Fuel Accuracy %': w.fuelAccuracy,
                'Incidents': w.incidents,
                'Customer Rating': w.rating.toFixed(1)
            }));

            const csv = [Object.keys(data[0]).join(','), ...data.map(row => Object.values(row).map(v => typeof v === 'string' && v.includes(',') ? `"${v}"` : v).join(','))].join('\n');

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'worker-metrics-' + new Date().toISOString().split('T')[0] + '.csv';
            a.click();
        }

        function toggleMobileSidebar() {
            document.querySelector('.sidebar').classList.toggle('open');
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeDetailModal();
        });
    </script>
    
<script src="hamburger-menu.js"></script>
<script src="global-search.js"></script>
<script src="notification-center.js"></script>
    <script src="realtime.js"></script>
    <script src="theme-toggle.js"></script>
</body>
</html>
