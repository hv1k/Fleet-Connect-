<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Manage Jobs — FleetConnect</title>
    <link rel="stylesheet" href="theme.css">
</head>
<body>
<aside class="admin-sidebar" id="adminSidebar">
        <div class="admin-sidebar-logo">FLEETCONNECT</div>
        <nav id="sidebarNav"></nav>
        <div class="admin-sidebar-footer">
            <div class="user-card"><div class="user-avatar" id="adminUserAvatar">U</div><div><div class="user-info-name" id="adminUserName">User</div><div class="user-info-role" id="adminUserRole">—</div></div></div>
            <button class="sidebar-logout" onclick="logout()">Sign out</button>
        </div>
    </aside>
<div class="main-content"><div class="page">

<h1 class="page-title">Manage Jobs</h1>
<div class="card">
  <table><thead><tr><th>Job Site</th><th>Customer</th><th>Equipment</th><th>Status</th><th>Worker</th><th>Actions</th></tr></thead><tbody id="body"></tbody></table>
</div>

</div>
</div>
<script src="store.js"></script>
<script src="sidebar.js"></script>
<script>
requireAuth(['vendor']);
const workers = Store.getUsersByRole('fieldworker');
function render() {
  document.getElementById('body').innerHTML = Store.getJobs().slice().reverse().map(j => {
    let actions = '';
    if(j.status==='pending') {
      actions = '<button class="btn btn-success btn-sm" onclick="act(\''+j.id+'\',\'accept\')">Accept</button> <button class="btn btn-danger btn-sm" onclick="act(\''+j.id+'\',\'reject\')">Reject</button>';
    } else if(j.status==='accepted') {
      actions = '<select onchange="assign(\''+j.id+'\',this.value)" style="padding:4px 8px;background:var(--input-bg);border:1px solid var(--input-border);color:var(--text);border-radius:4px;font-size:12px"><option value="">Assign worker...</option>'+workers.map(w=>'<option value="'+w.name+'">'+w.name+'</option>').join('')+'</select>';
    } else if(j.status==='assigned') {
      actions = '<button class="btn btn-primary btn-sm" onclick="act(\''+j.id+'\',\'complete\')">Complete</button>';
    }
    return '<tr><td>'+j.jobSite+'</td><td>'+j.customer+'</td><td>'+(j.equipment||'-')+'</td><td><span class="badge badge-'+j.status+'">'+j.status+'</span></td><td>'+(j.assignedWorker||'-')+'</td><td>'+actions+'</td></tr>';
  }).join('') || '<tr><td colspan="6" class="empty-state">No jobs yet</td></tr>';
}
function act(id, action) {
  if(action==='accept') Store.updateJob(id,{status:'accepted'});
  else if(action==='reject') Store.updateJob(id,{status:'rejected'});
  else if(action==='complete') Store.updateJob(id,{status:'completed'});
  render();
}
function assign(id, worker) {
  if(!worker) return;
  Store.updateJob(id, {status:'assigned', assignedWorker:worker});
  render();
}
render();
</script>
    <script src="theme-toggle.js"></script>
</body>
</html>
