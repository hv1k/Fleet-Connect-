<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Dashboard | FleetConnect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-dark: #0a0a0f; --bg-card: #12121a; --bg-input: #1a1a24; --border: #2a2a3a; --text-primary: #ffffff; --text-secondary: #8a8a9a; --text-muted: #5a5a6a; --accent: #00d4aa; --accent-glow: rgba(0, 212, 170, 0.3); --accent-blue: #00a8ff; --warning: #ffaa00; --error: #ff6b6b; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; line-height: 1.6; }
        body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(0, 212, 170, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 170, 0.03) 1px, transparent 1px); background-size: 50px 50px; pointer-events: none; z-index: 0; }
        .container { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        .logo { font-family: 'Space Mono', monospace; font-size: 1.5rem; color: var(--accent); letter-spacing: -1px; text-decoration: none; }
        .nav-right { display: flex; align-items: center; gap: 24px; }
        .nav-links { display: flex; gap: 24px; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent); }
        .vendor-badge { background: var(--accent); color: var(--bg-dark); padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
        .logout-btn { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-family: 'DM Sans', sans-serif; }
        .header { margin-bottom: 32px; }
        .header h1 { font-size: 2rem; font-weight: 700; margin-bottom: 8px; }
        .header p { color: var(--text-secondary); }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
        @media (max-width: 800px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; text-align: center; }
        .stat-value { font-size: 1.75rem; font-weight: 700; font-family: 'Space Mono', monospace; color: var(--accent); }
        .stat-label { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; margin-top: 4px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
        .tab { padding: 10px 20px; background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--text-secondary); font-family: 'DM Sans', sans-serif; font-size: 0.9rem; cursor: pointer; }
        .tab:hover { border-color: var(--accent); }
        .tab.active { background: var(--accent); border-color: var(--accent); color: var(--bg-dark); }
        .jobs-list { display: flex; flex-direction: column; gap: 16px; }
        .job-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
        .job-header { display: flex; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
        .job-title { font-size: 1.1rem; font-weight: 600; }
        .job-meta { font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px; }
        .status-badge { padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
        .status-badge.pending { background: rgba(255, 170, 0, 0.15); color: var(--warning); }
        .status-badge.assigned { background: rgba(0, 168, 255, 0.15); color: var(--accent-blue); }
        .status-badge.in-progress, .status-badge.accepted { background: rgba(0, 212, 170, 0.15); color: var(--accent); }
        .status-badge.completed { background: rgba(100,100,100,0.15); color: var(--text-secondary); }
        .job-details { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 16px; background: var(--bg-input); border-radius: 8px; margin-bottom: 16px; }
        @media (max-width: 600px) { .job-details { grid-template-columns: 1fr; } }
        .job-detail-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
        .job-detail-value { font-size: 0.9rem; margin-top: 4px; }
        .assigned-worker { margin-top: 12px; padding: 12px; background: rgba(0, 212, 170, 0.1); border-radius: 8px; display: flex; align-items: center; gap: 10px; }
        .assigned-worker-icon { font-size: 1.2rem; }
        .assigned-worker-info { flex: 1; }
        .assigned-worker-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
        .assigned-worker-name { font-size: 0.95rem; color: var(--accent); font-weight: 500; }
        .job-actions { display: flex; gap: 12px; flex-wrap: wrap; }
        .btn { padding: 10px 20px; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 500; border-radius: 8px; cursor: pointer; }
        .btn-primary { background: var(--accent); color: var(--bg-dark); border: none; }
        .btn-secondary { background: var(--accent-blue); color: white; border: none; }
        .btn-outline { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
        .btn-danger { background: transparent; color: var(--error); border: 1px solid var(--error); }
        .loading { text-align: center; padding: 60px; color: var(--text-secondary); }
        .empty-state { text-align: center; padding: 60px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; }
        
        /* Modal Styles */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal-content { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 450px; max-height: 80vh; overflow: hidden; }
        .modal-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { font-size: 1.1rem; }
        .modal-close { background: none; border: none; color: var(--text-secondary); font-size: 1.5rem; cursor: pointer; }
        .modal-body { padding: 20px; overflow-y: auto; max-height: 50vh; }
        .modal-footer { padding: 20px; border-top: 1px solid var(--border); }
        
        /* Worker List */
        .worker-list { display: flex; flex-direction: column; gap: 10px; }
        .worker-item { padding: 14px; background: var(--bg-input); border: 2px solid var(--border); border-radius: 10px; cursor: pointer; transition: all 0.2s; }
        .worker-item:hover { border-color: var(--accent); }
        .worker-item.selected { border-color: var(--accent); background: rgba(0, 212, 170, 0.1); }
        .worker-item-name { font-weight: 600; margin-bottom: 2px; }
        .worker-item-email { font-size: 0.85rem; color: var(--text-secondary); }
        .no-workers { text-align: center; padding: 30px; color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="container">
        <nav class="nav">
            <a href="index.html" class="logo">FLEETCONNECT</a>
            <div class="nav-right">
                <div class="nav-links">
                    <a href="index.html">Home</a>
                    <a href="vendor-dashboard.html" class="active">Dashboard</a>
                    <a href="job-history.html">Job History</a>
                </div>
                <div class="vendor-badge">VENDOR</div>
                <span id="userName" style="color: var(--text-secondary); font-size: 0.9rem;"></span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </nav>
        <header class="header">
            <h1>Vendor Dashboard</h1>
            <p>Manage your assigned jobs and field workers</p>
        </header>
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-value" id="statPending">-</div><div class="stat-label">Pending</div></div>
            <div class="stat-card"><div class="stat-value" id="statActive">-</div><div class="stat-label">Active</div></div>
            <div class="stat-card"><div class="stat-value" id="statCompleted">-</div><div class="stat-label">Completed</div></div>
            <div class="stat-card"><div class="stat-value" id="statTotal">-</div><div class="stat-label">Total</div></div>
        </div>
        <div class="tabs">
            <button class="tab active" data-status="pending">Pending</button>
            <button class="tab" data-status="active">Active</button>
            <button class="tab" data-status="completed">Completed</button>
        </div>
        <div class="jobs-list" id="jobsList"><div class="loading">Loading...</div></div>
    </div>
    
    <script src="supabase-client.js"></script>
    <script>
        const currentUser = checkAuth(['vendor']);
        if (currentUser) document.getElementById('userName').textContent = currentUser.name;
        
        let allJobs = [];
        let fieldWorkers = [];
        let currentStatus = 'pending';
        
        async function loadData() {
            allJobs = await getAllJobs();
            fieldWorkers = await getFieldWorkers();
            updateStats();
            renderJobs();
        }
        
        async function getFieldWorkers() {
            const users = await getAllUsers();
            return users.filter(u => u.role === 'fieldworker');
        }
        
        function updateStats() {
            document.getElementById('statPending').textContent = allJobs.filter(j => ['pending','assigned'].includes(j.status)).length;
            document.getElementById('statActive').textContent = allJobs.filter(j => ['in-progress','accepted'].includes(j.status)).length;
            document.getElementById('statCompleted').textContent = allJobs.filter(j => j.status === 'completed').length;
            document.getElementById('statTotal').textContent = allJobs.length;
        }
        
        function getWorkerName(workerId) {
            const worker = fieldWorkers.find(w => w.id === workerId);
            return worker ? worker.name : 'Unknown';
        }
        
        function renderJobs() {
            let filtered = currentStatus === 'pending' 
                ? allJobs.filter(j => ['pending','assigned'].includes(j.status))
                : currentStatus === 'active' 
                    ? allJobs.filter(j => ['in-progress','accepted'].includes(j.status))
                    : allJobs.filter(j => j.status === 'completed');
            
            const container = document.getElementById('jobsList');
            
            if (!filtered.length) { 
                container.innerHTML = `<div class="empty-state"><h3>No ${currentStatus} jobs</h3></div>`; 
                return; 
            }
            
            container.innerHTML = filtered.map(job => `
                <div class="job-card">
                    <div class="job-header">
                        <div>
                            <div class="job-title">${job.job_site_name || 'Untitled'}</div>
                            <div class="job-meta">${formatJobType(job.job_type)} • ${formatDate(job.date_out)}</div>
                        </div>
                        <span class="status-badge ${job.status}">${job.status}</span>
                    </div>
                    
                    <div class="job-details">
                        <div>
                            <div class="job-detail-label">Location</div>
                            <div class="job-detail-value">${job.address_city || '-'}, ${job.address_state || '-'}</div>
                        </div>
                        <div>
                            <div class="job-detail-label">Contact</div>
                            <div class="job-detail-value">${job.contact_name || '-'}</div>
                        </div>
                        <div>
                            <div class="job-detail-label">Phone</div>
                            <div class="job-detail-value">${job.contact_phone || '-'}</div>
                        </div>
                    </div>
                    
                    ${job.assigned_worker ? `
                        <div class="assigned-worker">
                            <div class="assigned-worker-icon">👷</div>
                            <div class="assigned-worker-info">
                                <div class="assigned-worker-label">Assigned To</div>
                                <div class="assigned-worker-name">${getWorkerName(job.assigned_worker)}</div>
                            </div>
                            <button class="btn btn-outline" onclick="openAssignModal('${job.id}')">Change</button>
                        </div>
                    ` : ''}
                    
                    <div class="job-actions">
                        ${['pending','assigned'].includes(job.status) ? `
                            <button class="btn btn-primary" onclick="acceptJob('${job.id}')">Accept Job</button>
                            <button class="btn btn-outline" onclick="declineJob('${job.id}')">Decline</button>
                        ` : ''}
                        
                        ${['accepted','in-progress'].includes(job.status) ? `
                            ${!job.assigned_worker ? `<button class="btn btn-secondary" onclick="openAssignModal('${job.id}')">Assign Worker</button>` : ''}
                            <button class="btn btn-danger" onclick="closeJob('${job.id}')">Close Job</button>
                        ` : ''}
                        
                        <button class="btn btn-outline" onclick="viewDeliveries('${job.id}')">Deliveries</button>
                    </div>
                </div>
            `).join('');
        }
        
        async function acceptJob(id) { 
            await updateJobStatus(id, 'accepted'); 
            await loadData(); 
        }
        
        async function declineJob(id) { 
            if (confirm('Decline this job?')) { 
                await updateJobStatus(id, 'open'); 
                await loadData(); 
            }
        }
        
        async function closeJob(id) { 
            if (confirm('Close this job? This marks it as completed.')) { 
                await updateJobStatus(id, 'completed'); 
                await loadData(); 
            }
        }
        
        function openAssignModal(jobId) {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.id = 'assignModal';
            
            const workerListHtml = fieldWorkers.length ? fieldWorkers.map(w => `
                <div class="worker-item" onclick="selectWorker(this, '${w.id}')">
                    <div class="worker-item-name">${w.name}</div>
                    <div class="worker-item-email">${w.email}</div>
                </div>
            `).join('') : '<div class="no-workers">No field workers available.<br>Add field workers in Admin Dashboard.</div>';
            
            modal.innerHTML = `
                <div class="modal-content">
                    <div class="modal-header">
                        <h3>Assign Field Worker</h3>
                        <button class="modal-close" onclick="closeAssignModal()">&times;</button>
                    </div>
                    <div class="modal-body">
                        <p style="color: var(--text-secondary); margin-bottom: 16px; font-size: 0.9rem;">Select a field worker to assign to this job:</p>
                        <div class="worker-list">
                            ${workerListHtml}
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-primary" id="assignBtn" onclick="confirmAssign('${jobId}')" disabled style="width:100%; opacity: 0.5;">Select a Worker</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }
        
        let selectedWorkerId = null;
        
        function selectWorker(element, workerId) {
            document.querySelectorAll('.worker-item').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            selectedWorkerId = workerId;
            
            const btn = document.getElementById('assignBtn');
            btn.disabled = false;
            btn.style.opacity = '1';
            btn.textContent = 'Assign Worker';
        }
        
        function closeAssignModal() {
            document.getElementById('assignModal')?.remove();
            selectedWorkerId = null;
        }
        
        async function confirmAssign(jobId) {
            if (!selectedWorkerId) return;
            
            const btn = document.getElementById('assignBtn');
            btn.disabled = true;
            btn.textContent = 'Assigning...';
            
            const result = await assignWorkerToJob(jobId, selectedWorkerId);
            
            if (result.success) {
                closeAssignModal();
                await loadData();
            } else {
                alert('Error: ' + result.error);
                btn.disabled = false;
                btn.textContent = 'Assign Worker';
            }
        }
        
        async function viewDeliveries(jobId) {
            const deliveries = await getDeliveriesForJob(jobId);
            const total = deliveries.reduce((s, d) => s + parseFloat(d.gallons), 0);
            
            const html = deliveries.length ? deliveries.map(d => `
                <div style="padding:14px;background:var(--bg-input);border-radius:10px;margin-bottom:10px;">
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <strong style="color:var(--accent);font-size:1.1rem;">${d.gallons} gal</strong>
                        <span style="font-size:0.8rem;color:var(--text-muted);">${d.fuel_type || 'Diesel'}</span>
                    </div>
                    <div style="font-size:0.8rem;color:var(--text-muted);margin-top:4px;">
                        ${new Date(d.timestamp).toLocaleString()} • ${d.delivered_by_name || 'Unknown'}
                    </div>
                    ${d.notes ? `<p style="margin-top:8px;font-size:0.85rem;color:var(--text-secondary);">${d.notes}</p>` : ''}
                    ${d.has_incident ? `
                        <div style="margin-top:10px;padding:10px;background:rgba(255,107,107,0.1);border:1px solid var(--error);border-radius:8px;">
                            <div style="color:var(--error);font-weight:600;font-size:0.85rem;margin-bottom:4px;">⚠️ INCIDENT REPORTED</div>
                            <p style="font-size:0.85rem;color:var(--text-secondary);">${d.incident_description || ''}</p>
                            ${d.incident_photos && d.incident_photos.length ? `
                                <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;">
                                    ${d.incident_photos.map(url => `<img src="${url}" style="width:50px;height:50px;object-fit:cover;border-radius:6px;cursor:pointer;" onclick="window.open('${url}', '_blank')">`).join('')}
                                </div>
                            ` : ''}
                            ${d.incident_videos && d.incident_videos.length ? `
                                <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;">
                                    ${d.incident_videos.map(url => `<video src="${url}" style="width:50px;height:50px;object-fit:cover;border-radius:6px;cursor:pointer;" onclick="window.open('${url}', '_blank')"></video>`).join('')}
                                </div>
                            ` : ''}
                        </div>
                    ` : ''}
                </div>
            `).join('') : '<p style="text-align:center;color:var(--text-muted);padding:20px;">No deliveries yet</p>';
            
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <div class="modal-header">
                        <h3>Delivery History (${total.toFixed(1)} gal)</h3>
                        <button class="modal-close" onclick="this.closest('.modal').remove()">&times;</button>
                    </div>
                    <div class="modal-body">
                        ${html}
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }
        
        // Tab switching
        document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', function() {
            document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
            this.classList.add('active');
            currentStatus = this.dataset.status;
            renderJobs();
        }));
        
        // Load data on start
        loadData();
    </script>
</body>
</html>
