<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Dashboard | FleetConnect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --bg-card: #12121a;
            --bg-input: #1a1a24;
            --bg-hover: #1e1e2a;
            --border: #2a2a3a;
            --text-primary: #ffffff;
            --text-secondary: #8a8a9a;
            --text-muted: #5a5a6a;
            --accent: #00d4aa;
            --accent-glow: rgba(0, 212, 170, 0.3);
            --accent-blue: #00a8ff;
            --warning: #ffaa00;
            --error: #ff6b6b;
            --success: #00d4aa;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; line-height: 1.6; }
        body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(0, 212, 170, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 170, 0.03) 1px, transparent 1px); background-size: 50px 50px; pointer-events: none; z-index: 0; }
        .container { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        
        /* Nav */
        .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        .logo { font-family: 'Space Mono', monospace; font-size: 1.5rem; color: var(--accent); letter-spacing: -1px; }
        .nav-right { display: flex; align-items: center; gap: 24px; }
        .nav-links { display: flex; gap: 24px; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: color 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent); }
        .vendor-badge { background: var(--accent); color: var(--bg-dark); padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; }
        
        /* Header */
        .header { margin-bottom: 32px; }
        .header h1 { font-size: 2rem; font-weight: 700; margin-bottom: 8px; }
        .header p { color: var(--text-secondary); }
        
        /* Stats */
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
        @media (max-width: 800px) { .stats-row { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 500px) { .stats-row { grid-template-columns: 1fr; } }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
        .stat-card.highlight { border-color: var(--accent); background: rgba(0, 212, 170, 0.05); }
        .stat-label { font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .stat-value { font-size: 1.75rem; font-weight: 700; font-family: 'Space Mono', monospace; }
        .stat-value.warning { color: var(--warning); }
        .stat-value.accent { color: var(--accent); }
        
        /* Tabs */
        .tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
        .tab { padding: 10px 20px; background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--text-secondary); font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .tab:hover { border-color: var(--text-secondary); color: var(--text-primary); }
        .tab.active { background: var(--accent); border-color: var(--accent); color: var(--bg-dark); }
        .tab .count { margin-left: 8px; background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 10px; font-size: 0.8rem; }
        .tab.active .count { background: rgba(0,0,0,0.2); }
        
        /* Job Cards */
        .jobs-grid { display: flex; flex-direction: column; gap: 16px; }
        .job-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; transition: all 0.2s; }
        .job-card:hover { border-color: var(--accent); }
        .job-card.urgent { border-left: 4px solid var(--warning); }
        .job-card.new { border-left: 4px solid var(--accent-blue); }
        
        .job-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
        .job-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 4px; }
        .job-meta { display: flex; gap: 16px; flex-wrap: wrap; }
        .job-meta-item { font-size: 0.85rem; color: var(--text-secondary); }
        .job-meta-item span { color: var(--text-primary); }
        
        .job-details { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 16px; padding: 16px; background: var(--bg-input); border-radius: 8px; }
        @media (max-width: 700px) { .job-details { grid-template-columns: 1fr; } }
        .job-detail-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .job-detail-value { font-size: 0.95rem; }
        .job-detail-value.mono { font-family: 'Space Mono', monospace; color: var(--accent); }
        
        .job-equipment { margin-bottom: 16px; }
        .job-equipment-title { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .equipment-tags { display: flex; flex-wrap: wrap; gap: 8px; }
        .equipment-tag { background: var(--bg-input); padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; }
        .equipment-tag .qty { color: var(--accent); font-family: 'Space Mono', monospace; margin-right: 6px; }
        
        .job-actions { display: flex; gap: 12px; justify-content: flex-end; padding-top: 16px; border-top: 1px solid var(--border); }
        
        /* Buttons */
        .btn { padding: 10px 20px; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: var(--accent); color: var(--bg-dark); border: none; }
        .btn-primary:hover { box-shadow: 0 4px 16px var(--accent-glow); transform: translateY(-1px); }
        .btn-secondary { background: var(--accent-blue); color: white; border: none; }
        .btn-secondary:hover { box-shadow: 0 4px 16px rgba(0, 168, 255, 0.3); }
        .btn-outline { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
        .btn-outline:hover { border-color: var(--text-secondary); color: var(--text-primary); }
        .btn-danger { background: transparent; color: var(--error); border: 1px solid var(--error); }
        .btn-danger:hover { background: var(--error); color: white; }
        .btn-success { background: var(--success); color: var(--bg-dark); border: none; }
        
        /* Status badges */
        .status-badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-badge.pending { background: rgba(255, 170, 0, 0.15); color: var(--warning); }
        .status-badge.assigned { background: rgba(0, 168, 255, 0.15); color: var(--accent-blue); }
        .status-badge.accepted { background: rgba(0, 212, 170, 0.15); color: var(--success); }
        .status-badge.in-progress { background: rgba(0, 168, 255, 0.15); color: var(--accent-blue); }
        .status-badge.completed { background: rgba(0, 212, 170, 0.15); color: var(--success); }
        .status-badge.open { background: rgba(255, 170, 0, 0.15); color: var(--warning); }
        
        .priority-badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; margin-left: 8px; }
        .priority-badge.urgent { background: var(--warning); color: var(--bg-dark); }
        .priority-badge.emergency { background: var(--error); color: white; }
        
        /* Empty state */
        .empty-state { text-align: center; padding: 60px 20px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; }
        .empty-state-icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.5; }
        .empty-state h3 { font-size: 1.25rem; margin-bottom: 8px; }
        .empty-state p { color: var(--text-secondary); }
        
        /* Rental company label */
        .rental-company { display: inline-flex; align-items: center; gap: 6px; background: var(--bg-input); padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; color: var(--text-secondary); }
        .rental-company img { width: 16px; height: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <nav class="nav">
            <a href="index.html" class="logo" style="text-decoration: none;">FLEETCONNECT</a>
            <div class="nav-right">
                <div class="nav-links">
                    <a href="index.html">Home</a>
                    <a href="vendor-dashboard.html" class="active">Dashboard</a>
                    <a href="job-history.html">Job History</a>
                </div>
                <div class="vendor-badge">VENDOR</div>
                <span class="user-name" id="userName" style="color: var(--text-secondary); font-size: 0.9rem;"></span>
                <button class="logout-btn" onclick="logout()" style="background: transparent; border: 1px solid var(--border); color: var(--text-secondary); padding: 8px 16px; border-radius: 6px; cursor: pointer;">Logout</button>
            </div>
        </nav>
        
        <header class="header">
            <h1>Vendor Dashboard</h1>
            <p>Manage your assigned jobs and find new work</p>
        </header>
        
        <div class="stats-row">
            <div class="stat-card highlight">
                <div class="stat-label">Needs Response</div>
                <div class="stat-value warning" id="statNeedsResponse">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Active Jobs</div>
                <div class="stat-value accent" id="statActive">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Completed (This Month)</div>
                <div class="stat-value" id="statCompleted">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Open Jobs Available</div>
                <div class="stat-value" id="statOpen">0</div>
            </div>
        </div>
        
        <div class="tabs">
            <button class="tab active" data-tab="assigned" id="tabAssigned">Assigned to You <span class="count" id="countAssigned">0</span></button>
            <button class="tab" data-tab="active" id="tabActive">Active Jobs <span class="count" id="countActive">0</span></button>
            <button class="tab" data-tab="open" id="tabOpen">Open Jobs <span class="count" id="countOpen">0</span></button>
            <button class="tab" data-tab="completed" id="tabCompleted">Completed <span class="count" id="countCompleted">0</span></button>
        </div>
        
        <div class="jobs-grid" id="jobsContainer">
            <!-- Jobs populated by JS -->
        </div>
    </div>
    
    <script src="vendor-dashboard.js"></script>
</body>
</html>
