<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | FleetConnect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #1a1a1a;
            --bg-card: #242424;
            --bg-input: #2a2a2a;
            --bg-hover: #333;
            --border: #333;
            --text-primary: #f5f0e8;
            --text-secondary: #888;
            --text-muted: #666;
            --accent: #60a5fa;
            --accent-glow: rgba(96, 165, 250, 0.3);
            --accent-blue: #60a5fa;
            --warning: #f59e0b;
            --error: #ef4444;
            --success: #22c55e;
            --admin: #60a5fa;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; line-height: 1.6; }
        .container { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 24px 32px; }
        
        .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        .logo { font-family: 'Inter', sans-serif; font-size: 1.1rem; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; text-decoration: none; }
        .nav-right { display: flex; align-items: center; gap: 24px; }
        .nav-links { display: flex; gap: 24px; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: color 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: var(--admin); }
        .admin-badge { background: var(--admin); color: white; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .user-name { font-size: 0.9rem; color: var(--text-secondary); }
        .logout-btn { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); padding: 8px 16px; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
        .logout-btn:hover { border-color: var(--error); color: var(--error); }
        
        .header { margin-bottom: 32px; }
        .header h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; }
        .header p { color: var(--text-secondary); }
        
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
        @media (max-width: 800px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
        .stat-label { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .stat-value { font-size: 1.6rem; font-weight: 700; font-family: 'Inter', sans-serif; }
        .stat-value.admin { color: var(--admin); }
        .stat-value.accent { color: var(--accent); }
        .stat-value.warning { color: var(--warning); }
        .stat-value.blue { color: var(--accent-blue); }
        
        .table-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .table-header-row { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px; border-bottom: 1px solid var(--border); }
        .table-title { font-size: 1.1rem; font-weight: 600; }
        .table-grid { display: grid; grid-template-columns: 2fr 2fr 1fr 1fr 150px; gap: 16px; padding: 14px 24px; font-size: 0.85rem; }
        .table-grid.header { background: var(--bg-input); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-secondary); font-weight: 600; }
        .table-grid.row { border-bottom: 1px solid var(--border); transition: background 0.2s; }
        .table-grid.row:hover { background: var(--bg-hover); }
        
        .role-badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
        .role-badge.admin { background: rgba(168, 85, 247, 0.15); color: var(--admin); }
        .role-badge.rental { background: rgba(0, 168, 255, 0.15); color: var(--accent-blue); }
        .role-badge.vendor { background: rgba(0, 212, 170, 0.15); color: var(--accent); }
        .role-badge.fieldworker { background: rgba(255, 170, 0, 0.15); color: var(--warning); }
        
        .btn { padding: 8px 16px; font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 500; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: var(--admin); color: white; border: none; }
        .btn-primary:hover { box-shadow: 0 4px 16px rgba(168, 85, 247, 0.3); }
        .btn-small { padding: 6px 12px; font-size: 0.8rem; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
        .btn-outline:hover { border-color: var(--text-secondary); color: var(--text-primary); }
        .btn-danger { background: transparent; border: 1px solid var(--error); color: var(--error); }
        .btn-danger:hover { background: var(--error); color: white; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
        .modal-overlay.show { display: flex; }
        .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 500px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 24px; border-bottom: 1px solid var(--border); }
        .modal-header h2 { font-size: 1.25rem; }
        .modal-close { background: transparent; border: none; color: var(--text-secondary); font-size: 1.5rem; cursor: pointer; }
        .modal-body { padding: 24px; }
        .modal-footer { display: flex; gap: 12px; justify-content: flex-end; padding: 24px; border-top: 1px solid var(--border); }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 8px; }
        .form-group input, .form-group select { width: 100%; padding: 12px 14px; font-family: 'Inter', sans-serif; font-size: 0.95rem; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--admin); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        .loading { text-align: center; padding: 40px; color: var(--text-secondary); }
        
        @media (max-width: 800px) {
            .table-grid { grid-template-columns: 1fr; gap: 8px; }
            .table-grid.header { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="nav">
            <a href="index.html" class="logo">FLEETCONNECT</a>
            <div class="nav-right">
                <div class="nav-links">
                    <a href="admin-dashboard.html" class="active">Users</a>
                    <a href="work-orders.html">Work Orders</a>
                    <a href="create-job.html">Create Work Order</a>
                    <a href="admin-feature-flags.html">Feature Flags</a>
                    <a href="settings.html">Settings</a>
                </div>
                <div class="admin-badge">ADMIN</div>
                <div class="user-info">
                    <span class="user-name" id="userName">Admin</span>
                    <button class="logout-btn" onclick="logout()">Logout</button>
                </div>
            </div>
        </nav>
        
        <header class="header">
            <h1>Admin Dashboard</h1>
            <p>Manage users, monitor activity, and oversee all operations</p>
        </header>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Users</div>
                <div class="stat-value admin" id="statUsers">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Rental Companies</div>
                <div class="stat-value blue" id="statRentals">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Vendors</div>
                <div class="stat-value accent" id="statVendors">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Field Workers</div>
                <div class="stat-value warning" id="statWorkers">-</div>
            </div>
        </div>
        
        <div class="table-card">
            <div class="table-header-row">
                <span class="table-title">All Users</span>
                <button class="btn btn-primary" onclick="openAddUserModal()">+ Add User</button>
            </div>
            <div class="table-grid header">
                <div>Name</div>
                <div>Email</div>
                <div>Role</div>
                <div>Company</div>
                <div>Actions</div>
            </div>
            <div id="usersTableBody">
                <div class="loading">Loading users...</div>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="userModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Add User</h2>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <form id="userForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" id="formName" required>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="formEmail" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" id="formPassword" required>
                        </div>
                        <div class="form-group">
                            <label>Role</label>
                            <select id="formRole">
                                <option value="admin">Admin</option>
                                <option value="rental">Rental Company</option>
                                <option value="vendor">Vendor</option>
                                <option value="fieldworker">Field Worker</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Company Name</label>
                        <input type="text" id="formCompany" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveUser()">Save User</button>
            </div>
        </div>
    </div>
    
    <script src="supabase-client.js"></script>
    <script src="demo-switcher.js"></script>
    <script src="notifications.js"></script>
    <script src="realtime.js"></script>
<script src="onboarding.js"></script>
    <script>
        // Check auth
        const currentUser = checkAuth(['admin']);
        if (currentUser) {
            document.getElementById('userName').textContent = currentUser.name;
        }
        
        let allUsers = [];
        let editingUserId = null;

        async function loadUsers() {
            allUsers = await getAllUsers();
            updateStats();
            renderTable();
        }
        
        function updateStats() {
            document.getElementById('statUsers').textContent = allUsers.length;
            document.getElementById('statRentals').textContent = allUsers.filter(u => u.role === 'rental').length;
            document.getElementById('statVendors').textContent = allUsers.filter(u => u.role === 'vendor').length;
            document.getElementById('statWorkers').textContent = allUsers.filter(u => u.role === 'fieldworker').length;
        }
        
        function renderTable() {
            const tbody = document.getElementById('usersTableBody');
            
            if (allUsers.length === 0) {
                tbody.innerHTML = '<div class="loading">No users found</div>';
                return;
            }
            
            tbody.innerHTML = allUsers.map(user => `
                <div class="table-grid row">
                    <div>${safe(user.name)}</div>
                    <div>${safe(user.email)}</div>
                    <div><span class="role-badge ${safe(user.role)}">${safe(user.role)}</span></div>
                    <div>${safe(user.company || '-')}</div>
                    <div>
                        <button class="btn btn-small btn-outline" onclick="editUser('${user.id}')">Edit</button>
                        <button class="btn btn-small btn-danger" onclick="removeUser('${user.id}')">Delete</button>
                    </div>
                </div>
            `).join('');
        }
        
        function openAddUserModal() {
            editingUserId = null;
            document.getElementById('modalTitle').textContent = 'Add User';
            document.getElementById('userForm').reset();
            document.getElementById('userModal').classList.add('show');
        }
        
        function editUser(userId) {
            const user = allUsers.find(u => u.id === userId);
            if (!user) return;
            
            editingUserId = userId;
            document.getElementById('modalTitle').textContent = 'Edit User';
            document.getElementById('formName').value = user.name;
            document.getElementById('formEmail').value = user.email;
            document.getElementById('formPassword').value = '';
            document.getElementById('formRole').value = user.role;
            document.getElementById('formCompany').value = user.company || '';
            document.getElementById('userModal').classList.add('show');
        }
        
        function closeModal() {
            document.getElementById('userModal').classList.remove('show');
        }
        
        async function saveUser() {
            const userData = {
                name: document.getElementById('formName').value,
                email: document.getElementById('formEmail').value,
                role: document.getElementById('formRole').value,
                company: document.getElementById('formCompany').value
            };

            const passwordValue = document.getElementById('formPassword').value;
            if (passwordValue) {
                userData.password = passwordValue;
            } else if (!editingUserId) {
                alert('Password is required for new users.');
                return;
            }
            
            let result;
            if (editingUserId) {
                result = await updateUser(editingUserId, userData);
            } else {
                result = await createUser(userData);
            }
            
            if (result.success) {
                closeModal();
                await loadUsers();
            } else {
                alert('Error: ' + result.error);
            }
        }
        
        async function removeUser(userId) {
            if (!confirm('Delete this user? This cannot be undone.')) return;
            
            const result = await deleteUser(userId);
            if (result.success) {
                await loadUsers();
            } else {
                alert('Error: ' + result.error);
            }
        }
        
        // Load on start
        loadUsers();
    </script>
</body>
</html>
