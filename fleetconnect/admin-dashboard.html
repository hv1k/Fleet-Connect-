<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Dashboard — FleetConnect</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="sidebar"></div>
<div class="main">

<h1 class="page-title">Admin Dashboard</h1>
<div class="stats-grid" id="stats"></div>
<div class="card">
  <div class="card-title">Recent Jobs</div>
  <table><thead><tr><th>Job Site</th><th>Customer</th><th>Status</th><th>Created</th></tr></thead><tbody id="jobsBody"></tbody></table>
</div>

</div>
<script src="store.js"></script>
<script src="sidebar.js"></script>
<script>
requireAuth(['admin']);
const s = Store.stats();
document.getElementById('stats').innerHTML = [
  {v:s.totalUsers,l:'Total Users'},{v:s.totalJobs,l:'Total Jobs'},{v:s.totalInvoices,l:'Invoices'},{v:'$'+s.totalRevenue.toFixed(2),l:'Total Revenue'}
].map(x=>'<div class="stat-card"><div class="stat-value">'+x.v+'</div><div class="stat-label">'+x.l+'</div></div>').join('');
document.getElementById('jobsBody').innerHTML = Store.getJobs().slice(-10).reverse().map(j=>
  '<tr><td>'+j.jobSite+'</td><td>'+j.customer+'</td><td><span class="badge badge-'+j.status+'">'+j.status+'</span></td><td>'+new Date(j.createdAt).toLocaleDateString()+'</td></tr>'
).join('') || '<tr><td colspan="4" class="empty-state">No jobs yet</td></tr>';
</script>
</body>
</html>
