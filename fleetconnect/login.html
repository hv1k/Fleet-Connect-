<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FleetConnect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --bg-card: #12121a;
            --bg-input: #1a1a24;
            --border: #2a2a3a;
            --text-primary: #ffffff;
            --text-secondary: #8a8a9a;
            --text-muted: #5a5a6a;
            --accent: #00d4aa;
            --accent-glow: rgba(0, 212, 170, 0.3);
            --error: #ff6b6b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'DM Sans', sans-serif; 
            background: var(--bg-dark); 
            color: var(--text-primary); 
            min-height: 100vh; 
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        body::before { 
            content: ''; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background-image: 
                linear-gradient(rgba(0, 212, 170, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 170, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }
        
        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
        }
        
        .logo {
            font-family: 'Space Mono', monospace;
            font-size: 2rem;
            color: var(--accent);
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }
        
        .tagline {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 40px;
            font-size: 0.95rem;
        }
        
        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px 32px;
        }
        
        .login-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
        }
        
        .login-subtitle {
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 32px;
            font-size: 0.9rem;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
        
        input {
            width: 100%;
            padding: 14px 16px;
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            transition: all 0.2s;
        }
        
        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        
        input::placeholder {
            color: var(--text-muted);
        }
        
        .error-message {
            display: none;
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        
        .error-message.show {
            display: block;
        }
        
        .login-btn {
            width: 100%;
            padding: 16px;
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            background: var(--accent);
            color: var(--bg-dark);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 12px;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--accent-glow);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        
        .demo-accounts {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }
        
        .demo-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 16px;
            text-align: center;
        }
        
        .demo-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .demo-btn {
            padding: 12px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            background: var(--bg-input);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .demo-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .demo-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .demo-btn span {
            display: block;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid transparent;
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">FLEETCONNECT</div>
        <p class="tagline">Fleet Management Platform</p>
        
        <div class="login-card">
            <h1 class="login-title">Welcome back</h1>
            <p class="login-subtitle">Sign in to your account</p>
            
            <div class="error-message" id="errorMessage">
                Invalid email or password. Please try again.
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@company.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                
                <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
            </form>
            
            <div class="demo-accounts">
                <div class="demo-title">Quick Demo Access</div>
                <div class="demo-buttons">
                    <button class="demo-btn" onclick="demoLogin('admin@fleetconnect.com', 'admin123')">
                        Admin
                        <span>Full access</span>
                    </button>
                    <button class="demo-btn" onclick="demoLogin('paul@sunbelt.com', 'rental123')">
                        Rental Co.
                        <span>Create jobs</span>
                    </button>
                    <button class="demo-btn" onclick="demoLogin('owner@yourfleet.com', 'vendor123')">
                        Vendor
                        <span>Manage jobs</span>
                    </button>
                    <button class="demo-btn" onclick="demoLogin('driver@yourfleet.com', 'field123')">
                        Field Worker
                        <span>Mobile view</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="supabase-client.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');
        
        // Login form handler
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            await attemptLogin(email, password);
        });
        
        async function attemptLogin(email, password) {
            // Show loading state
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loading"></span>Signing in...';
            errorMessage.classList.remove('show');
            
            try {
                const result = await loginUser(email, password);
                
                if (result.success) {
                    // Redirect to home page
                    window.location.href = 'index.html';
                } else {
                    errorMessage.textContent = result.error || 'Invalid email or password';
                    errorMessage.classList.add('show');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = 'Sign In';
                }
            } catch (err) {
                console.error('Login error:', err);
                errorMessage.textContent = 'Connection error. Please try again.';
                errorMessage.classList.add('show');
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Sign In';
            }
        }
        
        // Demo login buttons
        async function demoLogin(email, password) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
            await attemptLogin(email, password);
        }
        
        // Clear error on input
        document.getElementById('email').addEventListener('input', () => {
            errorMessage.classList.remove('show');
        });
        document.getElementById('password').addEventListener('input', () => {
            errorMessage.classList.remove('show');
        });
    </script>
</body>
</html>
