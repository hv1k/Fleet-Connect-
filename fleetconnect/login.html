<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login — FleetConnect</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="login-container">
  <div class="login-box">
    <h1>⚡ FleetConnect</h1>
    <p>Select your role to continue</p>
    <div class="role-grid">
      <div class="role-btn" onclick="doLogin('admin')"><div class="role-icon">🛡️</div><div class="role-name">Admin</div></div>
      <div class="role-btn" onclick="doLogin('rental')"><div class="role-icon">🏗️</div><div class="role-name">Rental</div></div>
      <div class="role-btn" onclick="doLogin('vendor')"><div class="role-icon">🏭</div><div class="role-name">Vendor</div></div>
      <div class="role-btn" onclick="doLogin('fieldworker')"><div class="role-icon">👷</div><div class="role-name">Field Worker</div></div>
    </div>
  </div>
</div>
<script src="store.js"></script>
<script>
const dashboards = {admin:'admin-dashboard.html',rental:'rental-dashboard.html',vendor:'vendor-dashboard.html',fieldworker:'worker-dashboard.html'};
function doLogin(role) {
  const names = {admin:'Admin',rental:'RentalCo',vendor:'VendorInc',fieldworker:'John Worker'};
  Store.login(role, names[role]);
  Store.getUsers(); // seed
  location.href = dashboards[role];
}
if(Store.getRole()) location.href = dashboards[Store.getRole()];
</script>
</body>
</html>
