<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Jobs | FleetConnect</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-dark: #0a0a0f; --bg-card: #12121a; --bg-input: #1a1a24; --border: #2a2a3a; --text-primary: #ffffff; --text-secondary: #8a8a9a; --text-muted: #5a5a6a; --accent: #00d4aa; --warning: #ffaa00; --error: #ff6b6b; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; padding-bottom: 100px; }
        
        .header { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 16px 20px; position: sticky; top: 0; z-index: 50; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .logo { font-family: 'Space Mono', monospace; font-size: 1.25rem; color: var(--accent); text-decoration: none; }
        .logout-btn { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; }
        .welcome { font-size: 1.1rem; font-weight: 600; }
        
        .stats { display: flex; gap: 12px; padding: 16px 20px; }
        .stat { flex: 1; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; text-align: center; }
        .stat-value { font-size: 1.5rem; font-weight: 700; font-family: 'Space Mono', monospace; color: var(--accent); }
        .stat-label { font-size: 0.7rem; color: var(--text-secondary); text-transform: uppercase; margin-top: 2px; }
        
        .tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--bg-card); }
        .tab { flex: 1; padding: 14px; background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--text-secondary); font-family: 'DM Sans', sans-serif; font-size: 0.85rem; cursor: pointer; }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
        
        .content { padding: 16px 20px; }
        
        .job-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
        .job-card.urgent { border-left: 4px solid var(--warning); }
        .job-header { padding: 16px; border-bottom: 1px solid var(--border); }
        .job-title { font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
        .job-meta { font-size: 0.8rem; color: var(--text-secondary); }
        .job-info { padding: 12px 16px; background: var(--bg-input); }
        .job-info-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 0.85rem; }
        .job-info-label { color: var(--text-muted); }
        .job-info-value { color: var(--text-primary); }
        .job-info-value a { color: var(--accent); text-decoration: none; }
        .equipment-count { padding: 12px 16px; font-size: 0.85rem; color: var(--accent); border-top: 1px solid var(--border); }
        .job-actions { padding: 12px 16px; display: flex; gap: 10px; }
        
        .btn { flex: 1; padding: 12px; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 600; border-radius: 8px; cursor: pointer; text-align: center; border: none; }
        .btn-primary { background: var(--accent); color: var(--bg-dark); }
        .btn-outline { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
        
        .empty { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
        
        /* Invoice Modal */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; overflow-y: auto; }
        .modal-content { background: var(--bg-dark); min-height: 100%; padding: 20px; padding-bottom: 120px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: var(--bg-card); border-radius: 12px; margin-bottom: 20px; position: sticky; top: 0; z-index: 10; }
        .modal-header h2 { font-size: 1.1rem; }
        .modal-close { background: none; border: none; color: var(--text-secondary); font-size: 1.5rem; cursor: pointer; padding: 4px 8px; }
        
        .job-site-info { background: var(--bg-card); padding: 16px; border-radius: 12px; margin-bottom: 20px; }
        .job-site-name { font-weight: 600; font-size: 1.1rem; margin-bottom: 4px; }
        .job-site-address { font-size: 0.85rem; color: var(--text-secondary); }
        
        .section-title { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); margin-bottom: 12px; margin-top: 24px; }
        
        /* Unit Cards */
        .unit-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
        .unit-card.active { border-color: var(--accent); }
        .unit-header { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .unit-info { display: flex; align-items: center; gap: 12px; }
        .unit-checkbox { width: 24px; height: 24px; border: 2px solid var(--border); border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .unit-card.active .unit-checkbox { background: var(--accent); border-color: var(--accent); }
        .unit-card.active .unit-checkbox::after { content: '✓'; color: var(--bg-dark); font-weight: bold; font-size: 14px; }
        .unit-number { font-family: 'Space Mono', monospace; font-weight: 600; color: var(--accent); }
        .unit-desc { font-size: 0.85rem; color: var(--text-secondary); }
        .unit-toggle { color: var(--text-muted); font-size: 0.8rem; }
        
        .unit-fields { display: none; padding: 16px; border-top: 1px solid var(--border); background: var(--bg-input); }
        .unit-card.active .unit-fields { display: block; }
        
        .field-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .field-group { }
        .field-group label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; }
        .field-group input { width: 100%; padding: 12px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); font-family: 'Space Mono', monospace; font-size: 1rem; text-align: center; }
        .field-group input:focus { outline: none; border-color: var(--accent); }
        .field-group .unit-label { font-size: 0.7rem; color: var(--text-muted); text-align: center; margin-top: 2px; }
        
        /* Invoice Details */
        .invoice-details { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-top: 20px; }
        .detail-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .detail-group label { display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 6px; }
        .detail-group input, .detail-group textarea { width: 100%; padding: 12px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); font-family: 'DM Sans', sans-serif; }
        .detail-group input:focus, .detail-group textarea:focus { outline: none; border-color: var(--accent); }
        .detail-group textarea { min-height: 70px; resize: vertical; }
        
        /* Incident Section */
        .incident-toggle { display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--bg-input); border-radius: 10px; cursor: pointer; margin-top: 16px; }
        .incident-toggle input { display: none; }
        .toggle-switch { width: 48px; height: 26px; background: var(--border); border-radius: 13px; position: relative; transition: background 0.3s; flex-shrink: 0; }
        .toggle-switch::after { content: ''; position: absolute; width: 20px; height: 20px; background: white; border-radius: 50%; top: 3px; left: 3px; transition: transform 0.3s; }
        .incident-toggle input:checked + .toggle-switch { background: var(--warning); }
        .incident-toggle input:checked + .toggle-switch::after { transform: translateX(22px); }
        
        .incident-fields { display: none; padding: 16px; background: rgba(255, 170, 0, 0.1); border: 1px solid var(--warning); border-radius: 10px; margin-top: 12px; }
        .incident-fields.show { display: block; }
        .incident-fields h4 { color: var(--warning); font-size: 0.9rem; margin-bottom: 12px; }
        
        .file-upload { border: 2px dashed var(--border); border-radius: 10px; padding: 16px; text-align: center; cursor: pointer; margin-bottom: 10px; }
        .file-upload:hover { border-color: var(--accent); }
        .file-upload input { display: none; }
        .file-upload-text { font-size: 0.85rem; color: var(--text-secondary); }
        .file-preview { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .file-preview-item { position: relative; width: 60px; height: 60px; border-radius: 8px; overflow: hidden; }
        .file-preview-item img, .file-preview-item video { width: 100%; height: 100%; object-fit: cover; }
        .file-preview-item .remove { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; background: var(--error); border: none; border-radius: 50%; color: white; font-size: 10px; cursor: pointer; }
        
        /* Summary */
        .invoice-summary { background: var(--bg-card); border: 1px solid var(--accent); border-radius: 12px; padding: 16px; margin-top: 20px; }
        .summary-title { font-size: 0.8rem; color: var(--accent); text-transform: uppercase; margin-bottom: 12px; }
        .summary-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
        .summary-row:last-child { border-bottom: none; font-weight: 600; }
        .summary-label { color: var(--text-secondary); }
        .summary-value { font-family: 'Space Mono', monospace; }
        
        .submit-invoice { position: fixed; bottom: 20px; left: 20px; right: 20px; padding: 16px; background: var(--accent); color: var(--bg-dark); border: none; border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 1rem; font-weight: 600; cursor: pointer; z-index: 100; }
        .submit-invoice:disabled { opacity: 0.6; cursor: not-allowed; }
        
        /* History Styles */
        .history-invoice { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
        .history-header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        .history-date { font-weight: 600; }
        .history-worker { font-size: 0.85rem; color: var(--text-secondary); }
        .history-units { padding: 12px 16px; }
        .history-unit { display: flex; justify-content: space-between; padding: 10px; background: var(--bg-input); border-radius: 8px; margin-bottom: 8px; }
        .history-unit:last-child { margin-bottom: 0; }
        .history-unit-number { font-family: 'Space Mono', monospace; color: var(--accent); font-weight: 600; }
        .history-unit-details { font-size: 0.85rem; color: var(--text-secondary); text-align: right; }
        .history-totals { padding: 12px 16px; background: var(--bg-input); border-top: 1px solid var(--border); display: flex; justify-content: space-around; }
        .history-total { text-align: center; }
        .history-total-value { font-family: 'Space Mono', monospace; font-size: 1.1rem; color: var(--accent); }
        .history-total-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
        .history-incident { margin: 12px 16px; padding: 12px; background: rgba(255,170,0,0.1); border: 1px solid var(--warning); border-radius: 8px; }
        .history-incident-title { color: var(--warning); font-weight: 600; font-size: 0.85rem; margin-bottom: 6px; }
        .history-incident-desc { font-size: 0.85rem; color: var(--text-secondary); }
        .history-incident-media { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .history-incident-media img, .history-incident-media video { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-top">
            <a href="index.html" class="logo">FLEETCONNECT</a>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
        <div class="welcome" id="welcome">Welcome!</div>
    </header>
    
    <div class="stats">
        <div class="stat"><div class="stat-value" id="statActive">-</div><div class="stat-label">Active Jobs</div></div>
        <div class="stat"><div class="stat-value" id="statInvoices">-</div><div class="stat-label">Invoices Today</div></div>
    </div>
    
    <div class="tabs">
        <button class="tab active" data-tab="active">Active Jobs</button>
        <button class="tab" data-tab="completed">Completed</button>
    </div>
    
    <div class="content" id="content">
        <div class="empty">Loading...</div>
    </div>
    
    <script src="supabase-client.js"></script>
    <script>
        const currentUser = checkAuth(['fieldworker']);
        if (currentUser) {
            const hour = new Date().getHours();
            const greeting = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
            document.getElementById('welcome').textContent = `${greeting}, ${currentUser.name.split(' ')[0]}!`;
        }
        
        let allJobs = [];
        let allEquipment = [];
        let allInvoices = [];
        let currentTab = 'active';
        let selectedPhotos = [];
        let selectedVideos = [];
        let activeUnits = {};
        
        async function loadData() {
            allJobs = await getJobsByWorker(currentUser.id);
            if (allJobs.length === 0) {
                allJobs = await getAllJobs();
            }
            allEquipment = await getAllEquipment();
            allInvoices = await getAllInvoices();
            updateStats();
            renderJobs();
        }
        
        async function getAllEquipment() {
            const { data } = await db.from('equipment').select('*');
            return data || [];
        }
        
        async function getAllInvoices() {
            const { data } = await db.from('invoices').select('*').order('created_at', { ascending: false });
            return data || [];
        }
        
        function updateStats() {
            const activeJobs = allJobs.filter(j => ['assigned','accepted','in-progress'].includes(j.status));
            document.getElementById('statActive').textContent = activeJobs.length;
            
            const today = new Date().toDateString();
            const todayInvoices = allInvoices.filter(inv => new Date(inv.created_at).toDateString() === today);
            document.getElementById('statInvoices').textContent = todayInvoices.length;
        }
        
        function getEquipmentForJob(jobId) {
            return allEquipment.filter(e => e.job_id === jobId);
        }
        
        function getInvoicesForJob(jobId) {
            return allInvoices.filter(inv => inv.job_id === jobId);
        }
        
        function renderJobs() {
            const filtered = currentTab === 'active' 
                ? allJobs.filter(j => ['assigned','accepted','in-progress'].includes(j.status))
                : allJobs.filter(j => j.status === 'completed');
            
            const container = document.getElementById('content');
            
            if (!filtered.length) {
                container.innerHTML = `<div class="empty">No ${currentTab} jobs</div>`;
                return;
            }
            
            container.innerHTML = filtered.map(job => {
                const equipment = getEquipmentForJob(job.id);
                const invoices = getInvoicesForJob(job.id);
                return `
                    <div class="job-card ${job.priority === 'urgent' || job.priority === 'emergency' ? 'urgent' : ''}">
                        <div class="job-header">
                            <div class="job-title">${job.job_site_name || 'Untitled Job'}</div>
                            <div class="job-meta">${formatJobType(job.job_type)} • ${invoices.length} invoice${invoices.length !== 1 ? 's' : ''}</div>
                        </div>
                        <div class="job-info">
                            <div class="job-info-row">
                                <span class="job-info-label">Location</span>
                                <span class="job-info-value">
                                    <a href="https://maps.google.com/?q=${encodeURIComponent((job.address_street||'')+' '+(job.address_city||'')+' '+(job.address_state||''))}" target="_blank">
                                        ${job.address_city || '-'}, ${job.address_state || '-'}
                                    </a>
                                </span>
                            </div>
                            <div class="job-info-row">
                                <span class="job-info-label">Contact</span>
                                <span class="job-info-value">
                                    ${job.contact_phone ? `<a href="tel:${job.contact_phone}">${job.contact_name || job.contact_phone}</a>` : job.contact_name || '-'}
                                </span>
                            </div>
                        </div>
                        <div class="equipment-count">🔧 ${equipment.length} unit${equipment.length !== 1 ? 's' : ''} on site</div>
                        <div class="job-actions">
                            ${job.status !== 'completed' ? `<button class="btn btn-primary" onclick="openInvoiceModal('${job.id}')">Create Invoice</button>` : ''}
                            <button class="btn btn-outline" onclick="viewHistory('${job.id}')">History</button>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function openInvoiceModal(jobId) {
            const job = allJobs.find(j => j.id === jobId);
            const equipment = getEquipmentForJob(jobId);
            
            selectedPhotos = [];
            selectedVideos = [];
            activeUnits = {};
            
            const now = new Date();
            const dateStr = now.toISOString().split('T')[0];
            const timeStr = now.toTimeString().slice(0, 5);
            
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.id = 'invoiceModal';
            modal.innerHTML = `
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>Create Invoice</h2>
                        <button class="modal-close" onclick="closeInvoiceModal()">×</button>
                    </div>
                    
                    <div class="job-site-info">
                        <div class="job-site-name">${job.job_site_name}</div>
                        <div class="job-site-address">${job.address_street || ''} ${job.address_city || ''}, ${job.address_state || ''}</div>
                    </div>
                    
                    <div class="section-title">Select Units Serviced</div>
                    <p style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:16px;">Tap each unit you fueled and enter the details</p>
                    
                    <div id="unitsList">
                        ${equipment.length > 0 ? equipment.map(eq => `
                            <div class="unit-card" id="unit-${eq.id}" onclick="toggleUnit('${eq.id}')">
                                <div class="unit-header">
                                    <div class="unit-info">
                                        <div class="unit-checkbox"></div>
                                        <div>
                                            <div class="unit-number">${eq.equipment_number || 'No #'}</div>
                                            <div class="unit-desc">${eq.description || 'No description'}</div>
                                        </div>
                                    </div>
                                    <div class="unit-toggle">Tap to add</div>
                                </div>
                                <div class="unit-fields" onclick="event.stopPropagation()">
                                    <div class="field-row">
                                        <div class="field-group">
                                            <label>Hours</label>
                                            <input type="number" id="hours-${eq.id}" step="0.1" min="0" placeholder="0">
                                            <div class="unit-label">meter</div>
                                        </div>
                                        <div class="field-group">
                                            <label>Diesel</label>
                                            <input type="number" id="diesel-${eq.id}" step="0.1" min="0" placeholder="0">
                                            <div class="unit-label">gallons</div>
                                        </div>
                                        <div class="field-group">
                                            <label>DEF</label>
                                            <input type="number" id="def-${eq.id}" step="0.1" min="0" placeholder="0">
                                            <div class="unit-label">gallons</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `).join('') : `
                            <div style="padding:30px;text-align:center;color:var(--text-muted);background:var(--bg-card);border-radius:12px;">
                                No equipment added to this job.<br>Contact your vendor to add units.
                            </div>
                        `}
                    </div>
                    
                    <div class="invoice-details">
                        <div class="section-title" style="margin-top:0;">Invoice Details</div>
                        <div class="detail-row">
                            <div class="detail-group">
                                <label>Date</label>
                                <input type="date" id="invoiceDate" value="${dateStr}">
                            </div>
                            <div class="detail-group">
                                <label>Time</label>
                                <input type="time" id="invoiceTime" value="${timeStr}">
                            </div>
                        </div>
                        <div class="detail-group">
                            <label>Field Worker</label>
                            <input type="text" id="workerName" value="${currentUser.name}">
                        </div>
                        <div class="detail-group">
                            <label>Notes (optional)</label>
                            <textarea id="invoiceNotes" placeholder="Gate codes, issues, etc..."></textarea>
                        </div>
                        
                        <label class="incident-toggle" onclick="toggleIncident()">
                            <input type="checkbox" id="hasIncident">
                            <div class="toggle-switch"></div>
                            <span style="font-size:0.9rem;">Report an incident</span>
                        </label>
                        
                        <div class="incident-fields" id="incidentFields">
                            <h4>⚠️ Incident Details</h4>
                            <div class="detail-group">
                                <label>What happened?</label>
                                <textarea id="incidentDescription" placeholder="Describe the incident..."></textarea>
                            </div>
                            <div class="detail-group">
                                <label>Photos</label>
                                <div class="file-upload" onclick="document.getElementById('photoInput').click()">
                                    <input type="file" id="photoInput" accept="image/*" multiple onchange="handlePhotos(event)">
                                    <div class="file-upload-text">📷 Tap to add photos</div>
                                </div>
                                <div class="file-preview" id="photoPreview"></div>
                            </div>
                            <div class="detail-group">
                                <label>Videos</label>
                                <div class="file-upload" onclick="document.getElementById('videoInput').click()">
                                    <input type="file" id="videoInput" accept="video/*" multiple onchange="handleVideos(event)">
                                    <div class="file-upload-text">🎥 Tap to add videos</div>
                                </div>
                                <div class="file-preview" id="videoPreview"></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="invoice-summary" id="invoiceSummary">
                        <div class="summary-title">Invoice Summary</div>
                        <div class="summary-row">
                            <span class="summary-label">Units Serviced</span>
                            <span class="summary-value" id="summaryUnits">0</span>
                        </div>
                        <div class="summary-row">
                            <span class="summary-label">Total Diesel</span>
                            <span class="summary-value" id="summaryDiesel">0 gal</span>
                        </div>
                        <div class="summary-row">
                            <span class="summary-label">Total DEF</span>
                            <span class="summary-value" id="summaryDef">0 gal</span>
                        </div>
                    </div>
                    
                    <button class="submit-invoice" id="submitBtn" onclick="submitInvoice('${jobId}')">
                        Create Invoice
                    </button>
                </div>
            `;
            document.body.appendChild(modal);
            document.body.style.overflow = 'hidden';
        }
        
        function closeInvoiceModal() {
            document.getElementById('invoiceModal')?.remove();
            document.body.style.overflow = '';
            selectedPhotos = [];
            selectedVideos = [];
            activeUnits = {};
        }
        
        function toggleUnit(unitId) {
            const card = document.getElementById(`unit-${unitId}`);
            const isActive = card.classList.contains('active');
            
            if (isActive) {
                card.classList.remove('active');
                delete activeUnits[unitId];
            } else {
                card.classList.add('active');
                activeUnits[unitId] = true;
            }
            
            updateSummary();
        }
        
        function updateSummary() {
            let totalDiesel = 0;
            let totalDef = 0;
            let unitCount = 0;
            
            Object.keys(activeUnits).forEach(unitId => {
                const diesel = parseFloat(document.getElementById(`diesel-${unitId}`)?.value) || 0;
                const def = parseFloat(document.getElementById(`def-${unitId}`)?.value) || 0;
                totalDiesel += diesel;
                totalDef += def;
                unitCount++;
            });
            
            document.getElementById('summaryUnits').textContent = unitCount;
            document.getElementById('summaryDiesel').textContent = `${totalDiesel.toFixed(1)} gal`;
            document.getElementById('summaryDef').textContent = `${totalDef.toFixed(1)} gal`;
        }
        
        // Update summary when inputs change
        document.addEventListener('input', function(e) {
            if (e.target.id?.startsWith('diesel-') || e.target.id?.startsWith('def-')) {
                updateSummary();
            }
        });
        
        function toggleIncident() {
            const checkbox = document.getElementById('hasIncident');
            const fields = document.getElementById('incidentFields');
            checkbox.checked = !checkbox.checked;
            fields.classList.toggle('show', checkbox.checked);
        }
        
        function handlePhotos(event) {
            Array.from(event.target.files).forEach(file => {
                if (file.type.startsWith('image/')) selectedPhotos.push(file);
            });
            renderPhotoPreview();
        }
        
        function handleVideos(event) {
            Array.from(event.target.files).forEach(file => {
                if (file.type.startsWith('video/')) selectedVideos.push(file);
            });
            renderVideoPreview();
        }
        
        function renderPhotoPreview() {
            document.getElementById('photoPreview').innerHTML = selectedPhotos.map((file, i) => `
                <div class="file-preview-item">
                    <img src="${URL.createObjectURL(file)}">
                    <button class="remove" onclick="event.stopPropagation();selectedPhotos.splice(${i},1);renderPhotoPreview();">×</button>
                </div>
            `).join('');
        }
        
        function renderVideoPreview() {
            document.getElementById('videoPreview').innerHTML = selectedVideos.map((file, i) => `
                <div class="file-preview-item">
                    <video src="${URL.createObjectURL(file)}"></video>
                    <button class="remove" onclick="event.stopPropagation();selectedVideos.splice(${i},1);renderVideoPreview();">×</button>
                </div>
            `).join('');
        }
        
        async function uploadFile(file, folder) {
            const fileName = `${Date.now()}_${Math.random().toString(36).substr(2, 9)}_${file.name}`;
            const filePath = `${folder}/${fileName}`;
            const { error } = await db.storage.from('incidents').upload(filePath, file);
            if (error) return null;
            const { data } = db.storage.from('incidents').getPublicUrl(filePath);
            return data.publicUrl;
        }
        
        async function submitInvoice(jobId) {
            const unitIds = Object.keys(activeUnits);
            if (unitIds.length === 0) {
                alert('Please select at least one unit');
                return;
            }
            
            // Validate all active units have data
            for (const unitId of unitIds) {
                const hours = document.getElementById(`hours-${unitId}`).value;
                const diesel = document.getElementById(`diesel-${unitId}`).value;
                const def = document.getElementById(`def-${unitId}`).value;
                
                if (!hours || !diesel || !def) {
                    alert('Please fill in hours, diesel, and DEF for all selected units');
                    return;
                }
            }
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Creating...';
            
            // Upload incident files
            let uploadedPhotos = [];
            let uploadedVideos = [];
            const hasIncident = document.getElementById('hasIncident').checked;
            
            if (hasIncident) {
                btn.textContent = 'Uploading files...';
                for (const photo of selectedPhotos) {
                    const url = await uploadFile(photo, 'photos');
                    if (url) uploadedPhotos.push(url);
                }
                for (const video of selectedVideos) {
                    const url = await uploadFile(video, 'videos');
                    if (url) uploadedVideos.push(url);
                }
            }
            
            btn.textContent = 'Saving...';
            
            // Build units data
            const equipment = getEquipmentForJob(jobId);
            const unitsData = unitIds.map(unitId => {
                const eq = equipment.find(e => e.id === unitId);
                return {
                    unit_id: unitId,
                    unit_number: eq?.equipment_number || '',
                    unit_description: eq?.description || '',
                    unit_hours: parseFloat(document.getElementById(`hours-${unitId}`).value),
                    diesel_gallons: parseFloat(document.getElementById(`diesel-${unitId}`).value),
                    def_gallons: parseFloat(document.getElementById(`def-${unitId}`).value)
                };
            });
            
            // Calculate totals
            const totalDiesel = unitsData.reduce((sum, u) => sum + u.diesel_gallons, 0);
            const totalDef = unitsData.reduce((sum, u) => sum + u.def_gallons, 0);
            
            // Build timestamp
            const date = document.getElementById('invoiceDate').value;
            const time = document.getElementById('invoiceTime').value;
            const timestamp = new Date(`${date}T${time}`).toISOString();
            
            // Create invoice
            const { data, error } = await db.from('invoices').insert([{
                job_id: jobId,
                worker_id: currentUser.id,
                worker_name: document.getElementById('workerName').value,
                invoice_date: date,
                invoice_time: time,
                notes: document.getElementById('invoiceNotes').value,
                units_data: unitsData,
                total_diesel: totalDiesel,
                total_def: totalDef,
                has_incident: hasIncident,
                incident_description: hasIncident ? document.getElementById('incidentDescription').value : null,
                incident_photos: uploadedPhotos,
                incident_videos: uploadedVideos
            }]).select().single();
            
            if (error) {
                console.error('Error:', error);
                alert('Error creating invoice: ' + error.message);
                btn.disabled = false;
                btn.textContent = 'Create Invoice';
                return;
            }
            
            closeInvoiceModal();
            alert('Invoice created successfully!');
            loadData();
        }
        
        function viewHistory(jobId) {
            const job = allJobs.find(j => j.id === jobId);
            const invoices = getInvoicesForJob(jobId);
            
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>Invoice History</h2>
                        <button class="modal-close" onclick="this.closest('.modal').remove();document.body.style.overflow='';">×</button>
                    </div>
                    
                    <div class="job-site-info">
                        <div class="job-site-name">${job.job_site_name}</div>
                        <div class="job-site-address">${job.address_city || ''}, ${job.address_state || ''}</div>
                    </div>
                    
                    <div style="padding:0 0 100px 0;">
                        ${invoices.length ? invoices.map(inv => {
                            const units = inv.units_data || [];
                            return `
                                <div class="history-invoice">
                                    <div class="history-header">
                                        <div>
                                            <div class="history-date">${new Date(inv.invoice_date).toLocaleDateString()}</div>
                                            <div class="history-worker">By ${inv.worker_name} at ${inv.invoice_time}</div>
                                        </div>
                                    </div>
                                    <div class="history-units">
                                        ${units.map(u => `
                                            <div class="history-unit">
                                                <div>
                                                    <div class="history-unit-number">${u.unit_number}</div>
                                                    <div style="font-size:0.8rem;color:var(--text-muted);">${u.unit_description || ''}</div>
                                                </div>
                                                <div class="history-unit-details">
                                                    <div>⏱ ${u.unit_hours} hrs</div>
                                                    <div>⛽ ${u.diesel_gallons} gal · 💧 ${u.def_gallons} gal</div>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                    <div class="history-totals">
                                        <div class="history-total">
                                            <div class="history-total-value">${inv.total_diesel}</div>
                                            <div class="history-total-label">Total Diesel</div>
                                        </div>
                                        <div class="history-total">
                                            <div class="history-total-value">${inv.total_def}</div>
                                            <div class="history-total-label">Total DEF</div>
                                        </div>
                                        <div class="history-total">
                                            <div class="history-total-value">${units.length}</div>
                                            <div class="history-total-label">Units</div>
                                        </div>
                                    </div>
                                    ${inv.notes ? `<div style="padding:12px 16px;font-size:0.85rem;color:var(--text-secondary);border-top:1px solid var(--border);">📝 ${inv.notes}</div>` : ''}
                                    ${inv.has_incident ? `
                                        <div class="history-incident">
                                            <div class="history-incident-title">⚠️ Incident Reported</div>
                                            <div class="history-incident-desc">${inv.incident_description || ''}</div>
                                            ${inv.incident_photos?.length ? `
                                                <div class="history-incident-media">
                                                    ${inv.incident_photos.map(url => `<img src="${url}" onclick="window.open('${url}','_blank')">`).join('')}
                                                </div>
                                            ` : ''}
                                            ${inv.incident_videos?.length ? `
                                                <div class="history-incident-media">
                                                    ${inv.incident_videos.map(url => `<video src="${url}" onclick="window.open('${url}','_blank')"></video>`).join('')}
                                                </div>
                                            ` : ''}
                                        </div>
                                    ` : ''}
                                </div>
                            `;
                        }).join('') : '<div class="empty">No invoices yet</div>'}
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            document.body.style.overflow = 'hidden';
        }
        
        // Tab switching
        document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', function() {
            document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
            this.classList.add('active');
            currentTab = this.dataset.tab;
            renderJobs();
        }));
        
        loadData();
    </script>
</body>
</html>
