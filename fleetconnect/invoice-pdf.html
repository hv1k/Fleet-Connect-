<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">
    <script>
      // Theme init - prevent flash of wrong theme
      (function(){
        var t = localStorage.getItem('fleetconnect-theme');
        if(t === 'light') document.documentElement.classList.add('light-mode');
      })();

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        .status-badge.pending { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }

        /* Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 200; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
        .modal-overlay.show { display: flex; }
        .modal { background: #242424; border-radius: 16px; width: 100%; max-width: 900px; overflow: hidden; border: 1px solid #333; }
        .modal-header { padding: 20px 24px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }

        .modal-body { padding: 20px 24px; max-height: 70vh; overflow-y: auto; }
        .modal-footer { padding: 16px 24px; border-top: 1px solid #333; display: flex; justify-content: flex-end; gap: 12px; background: #2a2a2a; }
        .btn { padding: 10px 18px; border-radius: 8px; font-size: 0.85rem; font-weight: 500; cursor: pointer; }
        .btn-primary { background: #60a5fa; color: #fff; border: none; }
        .btn-primary:hover { background: #3b82f6; }
        .btn-secondary { background: #333; color: #b8b0a8; border: 1px solid #444; }
        .btn-secondary:hover { background: #444; }

        /* Invoice Preview */
        .invoice-preview { background: #f5f5f5; padding: 40px; border-radius: 8px; margin-top: 16px; }
        .invoice-header { text-align: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 2px solid #333; }
        .invoice-title { font-size: 24px; font-weight: 700; color: #1a1a1a; margin-bottom: 4px; }
        .invoice-subtitle { font-size: 12px; color: #666; }
        .invoice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 30px; }
        .invoice-section-label { font-size: 11px; font-weight: 600; color: #999; text-transform: uppercase; margin-bottom: 8px; }
        .invoice-text { font-size: 13px; color: #333; line-height: 1.6; }
        .invoice-table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        .invoice-table thead tr { background: #e8e8e8; }
        .invoice-table th { padding: 10px; text-align: left; font-size: 12px; font-weight: 600; color: #333; }
        .invoice-table td { padding: 10px; border-bottom: 1px solid #ddd; font-size: 13px; color: #333; }
        .invoice-totals { display: flex; justify-content: flex-end; margin: 20px 0; }
        .invoice-totals-box { width: 300px; }
        .invoice-total-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; }
        .invoice-total-row.bold { font-weight: 600; border-top: 2px solid #333; padding-top: 10px; margin-top: 10px; }

        .empty-state { text-align: center; padding: 50px; color: #888; }
        .loading { text-align: center; padding: 40px; color: #888; }
        .spinner { width: 36px; height: 36px; border: 3px solid #333; border-top-color: #60a5fa; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Mobile */
        .mobile-toggle { display: none; width: 40px; height: 40px; border: 1px solid #444; border-radius: 8px; background: #2a2a2a; color: #f5f0e8; align-items: center; justify-content: center; cursor: pointer; }
        @media (max-width: 900px) {
            .sidebar { display: none; left: 0; }
            .sidebar.open { display: flex; position: fixed; z-index: 100; }
            .main { margin-left: 0; }
            .mobile-toggle { display: flex; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .invoice-grid { grid-template-columns: 1fr; }
            .search-input { width: 100%; }
            .header { padding: 12px 16px; gap: 12px; }
            .content { padding: 16px; }
        }
    
        /* Light Mode */

                    <div class="stat-card">
                        <div class="stat-header"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>This Month</div>
                        <div class="stat-value-row"><span class="stat-value" id="statMonth">0</span></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-header"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>Total Billed</div>
                        <div class="stat-value-row"><span class="stat-value" id="statTotal">$0</span></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-header"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>Pending</div>
                        <div class="stat-value-row"><span class="stat-value" id="statPending">0</span></div>
                    </div>
                </div>

                <!-- Invoices Table -->
                <div class="table-card">
                    <div class="table-header">
                        <div class="table-title">Invoices & Deliveries</div>
                        <div class="table-actions">
                            <input type="text" class="search-input" id="searchInput" placeholder="Search invoices..." oninput="renderInvoices()">
                        </div>
                    </div>
                    <div style="overflow-x:auto;">
                        <table>
                            <thead><tr><th>Invoice #</th><th>Job #</th><th>Date</th><th>Customer</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead>
                            <tbody id="invoiceTable"><tr><td colspan="7" class="loading"><div class="spinner"></div>Loading invoices...</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div><!-- end main-content -->
    </div>

    <!-- Invoice Preview Modal -->
    <div class="modal-overlay" id="previewModal">
        <div class="modal">
            <div class="modal-header"><h3>Invoice Preview & Download</h3><button class="modal-close" onclick="closePreviewModal()" aria-label="Close">×</button></div>
            <div class="modal-body" id="previewBody"></div>
            <div class="modal-footer" id="previewFooter">
                <button class="btn btn-secondary" onclick="closePreviewModal()">Close</button>
                <button class="btn btn-primary" onclick="downloadInvoicePDF()">Download PDF</button>
            </div>
        </div>
    </div>

    <script src="supabase-client.js"></script>
    <script src="sidebar.js"></script>
    <script src="feature-flags.js"></script>
    <script>
        let allDeliveries = [], allJobs = [], allInvoices = [];
        let selectedInvoiceData = null;

        // Mock invoice data
        const mockInvoices = [
            { id: '1', invoice_number: 'INV-001', job_id: 'j1', customer_name: 'ABC Corp', amount: 1250, date: new Date().toISOString(), status: 'generated' },
            { id: '2', invoice_number: 'INV-002', job_id: 'j2', customer_name: 'XYZ Industries', amount: 3400, date: new Date(Date.now() - 86400000).toISOString(), status: 'generated' },
            { id: '3', invoice_number: 'INV-003', job_id: 'j3', customer_name: 'Tech Solutions', amount: 2100, date: new Date(Date.now() - 2*86400000).toISOString(), status: 'pending' }
        ];

        document.addEventListener('DOMContentLoaded', async () => {
            const user = checkAuth(['rental']);
            if (user) {
                document.getElementById('userName').textContent = user.name;
                document.getElementById('userAvatar').textContent = user.name.charAt(0).toUpperCase();
            }
            FC_FLAGS.init('rental');
            FC_FLAGS.hideNav('invoice_pdf', 'invoice-pdf.html');
            await loadData();
        });

        async function loadData() {
            try {
                allDeliveries = await getDeliveriesForCurrentUser();
                allJobs = await getJobsForCurrentUser();
            } catch (err) {
                console.log('Load error:', err);
            }

            // Create invoices from deliveries
            allInvoices = mockInvoices.map(inv => {
                const job = allJobs.find(j => j.id === inv.job_id);
                const delivery = allDeliveries.find(d => d.job_id === inv.job_id);
                return {
                    ...inv,
                    job_site_name: job ? job.job_site_name : '',
                    gallons: delivery ? delivery.gallons : 0,
                    fuel_type: delivery ? delivery.fuel_type : 'Diesel'
                };
            });

            updateStats();
            renderInvoices();
        }

        function updateStats() {
            const now = new Date();
            const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);

            const thisMonth = allInvoices.filter(i => new Date(i.date) >= monthStart).length;
            const totalAmount = allInvoices.reduce((sum, i) => sum + (parseFloat(i.amount) || 0), 0);
            const pending = allInvoices.filter(i => i.status === 'pending').length;

            document.getElementById('statMonth').textContent = thisMonth;
            document.getElementById('statTotal').textContent = '$' + totalAmount.toLocaleString('en-US', { maximumFractionDigits: 0 });
            document.getElementById('statPending').textContent = pending;
        }

        function renderInvoices() {
            const search = document.getElementById('searchInput').value.toLowerCase();

            let filtered = allInvoices;
            if (search) {
                filtered = filtered.filter(i =>
                    (i.invoice_number || '').toLowerCase().includes(search) ||
                    (i.customer_name || '').toLowerCase().includes(search) ||
                    (i.job_site_name || '').toLowerCase().includes(search)
                );
            }

            const tbody = document.getElementById('invoiceTable');
            if (!filtered.length) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty-state">No invoices found</td></tr>';
                return;
            }

            tbody.innerHTML = filtered.map(inv => `
                <tr>
                    <td><span class="invoice-num">${safe(inv.invoice_number)}</span></td>
                    <td>${safe(inv.job_id)}</td>
                    <td>${formatDate(inv.date)}</td>
                    <td>${safe(inv.customer_name)}</td>
                    <td style="font-weight:600;color:#60a5fa;">$${parseFloat(inv.amount).toLocaleString('en-US', {minimumFractionDigits:2})}</td>
                    <td><span class="status-badge ${inv.status}"><span style="width:6px;height:6px;border-radius:50%;background:currentColor;"></span>${inv.status}</span></td>
                    <td>
                        <div class="actions-cell">
                            <button class="action-btn secondary" onclick="previewInvoice('${inv.id}')">Preview</button>
                            <button class="action-btn primary" onclick="generatePDF('${inv.id}')">Generate</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function previewInvoice(id) {
            const invoice = allInvoices.find(i => i.id === id);
            if (!invoice) return;

            selectedInvoiceData = invoice;
            const invoiceHTML = generateInvoiceHTML(invoice);

            document.getElementById('previewBody').innerHTML = `<div class="invoice-preview">${invoiceHTML}</div>`;
            document.getElementById('previewModal').classList.add('show');
        }

        function generateInvoiceHTML(invoice) {
            const invoiceDate = new Date(invoice.date).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            const dueDate = new Date(new Date(invoice.date).getTime() + 30 * 24 * 60 * 60 * 1000).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

            return `
                <div class="invoice-header">
                    <div class="invoice-title">INVOICE</div>
                    <div class="invoice-subtitle">FleetConnect Rental Services</div>
                </div>

                <div class="invoice-grid">
                    <div>
                        <div class="invoice-section-label">From</div>
                        <div class="invoice-text">
                            <strong>FleetConnect Inc.</strong><br>
                            123 Business Avenue<br>
                            Your City, ST 12345<br>
                            contact@fleetconnect.com
                        </div>
                    </div>
                    <div>
                        <div class="invoice-section-label">Invoice Details</div>
                        <div class="invoice-text">
                            <strong>Invoice #:</strong> ${safe(invoice.invoice_number)}<br>
                            <strong>Date:</strong> ${invoiceDate}<br>
                            <strong>Due Date:</strong> ${dueDate}<br>
                            <strong>Job #:</strong> ${safe(invoice.job_id)}
                        </div>
                    </div>
                </div>

                <div class="invoice-grid">
                    <div>
                        <div class="invoice-section-label">Bill To</div>
                        <div class="invoice-text">
                            <strong>${safe(invoice.customer_name)}</strong><br>
                            ${safe(invoice.job_site_name)}<br>
                            Contact for address details
                        </div>
                    </div>
                    <div>
                        <div class="invoice-section-label">Shipping Address</div>
                        <div class="invoice-text">
                            <strong>${safe(invoice.customer_name)}</strong><br>
                            ${safe(invoice.job_site_name)}<br>
                            Same as billing
                        </div>
                    </div>
                </div>

                <table class="invoice-table">
                    <thead>
                        <tr>
                            <th style="width:50%;">Description</th>
                            <th style="width:15%;text-align:right;">Qty</th>
                            <th style="width:15%;text-align:right;">Unit Price</th>
                            <th style="width:20%;text-align:right;">Amount</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Fuel Delivery - ${safe(invoice.fuel_type)}</td>
                            <td style="text-align:right;">${invoice.gallons} gal</td>
                            <td style="text-align:right;">$${(parseFloat(invoice.amount) / invoice.gallons).toFixed(2)}</td>
                            <td style="text-align:right;">$${parseFloat(invoice.amount).toFixed(2)}</td>
                        </tr>
                    </tbody>
                </table>

                <div class="invoice-totals">
                    <div class="invoice-totals-box">
                        <div class="invoice-total-row">
                            <span>Subtotal:</span>
                            <span style="text-align:right;">$${parseFloat(invoice.amount).toFixed(2)}</span>
                        </div>
                        <div class="invoice-total-row">
                            <span>Tax (0%):</span>
                            <span style="text-align:right;">$0.00</span>
                        </div>
                        <div class="invoice-total-row bold">
                            <span>Total:</span>
                            <span style="text-align:right;">$${parseFloat(invoice.amount).toFixed(2)}</span>
                        </div>
                    </div>
                </div>

                <div style="margin-top:30px;padding-top:20px;border-top:1px solid #ddd;font-size:12px;color:#666;">
                    <strong>Payment Terms:</strong> Net 30<br>
                    <strong>Thank you for your business!</strong> If you have any questions, please contact us at contact@fleetconnect.com or call (555) 123-4567.
                </div>
            `;
        }

        function generatePDF(id) {
            const invoice = allInvoices.find(i => i.id === id);
            if (!invoice) return;

            const element = document.createElement('div');
            element.innerHTML = generateInvoiceHTML(invoice);
            element.style.padding = '40px';
            element.style.backgroundColor = '#fff';
            element.style.color = '#000';

            const opt = {
                margin: 10,
                filename: 'invoice-' + invoice.invoice_number + '.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { orientation: 'portrait', unit: 'mm', format: 'a4' }
            };

            html2pdf().set(opt).from(element).save();
        }

        function downloadInvoicePDF() {
            if (selectedInvoiceData) {
                generatePDF(selectedInvoiceData.id);
                closePreviewModal();
            }
        }

        function closePreviewModal() {
            document.getElementById('previewModal').classList.remove('show');
            selectedInvoiceData = null;
        }

        function toggleMobileSidebar() {
            document.querySelector('.sidebar').classList.toggle('open');
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closePreviewModal();
        });
    </script>
    <script>
    // Theme toggle
    (function(){
      var btn = document.querySelector('.theme-toggle');
      if(!btn) return;
      function updateIcon(){
        btn.textContent = document.documentElement.classList.contains('light-mode') ? '☀️' : '🌙';
      }
      updateIcon();
      btn.addEventListener('click', function(){
        document.documentElement.classList.toggle('light-mode');
        localStorage.setItem('fleetconnect-theme',
          document.documentElement.classList.contains('light-mode') ? 'light' : 'dark');
        updateIcon();
      });
    })();
    </script>
<script src="hamburger-menu.js"></script>
<script src="global-search.js"></script>
<script src="notification-center.js"></script>
    <script src="realtime.js"></script>
</body>
</html>
