<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job History | FleetConnect</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-dark: #0a0a0f; --bg-card: #12121a; --bg-input: #1a1a24; --border: #2a2a3a; --text-primary: #ffffff; --text-secondary: #8a8a9a; --text-muted: #5a5a6a; --accent: #00d4aa; --accent-blue: #00a8ff; --warning: #ffaa00; --error: #ff6b6b; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        .logo { font-family: 'Space Mono', monospace; font-size: 1.5rem; color: var(--accent); text-decoration: none; }
        .nav-right { display: flex; align-items: center; gap: 24px; }
        .nav-links { display: flex; gap: 24px; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent); }
        .logout-btn { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .header { margin-bottom: 32px; }
        .header h1 { font-size: 2rem; font-weight: 700; margin-bottom: 8px; }
        .header p { color: var(--text-secondary); }
        
        .search-section { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 24px; }
        .search-row { display: flex; gap: 16px; flex-wrap: wrap; }
        .search-input { flex: 1; min-width: 280px; padding: 12px 14px; font-family: 'DM Sans', sans-serif; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); }
        .search-input:focus { outline: none; border-color: var(--accent); }
        .filter-select { padding: 12px 14px; font-family: 'DM Sans', sans-serif; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); }
        
        .jobs-list { display: flex; flex-direction: column; gap: 16px; }
        .job-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; cursor: pointer; transition: border-color 0.2s; }
        .job-card:hover { border-color: var(--accent); }
        .job-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
        .job-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 4px; }
        .job-meta { font-size: 0.85rem; color: var(--text-secondary); }
        .job-meta span { font-family: 'Space Mono', monospace; color: var(--accent); }
        .status-badge { padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
        .status-badge.pending { background: rgba(255, 170, 0, 0.15); color: var(--warning); }
        .status-badge.assigned, .status-badge.accepted { background: rgba(0, 168, 255, 0.15); color: var(--accent-blue); }
        .status-badge.in-progress { background: rgba(0, 212, 170, 0.15); color: var(--accent); }
        .status-badge.completed { background: rgba(100, 100, 100, 0.15); color: var(--text-secondary); }
        .job-details-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 16px; background: var(--bg-input); border-radius: 8px; }
        @media (max-width: 800px) { .job-details-grid { grid-template-columns: repeat(2, 1fr); } }
        .job-detail-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
        .job-detail-value { font-size: 0.9rem; }
        .job-actions { display: flex; gap: 10px; margin-top: 16px; }
        .btn { padding: 10px 16px; font-family: 'DM Sans', sans-serif; font-size: 0.85rem; font-weight: 500; border-radius: 8px; cursor: pointer; border: none; }
        .btn-primary { background: var(--accent); color: var(--bg-dark); }
        .btn-invoice { background: rgba(0, 168, 255, 0.15); color: var(--accent-blue); border: 1px solid var(--accent-blue); }
        
        .empty-state { text-align: center; padding: 60px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; }
        .loading { text-align: center; padding: 60px; color: var(--text-secondary); }
        
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; overflow-y: auto; padding: 20px; }
        .modal.show { display: flex; justify-content: center; align-items: flex-start; }
        .modal-content { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; max-width: 800px; width: 100%; margin: 40px 0; }
        .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .modal-header h2 { font-size: 1.25rem; }
        .modal-close { background: none; border: none; color: var(--text-secondary); font-size: 1.5rem; cursor: pointer; }
        .modal-body { padding: 24px; }
        
        .detail-section { margin-bottom: 24px; }
        .detail-section-title { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); margin-bottom: 12px; }
        .detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        @media (max-width: 600px) { .detail-grid { grid-template-columns: 1fr; } }
        .detail-item { padding: 12px; background: var(--bg-input); border-radius: 8px; }
        .detail-item-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
        .detail-item-value { font-size: 0.95rem; font-family: 'Space Mono', monospace; }
        
        .invoice-image-section { margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border); }
        .invoice-image-btn { display: flex; align-items: center; gap: 10px; padding: 16px; background: rgba(0, 168, 255, 0.1); border: 1px solid var(--accent-blue); border-radius: 10px; cursor: pointer; width: 100%; text-align: left; }
        .invoice-image-btn:hover { background: rgba(0, 168, 255, 0.2); }
        .invoice-image-btn span { font-size: 1.5rem; }
        .invoice-image-btn div { flex: 1; }
        .invoice-image-btn .label { font-weight: 600; color: var(--accent-blue); }
        .invoice-image-btn .sublabel { font-size: 0.85rem; color: var(--text-secondary); }
        
        .image-viewer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
        .image-viewer.show { display: flex; }
        .image-viewer img { max-width: 100%; max-height: 90vh; border-radius: 8px; }
        .image-viewer-close { position: absolute; top: 20px; right: 20px; background: var(--bg-card); border: none; color: white; width: 40px; height: 40px; border-radius: 50%; font-size: 1.5rem; cursor: pointer; }
        
        .equipment-list { display: flex; flex-direction: column; gap: 8px; }
        .equipment-item { display: flex; justify-content: space-between; padding: 10px 12px; background: var(--bg-input); border-radius: 6px; }
        .equipment-number { font-family: 'Space Mono', monospace; color: var(--accent); font-weight: 600; }
        .equipment-desc { color: var(--text-secondary); font-size: 0.85rem; }
        .no-invoice { padding: 16px; background: var(--bg-input); border-radius: 10px; text-align: center; color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="container">
        <nav class="nav">
            <a href="index.html" class="logo">FLEETCONNECT</a>
            <div class="nav-right">
                <div class="nav-links">
                    <a href="index.html">Home</a>
                    <a href="create-job.html">New Order</a>
                    <a href="job-history.html" class="active">Job History</a>
                </div>
                <span id="userName" style="color: var(--text-secondary); font-size: 0.9rem;"></span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </nav>
        
        <header class="header">
            <h1>Job History</h1>
            <p>Search and view all work orders</p>
        </header>
        
        <div class="search-section">
            <div class="search-row">
                <input type="text" class="search-input" id="searchInput" placeholder="Search by contract #, job site, customer...">
                <select class="filter-select" id="statusFilter">
                    <option value="">All Status</option>
                    <option value="pending">Pending</option>
                    <option value="assigned">Assigned</option>
                    <option value="accepted">Accepted</option>
                    <option value="in-progress">In Progress</option>
                    <option value="completed">Completed</option>
                </select>
            </div>
        </div>
        
        <div class="jobs-list" id="jobsList">
            <div class="loading">Loading jobs...</div>
        </div>
    </div>
    
    <!-- Job Details Modal -->
    <div class="modal" id="jobModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Job Details</h2>
                <button class="modal-close" onclick="closeJobModal()">×</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>
    
    <!-- Image Viewer -->
    <div class="image-viewer" id="imageViewer" onclick="closeImageViewer()">
        <button class="image-viewer-close" onclick="closeImageViewer()">×</button>
        <img id="invoiceImage" src="" alt="Original Invoice">
    </div>

    <script src="supabase-client.js"></script>
    <script>
        const currentUser = checkAuth();
        if (currentUser) document.getElementById('userName').textContent = currentUser.name;

        let allJobs = [];
        let allEquipment = [];

        async function loadJobs() {
            allJobs = await getAllJobs();
            const { data } = await db.from('equipment').select('*');
            allEquipment = data || [];
            renderJobs();
        }
        
        function getEquipmentForJob(jobId) {
            return allEquipment.filter(e => e.job_id === jobId);
        }

        function renderJobs() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;

            let filtered = allJobs;

            if (searchTerm) {
                filtered = filtered.filter(j => 
                    (j.job_site_name || '').toLowerCase().includes(searchTerm) ||
                    (j.contract_number || '').toLowerCase().includes(searchTerm) ||
                    (j.po_number || '').toLowerCase().includes(searchTerm) ||
                    (j.customer_name || '').toLowerCase().includes(searchTerm) ||
                    (j.address_city || '').toLowerCase().includes(searchTerm)
                );
            }

            if (statusFilter) {
                filtered = filtered.filter(j => j.status === statusFilter);
            }

            const container = document.getElementById('jobsList');

            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state"><h3>No jobs found</h3><p>Try adjusting your search or filters</p></div>`;
                return;
            }

            container.innerHTML = filtered.map(job => {
                const equipment = getEquipmentForJob(job.id);
                return `
                    <div class="job-card" onclick="openJobModal('${job.id}')">
                        <div class="job-header">
                            <div>
                                <div class="job-title">${job.job_site_name || 'Untitled Job'}</div>
                                <div class="job-meta">Contract: <span>${job.contract_number || '-'}</span> • PO: <span>${job.po_number || '-'}</span></div>
                            </div>
                            <span class="status-badge ${job.status}">${job.status}</span>
                        </div>
                        <div class="job-details-grid">
                            <div><div class="job-detail-label">Location</div><div class="job-detail-value">${job.address_city || '-'}, ${job.address_state || '-'}</div></div>
                            <div><div class="job-detail-label">Date</div><div class="job-detail-value">${formatDate(job.date_out)}</div></div>
                            <div><div class="job-detail-label">Contact</div><div class="job-detail-value">${job.contact_name || '-'}</div></div>
                            <div><div class="job-detail-label">Equipment</div><div class="job-detail-value">${equipment.length} unit${equipment.length !== 1 ? 's' : ''}</div></div>
                        </div>
                        <div class="job-actions" onclick="event.stopPropagation()">
                            <button class="btn btn-primary" onclick="openJobModal('${job.id}')">View Details</button>
                            ${job.invoice_image ? `<button class="btn btn-invoice" onclick="viewInvoiceImage('${job.invoice_image}')">📄 View Original Invoice</button>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function openJobModal(jobId) {
            const job = allJobs.find(j => j.id === jobId);
            if (!job) return;
            
            const equipment = getEquipmentForJob(jobId);
            
            document.getElementById('modalTitle').textContent = job.job_site_name || 'Job Details';
            document.getElementById('modalBody').innerHTML = `
                <div class="detail-section">
                    <div class="detail-section-title">Order Information</div>
                    <div class="detail-grid">
                        <div class="detail-item"><div class="detail-item-label">Contract #</div><div class="detail-item-value">${job.contract_number || '-'}</div></div>
                        <div class="detail-item"><div class="detail-item-label">P.O. #</div><div class="detail-item-value">${job.po_number || '-'}</div></div>
                        <div class="detail-item"><div class="detail-item-label">Job Type</div><div class="detail-item-value">${formatJobType(job.job_type)}</div></div>
                        <div class="detail-item"><div class="detail-item-label">Status</div><div class="detail-item-value"><span class="status-badge ${job.status}">${job.status}</span></div></div>
                    </div>
                </div>
                
                <div class="detail-section">
                    <div class="detail-section-title">Job Site Location</div>
                    <div class="detail-grid">
                        <div class="detail-item" style="grid-column:span 2;"><div class="detail-item-label">Address</div><div class="detail-item-value">${job.address_street || ''} ${job.address_city || ''}, ${job.address_state || ''} ${job.address_zip || ''}</div></div>
                    </div>
                </div>
                
                <div class="detail-section">
                    <div class="detail-section-title">Contact</div>
                    <div class="detail-grid">
                        <div class="detail-item"><div class="detail-item-label">Name</div><div class="detail-item-value">${job.contact_name || '-'}</div></div>
                        <div class="detail-item"><div class="detail-item-label">Phone</div><div class="detail-item-value">${job.contact_phone ? `<a href="tel:${job.contact_phone}" style="color:var(--accent)">${job.contact_phone}</a>` : '-'}</div></div>
                    </div>
                </div>
                
                <div class="detail-section">
                    <div class="detail-section-title">Schedule</div>
                    <div class="detail-grid">
                        <div class="detail-item"><div class="detail-item-label">Date Out</div><div class="detail-item-value">${formatDate(job.date_out)}</div></div>
                        <div class="detail-item"><div class="detail-item-label">Time</div><div class="detail-item-value">${job.time_out || '-'}</div></div>
                        <div class="detail-item"><div class="detail-item-label">Priority</div><div class="detail-item-value">${job.priority || 'normal'}</div></div>
                        <div class="detail-item"><div class="detail-item-label">Created</div><div class="detail-item-value">${formatDate(job.created_at)}</div></div>
                    </div>
                </div>
                
                <div class="detail-section">
                    <div class="detail-section-title">Equipment (${equipment.length} units)</div>
                    ${equipment.length > 0 ? `
                        <div class="equipment-list">
                            ${equipment.map(eq => `<div class="equipment-item"><span class="equipment-number">${eq.equipment_number || 'No #'}</span><span class="equipment-desc">${eq.description || '-'}</span></div>`).join('')}
                        </div>
                    ` : '<div class="no-invoice">No equipment listed</div>'}
                </div>
                
                ${job.instructions ? `<div class="detail-section"><div class="detail-section-title">Special Instructions</div><div class="detail-item" style="width:100%;"><div class="detail-item-value" style="font-family:'DM Sans',sans-serif;">${job.instructions}</div></div></div>` : ''}
                
                <div class="invoice-image-section">
                    ${job.invoice_image ? `
                        <button class="invoice-image-btn" onclick="viewInvoiceImage('${job.invoice_image}')">
                            <span>📄</span>
                            <div><div class="label">View Original Invoice</div><div class="sublabel">See the scanned invoice used to create this job</div></div>
                            <span style="color:var(--accent-blue)">→</span>
                        </button>
                    ` : `<div class="no-invoice"><p>No original invoice image</p><p style="font-size:0.85rem;margin-top:4px;">This job was created manually</p></div>`}
                </div>
            `;
            
            document.getElementById('jobModal').classList.add('show');
            document.body.style.overflow = 'hidden';
        }
        
        function closeJobModal() {
            document.getElementById('jobModal').classList.remove('show');
            document.body.style.overflow = '';
        }
        
        function viewInvoiceImage(imageUrl) {
            document.getElementById('invoiceImage').src = imageUrl;
            document.getElementById('imageViewer').classList.add('show');
        }
        
        function closeImageViewer() {
            document.getElementById('imageViewer').classList.remove('show');
        }
        
        document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeImageViewer(); closeJobModal(); }});
        document.getElementById('searchInput').addEventListener('input', renderJobs);
        document.getElementById('statusFilter').addEventListener('change', renderJobs);

        loadJobs();
    </script>
</body>
</html>
