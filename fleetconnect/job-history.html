<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job History | FleetConnect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-dark: #0a0a0f; --bg-card: #12121a; --bg-input: #1a1a24; --bg-hover: #1e1e2a; --border: #2a2a3a; --text-primary: #ffffff; --text-secondary: #8a8a9a; --text-muted: #5a5a6a; --accent: #00d4aa; --accent-glow: rgba(0, 212, 170, 0.3); --accent-blue: #00a8ff; --warning: #ffaa00; --error: #ff6b6b; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; line-height: 1.6; }
        body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(0, 212, 170, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 170, 0.03) 1px, transparent 1px); background-size: 50px 50px; pointer-events: none; z-index: 0; }
        .container { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        .logo { font-family: 'Space Mono', monospace; font-size: 1.5rem; color: var(--accent); letter-spacing: -1px; text-decoration: none; }
        .nav-right { display: flex; align-items: center; gap: 24px; }
        .nav-links { display: flex; gap: 24px; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent); }
        .logout-btn { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-family: 'DM Sans', sans-serif; }
        .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 32px; }
        .header h1 { font-size: 2rem; font-weight: 700; margin-bottom: 8px; }
        .header p { color: var(--text-secondary); }
        .search-section { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 24px; }
        .search-row { display: flex; gap: 16px; flex-wrap: wrap; }
        .search-input { flex: 1; min-width: 280px; padding: 12px 14px; font-family: 'DM Sans', sans-serif; font-size: 0.95rem; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); }
        .search-input:focus { outline: none; border-color: var(--accent); }
        .filter-select { padding: 12px 14px; font-family: 'DM Sans', sans-serif; font-size: 0.95rem; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); cursor: pointer; }
        .jobs-list { display: flex; flex-direction: column; gap: 16px; }
        .job-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; transition: border-color 0.2s; }
        .job-card:hover { border-color: var(--accent); }
        .job-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
        .job-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 4px; }
        .job-meta { font-size: 0.85rem; color: var(--text-secondary); }
        .job-meta span { font-family: 'Space Mono', monospace; color: var(--accent); }
        .status-badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
        .status-badge.pending { background: rgba(255, 170, 0, 0.15); color: var(--warning); }
        .status-badge.assigned, .status-badge.accepted { background: rgba(0, 168, 255, 0.15); color: var(--accent-blue); }
        .status-badge.in-progress { background: rgba(0, 212, 170, 0.15); color: var(--accent); }
        .status-badge.completed { background: rgba(100, 100, 100, 0.15); color: var(--text-secondary); }
        .job-details { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 16px; background: var(--bg-input); border-radius: 8px; }
        @media (max-width: 800px) { .job-details { grid-template-columns: repeat(2, 1fr); } }
        .job-detail-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
        .job-detail-value { font-size: 0.9rem; }
        .loading { text-align: center; padding: 60px; color: var(--text-secondary); }
        .empty-state { text-align: center; padding: 60px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; }
        .empty-state h3 { margin-bottom: 8px; }
        .empty-state p { color: var(--text-secondary); }
    </style>
</head>
<body>
    <div class="container">
        <nav class="nav">
            <a href="index.html" class="logo">FLEETCONNECT</a>
            <div class="nav-right">
                <div class="nav-links">
                    <a href="index.html">Home</a>
                    <a href="create-job.html">New Order</a>
                    <a href="job-history.html" class="active">Job History</a>
                </div>
                <span id="userName" style="color: var(--text-secondary); font-size: 0.9rem;"></span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </nav>
        
        <header class="header">
            <div>
                <h1>Job History</h1>
                <p>Search and view all work orders</p>
            </div>
        </header>
        
        <div class="search-section">
            <div class="search-row">
                <input type="text" class="search-input" id="searchInput" placeholder="Search by contract #, job site, customer...">
                <select class="filter-select" id="statusFilter">
                    <option value="">All Status</option>
                    <option value="pending">Pending</option>
                    <option value="assigned">Assigned</option>
                    <option value="in-progress">In Progress</option>
                    <option value="completed">Completed</option>
                </select>
            </div>
        </div>
        
        <div class="jobs-list" id="jobsList">
            <div class="loading">Loading jobs...</div>
        </div>
    </div>

    <script src="supabase-client.js"></script>
    <script>
        const currentUser = checkAuth();
        if (currentUser) {
            document.getElementById('userName').textContent = currentUser.name;
        }

        let allJobs = [];

        async function loadJobs() {
            allJobs = await getAllJobs();
            renderJobs();
        }

        function renderJobs() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;

            let filtered = allJobs;

            if (searchTerm) {
                filtered = filtered.filter(j => 
                    (j.job_site_name || '').toLowerCase().includes(searchTerm) ||
                    (j.contract_number || '').toLowerCase().includes(searchTerm) ||
                    (j.customer_name || '').toLowerCase().includes(searchTerm)
                );
            }

            if (statusFilter) {
                filtered = filtered.filter(j => j.status === statusFilter);
            }

            const container = document.getElementById('jobsList');

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No jobs found</h3>
                        <p>Try adjusting your search or filters</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(job => `
                <div class="job-card">
                    <div class="job-header">
                        <div>
                            <div class="job-title">${job.job_site_name || 'Untitled Job'}</div>
                            <div class="job-meta">Contract: <span>${job.contract_number || '-'}</span> • ${formatJobType(job.job_type)}</div>
                        </div>
                        <span class="status-badge ${job.status}">${job.status}</span>
                    </div>
                    <div class="job-details">
                        <div>
                            <div class="job-detail-label">Location</div>
                            <div class="job-detail-value">${job.address_city || '-'}, ${job.address_state || '-'}</div>
                        </div>
                        <div>
                            <div class="job-detail-label">Date</div>
                            <div class="job-detail-value">${formatDate(job.date_out)}</div>
                        </div>
                        <div>
                            <div class="job-detail-label">Contact</div>
                            <div class="job-detail-value">${job.contact_name || '-'}</div>
                        </div>
                        <div>
                            <div class="job-detail-label">Created</div>
                            <div class="job-detail-value">${formatDate(job.created_at)}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('searchInput').addEventListener('input', renderJobs);
        document.getElementById('statusFilter').addEventListener('change', renderJobs);

        loadJobs();
    </script>
</body>
</html>
