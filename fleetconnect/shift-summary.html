<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shift Summary | FleetConnect</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        
        

        /* Mobile-first container */
        .container { max-width: 700px; margin: 0 auto; padding: 20px; }

        /* Header */
        .header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--gray-300); }
        .header h1 { font-size: 1.6rem; font-weight: 700; }
        .header-back { background: none; border: none; color: #60a5fa; font-size: 1.4rem; cursor: pointer; padding: 8px; }
        .header-back:hover { color: #3b82f6; }

        /* Date selector */
        .date-selector { display: flex; align-items: center; gap: 8px; padding: 10px; background: var(--bg-card); border: 1px solid var(--gray-300); border-radius: 8px; margin-bottom: 20px; }
        .date-selector input { flex: 1; background: var(--bg-hover); border: none; color: var(--text-primary); padding: 8px; border-radius: 6px;  font-size: 0.9rem; }
        .date-selector input:focus { outline: none; }

        /* Stats grid - 2x2 */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .stat-card { background: var(--bg-card); border: 1px solid var(--gray-300); border-radius: 12px; padding: 16px; text-align: center; }
        .stat-card.primary { border-color: #60a5fa; }
        .stat-icon { font-size: 2rem; margin-bottom: 8px; }
        .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; font-weight: 600; }
        .stat-value { font-size: 1.8rem; font-weight: 700; color: #60a5fa; }
        .stat-subtext { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }

        /* Card sections */
        .card { background: var(--bg-card); border: 1px solid var(--gray-300); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .card-title { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; color: #60a5fa; margin-bottom: 12px; letter-spacing: 0.5px; }

        /* Job list */
        .job-list { display: flex; flex-direction: column; gap: 10px; }
        .job-entry { background: var(--bg-hover); padding: 12px; border-radius: 8px; border-left: 3px solid #60a5fa; }
        .job-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px; }
        .job-number { font-weight: 600; color: #60a5fa; }
        .job-status { font-size: 0.85rem; }
        .job-status.completed { color: #22c55e; }
        .job-status.issue { color: #fbbf24; }
        .job-time { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; }
        .job-details { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
        .job-gallons { color: #60a5fa; font-weight: 600; }
        .job-location { color: var(--text-muted); }

        /* Fuel breakdown */
        .breakdown-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--gray-300); }
        .breakdown-row:last-child { border-bottom: none; }
        .breakdown-label { color: var(--text-muted); }
        .breakdown-value { font-weight: 600; color: #60a5fa; }

        /* Timeline visualization */
        .timeline-container { background: var(--bg-hover); padding: 12px; border-radius: 8px; margin-bottom: 16px; }
        .timeline-header { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-muted); margin-bottom: 8px; }
        .timeline-bar { display: flex; height: 30px; border-radius: 4px; gap: 2px; background: var(--gray-300); padding: 2px; overflow: hidden; }
        .timeline-block { flex: 1; border-radius: 2px; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; color: var(--bg-body); font-weight: 600; }
        .timeline-block.job { background: #22c55e; }
        .timeline-block.travel { background: #3b82f6; }
        .timeline-block.gap { background: var(--text-muted); opacity: 0.5; }
        .timeline-legend { display: flex; gap: 12px; margin-top: 8px; font-size: 0.75rem; }
        .legend-item { display: flex; align-items: center; gap: 4px; }
        .legend-color { width: 12px; height: 12px; border-radius: 2px; }

        /* Action buttons */
        .button-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 20px; }
        
        
        
        
        

        /* Loading state */
        
        .spinner { width: 24px; height: 24px; border: 3px solid var(--gray-300); border-top-color: #60a5fa; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Empty state */
        .empty { text-align: center; padding: 40px 20px; color: var(--text-muted); }

        /* Modal for comparison */
        
        
        
        
        

        /* Print styles */
        @media print {
            body { background: #fff; }
            .header-back, .button-group, .date-selector { display: none; }
            .container { max-width: 100%; }
            
        }

        /* Mobile */
        @media (max-width: 768px) {
            .container { padding: 16px; }
            .header h1 { font-size: 1.4rem; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .button-group { grid-template-columns: 1fr; }
        }
    
        /* Light Mode */
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        .light-mode
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        

</style>
    <link rel="stylesheet" href="theme.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="header-back" onclick="window.history.back()" title="Go back">←</button>
            <h1>📋 Shift Summary</h1>
        </div>

        <div class="date-selector">
            <input type="date" id="dateInput" onchange="loadShiftData()">
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card primary">
                <div class="stat-icon">🚛</div>
                <div class="stat-label">Jobs Completed</div>
                <div class="stat-value" id="jobsCount">0</div>
            </div>
            <div class="stat-card primary">
                <div class="stat-icon">⛽</div>
                <div class="stat-label">Total Gallons</div>
                <div class="stat-value" id="gallonsTotal">0</div>
            </div>
            <div class="stat-card primary">
                <div class="stat-icon">🕐</div>
                <div class="stat-label">Hours Worked</div>
                <div class="stat-value" id="hoursWorked">0</div>
                <div class="stat-subtext">hrs</div>
            </div>
            <div class="stat-card primary">
                <div class="stat-icon">📍</div>
                <div class="stat-label">Miles Driven</div>
                <div class="stat-value" id="milesDriven">0</div>
                <div class="stat-subtext">est.</div>
            </div>
        </div>

        <!-- Timeline -->
        <div class="card" id="timelineCard" style="display: none;">
            <div class="card-title">Daily Timeline</div>
            <div class="timeline-container">
                <div class="timeline-header">
                    <span>6 AM</span>
                    <span>12 PM</span>
                    <span>6 PM</span>
                </div>
                <div class="timeline-bar" id="timelineBar"></div>
            </div>
            <div class="timeline-legend">
                <div class="legend-item">
                    <div class="legend-color" style="background: #22c55e;"></div>
                    <span>Job</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #3b82f6;"></div>
                    <span>Travel</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: var(--text-muted);"></div>
                    <span>Gap</span>
                </div>
            </div>
        </div>

        <!-- Job Breakdown -->
        <div class="card" id="jobsCard" style="display: none;">
            <div class="card-title">Jobs by Delivery</div>
            <div class="job-list" id="jobList"></div>
        </div>

        <!-- Fuel Breakdown -->
        <div class="card" id="fuelCard" style="display: none;">
            <div class="card-title">Fuel Breakdown</div>
            <div class="breakdown-row">
                <span class="breakdown-label">Diesel</span>
                <span class="breakdown-value" id="dieselTotal">0 gal</span>
            </div>
            <div class="breakdown-row">
                <span class="breakdown-label">DEF</span>
                <span class="breakdown-value" id="defTotal">0 gal</span>
            </div>
            <div class="breakdown-row">
                <span class="breakdown-label">Gasoline</span>
                <span class="breakdown-value" id="gasolineTotal">0 gal</span>
            </div>
            <div class="breakdown-row" style="border-bottom: 2px solid #60a5fa; padding-top: 10px; margin-top: 10px;">
                <span class="breakdown-label" style="color: var(--text-primary); font-weight: 600;">Total</span>
                <span class="breakdown-value" id="totalGallons">0 gal</span>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="button-group">
            <button class="btn btn-secondary" onclick="emailSupervisor()">📧 Email</button>
            <button class="btn btn-secondary" onclick="exportPDF()">📄 PDF</button>
            <button class="btn btn-secondary" onclick="compareYesterday()">📊 Compare</button>
        </div>
    </div>

    <!-- Comparison Modal -->
    <div class="modal" id="comparisonModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Shift Comparison</h2>
                <button class="modal-close" onclick="closeComparison()" aria-label="Close">×</button>
            </div>
            <div id="comparisonContent"></div>
        </div>
    </div>

    <script src="supabase-client.js"></script>
    <script src="realtime.js"></script>
    <script src="feature-flags.js"></script>
    <script>
        // Initialize
        (async () => {
            const user = checkAuth(['fieldworker']);
            if (!user) return;

            await FC_FLAGS.init('fieldworker');
            setTodayDate();
            loadShiftData();
        })();

        function setTodayDate() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('dateInput').value = today;
        }

        async function loadShiftData() {
            const user = getCurrentUser();
            if (!user) return;

            const dateStr = document.getElementById('dateInput').value;
            const date = new Date(dateStr + 'T00:00:00');
            const nextDate = new Date(date);
            nextDate.setDate(nextDate.getDate() + 1);

            try {
                // Get deliveries for this user on this date
                const { data: deliveries } = await db
                    .from('deliveries')
                    .select('*')
                    .eq('delivered_by', user.id)
                    .gte('timestamp', date.toISOString())
                    .lt('timestamp', nextDate.toISOString())
                    .order('timestamp', { ascending: true });

                renderShiftData(deliveries || []);
            } catch (err) {
                console.error('Error loading shift data:', err);
                renderShiftData([]);
            }
        }

        function renderShiftData(deliveries) {
            if (deliveries.length === 0) {
                var _jobs = document.getElementById('jobsCard'); if(_jobs) _jobs.style.display = 'none';
                var _fuel = document.getElementById('fuelCard'); if(_fuel) _fuel.style.display = 'none';
                var _time = document.getElementById('timelineCard'); if(_time) _time.style.display = 'none';
                var _jobs = document.getElementById('jobsCount'); if(_jobs) _jobs.textContent = '0';
                var _gall = document.getElementById('gallonsTotal'); if(_gall) _gall.textContent = '0';
                var _hour = document.getElementById('hoursWorked'); if(_hour) _hour.textContent = '0';
                var _mile = document.getElementById('milesDriven'); if(_mile) _mile.textContent = '0';
                return;
            }

            // Calculate stats
            const jobsCount = deliveries.length;
            const totalGallons = deliveries.reduce((sum, d) => sum + (d.gallons || 0), 0);
            const defGallons = deliveries.reduce((sum, d) => sum + (d.def_gallons || 0), 0);
            const dieselGallons = deliveries.reduce((sum, d) => d.fuel_type === 'diesel' ? sum + (d.gallons || 0) : sum, 0);
            const gasolineGallons = deliveries.reduce((sum, d) => d.fuel_type === 'gasoline' ? sum + (d.gallons || 0) : sum, 0);

            // Estimate hours from timestamps
            const firstTime = new Date(deliveries[0].timestamp);
            const lastTime = new Date(deliveries[deliveries.length - 1].timestamp);
            const hoursWorked = ((lastTime - firstTime) / (1000 * 60 * 60)).toFixed(1);

            // Estimate miles (rough: 1 mile per 5 min + 10 miles per stop)
            const estimatedMiles = Math.round((deliveries.length * 10) + (hoursWorked * 12));

            // Update stats
            var _jobs = document.getElementById('jobsCount'); if(_jobs) _jobs.textContent = jobsCount;
            var _gall = document.getElementById('gallonsTotal'); if(_gall) _gall.textContent = totalGallons.toFixed(0);
            var _hour = document.getElementById('hoursWorked'); if(_hour) _hour.textContent = hoursWorked;
            var _mile = document.getElementById('milesDriven'); if(_mile) _mile.textContent = estimatedMiles;

            // Fuel breakdown
            var _dies = document.getElementById('dieselTotal'); if(_dies) _dies.textContent = dieselGallons.toFixed(0) + ' gal';
            var _defT = document.getElementById('defTotal'); if(_defT) _defT.textContent = defGallons.toFixed(0) + ' gal';
            var _gaso = document.getElementById('gasolineTotal'); if(_gaso) _gaso.textContent = gasolineGallons.toFixed(0) + ' gal';
            var _tota = document.getElementById('totalGallons'); if(_tota) _tota.textContent = totalGallons.toFixed(0) + ' gal';

            // Job list
            var _jobs = document.getElementById('jobsCard'); if(_jobs) _jobs.style.display = 'block';
            const jobList = document.getElementById('jobList');
            jobList.innerHTML = deliveries.map((d, idx) => {
                const time = new Date(d.timestamp).toLocaleTimeString();
                const status = d.has_incident ? '⚠️ Issue' : '✅ Completed';
                return `
                    <div class="job-entry">
                        <div class="job-header">
                            <span class="job-number">#${idx + 1}</span>
                            <span class="job-status ${d.has_incident ? 'issue' : 'completed'}">${status}</span>
                        </div>
                        <div class="job-time">${time}</div>
                        <div class="job-details">
                            <div class="job-gallons">${(d.gallons || 0).toFixed(0)} gal (${d.fuel_type || 'N/A'})</div>
                            <div class="job-location">${d.unit_number || 'Location'}</div>
                        </div>
                    </div>
                `;
            }).join('');

            // Timeline
            renderTimeline(deliveries);
            var _fuel = document.getElementById('fuelCard'); if(_fuel) _fuel.style.display = 'block';
            var _time = document.getElementById('timelineCard'); if(_time) _time.style.display = 'block';
        }

        function renderTimeline(deliveries) {
            const timelineBar = document.getElementById('timelineBar');
            timelineBar.innerHTML = '';

            if (deliveries.length === 0) return;

            const startOfDay = new Date();
            startOfDay.setHours(6, 0, 0, 0);
            const endOfDay = new Date();
            endOfDay.setHours(18, 0, 0, 0);
            const daySpan = endOfDay - startOfDay;

            const blocks = [];
            deliveries.forEach((d, idx) => {
                const time = new Date(d.timestamp);
                const offset = time - startOfDay;
                const percent = (offset / daySpan) * 100;
                const block = document.createElement('div');
                block.className = 'timeline-block job';
                block.style.left = percent + '%';
                block.title = '#' + (idx + 1);
                blocks.push(block);
                timelineBar.appendChild(block);
            });
        }

        function emailSupervisor() {
            const dateStr = document.getElementById('dateInput').value;
            const jobsCount = document.getElementById('jobsCount').textContent;
            const gallonsTotal = document.getElementById('gallonsTotal').textContent;
            const hoursWorked = document.getElementById('hoursWorked').textContent;
            const milesDriven = document.getElementById('milesDriven').textContent;

            const body = `Shift Summary for ${dateStr}:
- Jobs Completed: ${jobsCount}
- Total Gallons Delivered: ${gallonsTotal}
- Hours Worked: ${hoursWorked}
- Miles Driven (Est.): ${milesDriven}

Please review this summary.`;

            window.location.href = `mailto:supervisor@company.com?subject=Shift Summary ${dateStr}&body=${encodeURIComponent(body)}`;
        }

        function exportPDF() {
            const dateStr = document.getElementById('dateInput').value;
            window.print();
        }

        async function compareYesterday() {
            const dateStr = document.getElementById('dateInput').value;
            const currentDate = new Date(dateStr + 'T00:00:00');
            const yesterday = new Date(currentDate);
            yesterday.setDate(yesterday.getDate() - 1);

            const user = getCurrentUser();
            if (!user) return;

            try {
                const { data: yesterdayData } = await db
                    .from('deliveries')
                    .select('*')
                    .eq('delivered_by', user.id)
                    .gte('timestamp', yesterday.toISOString())
                    .lt('timestamp', currentDate.toISOString());

                const currentStats = {
                    jobs: document.getElementById('jobsCount').textContent,
                    gallons: document.getElementById('gallonsTotal').textContent,
                    hours: document.getElementById('hoursWorked').textContent,
                    miles: document.getElementById('milesDriven').textContent
                };

                const yesterdayStats = {
                    jobs: (yesterdayData || []).length,
                    gallons: (yesterdayData || []).reduce((sum, d) => sum + (d.gallons || 0), 0),
                    hours: yesterdayData ? (((new Date(yesterdayData[yesterdayData.length - 1]?.timestamp) - new Date(yesterdayData[0]?.timestamp)) / (1000 * 60 * 60)) || 0).toFixed(1) : '0',
                    miles: yesterdayData ? Math.round((yesterdayData.length * 10) + (((new Date(yesterdayData[yesterdayData.length - 1]?.timestamp) - new Date(yesterdayData[0]?.timestamp)) / (1000 * 60 * 60)) || 0) * 12) : '0'
                };

                const html = `
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div>
                            <h3 style="color: #60a5fa; margin-bottom: 12px;">Today (${dateStr})</h3>
                            <p>Jobs: ${currentStats.jobs}</p>
                            <p>Gallons: ${currentStats.gallons}</p>
                            <p>Hours: ${currentStats.hours}</p>
                            <p>Miles: ${currentStats.miles}</p>
                        </div>
                        <div>
                            <h3 style="color: var(--text-muted); margin-bottom: 12px;">Yesterday (${yesterday.toISOString().split('T')[0]})</h3>
                            <p>Jobs: ${yesterdayStats.jobs}</p>
                            <p>Gallons: ${yesterdayStats.gallons.toFixed(0)}</p>
                            <p>Hours: ${yesterdayStats.hours}</p>
                            <p>Miles: ${yesterdayStats.miles}</p>
                        </div>
                    </div>
                `;

                var _comp = document.getElementById('comparisonContent'); if(_comp) _comp.innerHTML = html;
                var _comp = document.getElementById('comparisonModal'); if(_comp) _comp.classList.add('show');
            } catch (err) {
                console.error('Comparison error:', err);
            }
        }

        function closeComparison() {
            var _comp = document.getElementById('comparisonModal'); if(_comp) _comp.classList.remove('show');
        }
    </script>
    

    <div style="position:fixed;top:16px;right:16px;z-index:9999;"></div>
<script src="hamburger-menu.js"></script>
<script src="global-search.js"></script>
<script src="notification-center.js"></script>
    <script src="theme-toggle.js"></script>
</body>
</html>
