<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | FleetConnect</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-dark: #0a0a0f; --bg-card: #12121a; --bg-input: #1a1a24; --border: #2a2a3a; --text-primary: #ffffff; --text-secondary: #8a8a9a; --text-muted: #5a5a6a; --accent: #00d4aa; --accent-blue: #00a8ff; --warning: #ffaa00; --error: #ff6b6b; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        .logo { font-family: 'Space Mono', monospace; font-size: 1.5rem; color: var(--accent); text-decoration: none; }
        .nav-right { display: flex; align-items: center; gap: 24px; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; margin-right: 24px; }
        .nav-links a.active { color: var(--accent-blue); }
        .logout-btn { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .header { display: flex; justify-content: space-between; margin-bottom: 32px; }
        .header h1 { font-size: 2rem; }
        .new-btn { padding: 12px 24px; background: var(--accent); color: var(--bg-dark); border: none; border-radius: 8px; font-weight: 600; text-decoration: none; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
        .stat { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
        .stat-value { font-size: 1.75rem; font-weight: 700; font-family: 'Space Mono', monospace; color: var(--accent); }
        .stat-label { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; }
        .tabs { display: flex; gap: 8px; margin-bottom: 24px; }
        .tab { padding: 10px 20px; background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--text-secondary); cursor: pointer; }
        .tab.active { background: var(--accent-blue); border-color: var(--accent-blue); color: white; }
        .jobs { display: flex; flex-direction: column; gap: 16px; }
        .job-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
        .job-header { display: flex; justify-content: space-between; margin-bottom: 16px; }
        .job-title { font-size: 1.1rem; font-weight: 600; }
        .status-badge { padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .status-badge.pending { background: rgba(255,170,0,0.15); color: var(--warning); }
        .status-badge.in-progress { background: rgba(0,212,170,0.15); color: var(--accent); }
        .status-badge.completed { background: rgba(100,100,100,0.15); color: var(--text-secondary); }
        .job-details { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 16px; background: var(--bg-input); border-radius: 8px; margin-bottom: 16px; }
        .job-detail-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
        .job-actions { display: flex; gap: 12px; justify-content: flex-end; padding-top: 16px; border-top: 1px solid var(--border); }
        .btn { padding: 10px 20px; border-radius: 8px; cursor: pointer; font-family: 'DM Sans', sans-serif; }
        .btn-outline { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
        .btn-danger { background: transparent; color: var(--error); border: 1px solid var(--error); }
        .empty { text-align: center; padding: 60px; background: var(--bg-card); border-radius: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <nav class="nav">
            <a href="index.html" class="logo">FLEETCONNECT</a>
            <div class="nav-right">
                <div class="nav-links">
                    <a href="index.html">Home</a>
                    <a href="rental-dashboard.html" class="active">My Orders</a>
                    <a href="create-job.html">New Order</a>
                </div>
                <span id="userName" style="color: var(--text-secondary);"></span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </nav>
        <header class="header">
            <div><h1>My Orders</h1></div>
            <a href="create-job.html" class="new-btn">+ New Order</a>
        </header>
        <div class="stats">
            <div class="stat"><div class="stat-value" id="statActive">-</div><div class="stat-label">Active</div></div>
            <div class="stat"><div class="stat-value" id="statPending">-</div><div class="stat-label">Pending</div></div>
            <div class="stat"><div class="stat-value" id="statGallons">-</div><div class="stat-label">Total Gallons</div></div>
            <div class="stat"><div class="stat-value" id="statCompleted">-</div><div class="stat-label">Completed</div></div>
        </div>
        <div class="tabs">
            <button class="tab active" data-tab="active">Active</button>
            <button class="tab" data-tab="pending">Pending</button>
            <button class="tab" data-tab="completed">Completed</button>
        </div>
        <div class="jobs" id="jobs"><div class="empty">Loading...</div></div>
    </div>
    <script src="supabase-client.js"></script>
    <script>
        const currentUser = checkAuth(['rental']);
        if (currentUser) document.getElementById('userName').textContent = currentUser.name;
        let allJobs = [], allDeliveries = [], currentTab = 'active';
        async function loadData() {
            allJobs = await getAllJobs();
            allDeliveries = await getAllDeliveries();
            updateStats();
            renderJobs();
        }
        function updateStats() {
            document.getElementById('statActive').textContent = allJobs.filter(j => ['in-progress','accepted'].includes(j.status)).length;
            document.getElementById('statPending').textContent = allJobs.filter(j => ['pending','assigned'].includes(j.status)).length;
            document.getElementById('statCompleted').textContent = allJobs.filter(j => j.status === 'completed').length;
            document.getElementById('statGallons').textContent = allDeliveries.reduce((s,d) => s + parseFloat(d.gallons||0), 0).toFixed(0);
        }
        function renderJobs() {
            const filtered = currentTab === 'active' ? allJobs.filter(j => ['in-progress','accepted'].includes(j.status))
                : currentTab === 'pending' ? allJobs.filter(j => ['pending','assigned'].includes(j.status))
                : allJobs.filter(j => j.status === 'completed');
            const container = document.getElementById('jobs');
            if (!filtered.length) { container.innerHTML = '<div class="empty"><h3>No orders</h3></div>'; return; }
            container.innerHTML = filtered.map(job => `
                <div class="job-card">
                    <div class="job-header">
                        <div class="job-title">${job.job_site_name || 'Untitled'}</div>
                        <span class="status-badge ${job.status}">${job.status}</span>
                    </div>
                    <div class="job-details">
                        <div><div class="job-detail-label">Contract</div><div>${job.contract_number || '-'}</div></div>
                        <div><div class="job-detail-label">Location</div><div>${job.address_city||'-'}, ${job.address_state||'-'}</div></div>
                        <div><div class="job-detail-label">Date</div><div>${formatDate(job.date_out)}</div></div>
                        <div><div class="job-detail-label">Type</div><div>${formatJobType(job.job_type)}</div></div>
                    </div>
                    <div class="job-actions">
                        <button class="btn btn-outline" onclick="viewDeliveries('${job.id}')">Deliveries</button>
                        ${job.status !== 'completed' ? `<button class="btn btn-danger" onclick="closeJob('${job.id}')">Close Job</button>` : ''}
                    </div>
                </div>
            `).join('');
        }
        async function closeJob(id) { if(confirm('Close job?')) { await updateJobStatus(id, 'completed'); loadData(); }}
        async function viewDeliveries(jobId) {
            const d = await getDeliveriesForJob(jobId);
            const total = d.reduce((s,x)=>s+parseFloat(x.gallons),0);
            const html = d.length ? d.map(x=>`<div style="padding:12px;background:var(--bg-input);border-radius:8px;margin-bottom:8px;"><strong style="color:var(--accent)">${x.gallons} gal</strong><br><small style="color:var(--text-muted)">${new Date(x.timestamp).toLocaleString()}</small></div>`).join('') : '<p style="text-align:center;color:var(--text-muted)">No deliveries</p>';
            const m = document.createElement('div');
            m.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:1000;';
            m.innerHTML = `<div style="background:var(--bg-card);border-radius:16px;padding:24px;width:90%;max-width:400px;max-height:80vh;overflow-y:auto;"><div style="display:flex;justify-content:space-between;margin-bottom:16px;"><h3>Deliveries (${total.toFixed(1)} gal)</h3><button onclick="this.closest('div').parentElement.remove()" style="background:none;border:none;color:var(--text-secondary);font-size:1.5rem;cursor:pointer;">&times;</button></div>${html}</div>`;
            document.body.appendChild(m);
        }
        document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',function(){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));this.classList.add('active');currentTab=this.dataset.tab;renderJobs();}));
        loadData();
    </script>
</body>
</html>
