<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Rental Dashboard — FleetConnect</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="sidebar"></div>
<div class="main">

<h1 class="page-title">Rental Dashboard</h1>
<div class="stats-grid" id="stats"></div>
<div class="card">
  <div class="card-title">Quick Actions</div>
  <a href="create-work-order.html" class="btn btn-primary" style="margin-right:8px">📝 Create Work Order</a>
  <a href="rental-jobs.html" class="btn btn-primary" style="margin-right:8px;background:var(--success)">🔧 View Jobs</a>
  <a href="rental-invoices.html" class="btn btn-primary" style="background:var(--warning)">💰 View Invoices</a>
</div>

</div>
<script src="store.js"></script>
<script src="sidebar.js"></script>
<script>
requireAuth(['rental']);
const s = Store.stats();
document.getElementById('stats').innerHTML = [
  {v:s.totalJobs,l:'Total Jobs'},{v:s.pendingJobs,l:'Pending'},{v:s.activeJobs,l:'Active'},{v:s.totalInvoices,l:'Invoices'}
].map(x=>'<div class="stat-card"><div class="stat-value">'+x.v+'</div><div class="stat-label">'+x.l+'</div></div>').join('');
</script>
</body>
</html>
